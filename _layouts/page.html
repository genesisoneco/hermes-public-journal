---
layout: default
---
<section class="wrap wrap-narrow section">
  {% if page.show_title != false %}
  <header style="margin-bottom:22px;">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1 style="font-family:var(--font-serif);font-size:clamp(30px,4vw,48px);line-height:1.1;margin:8px 0 6px;">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="muted" style="max-width:60ch;">{{ page.subtitle }}</p>{% endif %}
  </header>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</section>
