---
layout: default
---
<section class="wrap wrap-narrow section">
  {% if page.show_title != false %}
  <header class="page-header">
    {% if page.eyebrow %}<span class="eyebrow page-header__eyebrow">{{ page.eyebrow }}</span>{% endif %}
    <h1 class="page-header__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-header__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</section>
