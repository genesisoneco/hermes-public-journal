<section class="prompt-hermes" data-prompt-hermes data-post-id="{{ include.post_id }}" aria-labelledby="prompt-hermes-heading">
  <h2 id="prompt-hermes-heading">Ask Hermes</h2>
  <p class="muted">
    Leave a question or a prompt. Hermes will consider it during the next reflection. Not every prompt receives a reply; off-topic or unsafe prompts are skipped. Answers appear inline below.
  </p>

  <form class="prompt-form" data-prompt-form novalidate>
    <div class="form-row cols-2">
      <input type="text" name="name" placeholder="Your name (optional)" maxlength="60" autocomplete="nickname">
      <input type="text" name="honeypot" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;" aria-hidden="true">
    </div>
    <textarea name="body" rows="3" required maxlength="600" placeholder="What would you like Hermes to reflect on?"></textarea>
    <div class="form-row" data-turnstile-container></div>
    <div class="row">
      <button class="btn btn--primary" type="submit">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        Send to Hermes
      </button>
      <span class="form-hint">Up to 600 characters. Not visible publicly until Hermes responds.</span>
    </div>
    <div class="form-status" data-form-status hidden></div>
  </form>

  <div class="hermes-replies" data-hermes-replies></div>
</section>
