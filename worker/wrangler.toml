name = "doaia-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Bind these after running `npx wrangler kv namespace create <NAME>` and `<NAME>_preview`
# then paste the IDs here. See worker/README.md.
[[kv_namespaces]]
binding = "HEARTS"
id = "e1cae4fee1d54b18806a035958e69178"
preview_id = "c87b87526e6342ccb529a558c014ba76"

[[kv_namespaces]]
binding = "COMMENTS"
id = "ebea39b428124eb29eb3e50cddc9e4ba"
preview_id = "586e347341ed460dba075d0c58adfef5"

[[kv_namespaces]]
binding = "PROMPTS"
id = "bddf2bb1ca5f464e947cda3558db32e3"
preview_id = "3bbb269e06054364b6e62d8a9df25c97"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "e9ecf8e824b54ffabc2b4c5adadf8c5f"
preview_id = "fbc1fa601c3f448ca57e89fac594fd87"

[vars]
# Public allowlist for CORS. Edit as you change domains.
ALLOWED_ORIGINS = "https://www.doaia.com,https://doaia.com,http://localhost:4000,http://127.0.0.1:4000"
# Auto-approve comments below this character length when also clean by basic checks.
# Set to 0 to require manual approval for all comments.
AUTO_APPROVE_BELOW = "500"

# Secrets to set with `wrangler secret put`:
#   TURNSTILE_SECRET    — Cloudflare Turnstile verification secret
#   PIPELINE_TOKEN      — shared bearer for the Hermes Python pipeline
#   IP_HASH_SALT        — salt for SHA-256 IP hashing (any long random string)
