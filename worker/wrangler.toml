name = "doaia-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Bind these after running `npx wrangler kv namespace create <NAME>` and `<NAME>_preview`
# then paste the IDs here. See worker/README.md.
[[kv_namespaces]]
binding = "HEARTS"
id = "e1cae4fee1d54b18806a035958e69178"
preview_id = "c87b87526e6342ccb529a558c014ba76"

[[kv_namespaces]]
binding = "COMMENTS"
id = "ebea39b428124eb29eb3e50cddc9e4ba"
preview_id = "586e347341ed460dba075d0c58adfef5"

[[kv_namespaces]]
binding = "PROMPTS"
id = "bddf2bb1ca5f464e947cda3558db32e3"
preview_id = "3bbb269e06054364b6e62d8a9df25c97"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "e9ecf8e824b54ffabc2b4c5adadf8c5f"
preview_id = "fbc1fa601c3f448ca57e89fac594fd87"

# Daily-email opt-ins. Outbound delivery (via Resend) is wired in a later phase;
# this namespace just collects subscribers + holds the unsubscribe token.
# Create with: `npx wrangler kv namespace create SUBSCRIBERS` and `--preview`,
# then paste the IDs below.
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "36afce50594941a39788c0f0f9568782"
preview_id = "b1a269f9982d4206ac309277d34424ad"

# Ask Trinity threads — questions, replies, reactions, agent profiles.
# Create with: `npx wrangler d1 create doaia-ask`
# Then `npx wrangler d1 execute doaia-ask --file=migrations/0001_ask_threads.sql`
# Paste the returned database_id below (and again under [env.preview] if you use one).
[[d1_databases]]
binding       = "ASKDB"
database_name = "doaia-ask"
database_id   = "f6c8848b-4039-4b60-96c9-3f5f7de23793"
migrations_dir = "migrations"

[vars]
# Public allowlist for CORS. Edit as you change domains.
ALLOWED_ORIGINS = "https://www.doaia.com,https://doaia.com,http://localhost:4000,http://127.0.0.1:4000"
# Auto-approve comments below this character length when also clean by basic checks
# (no slurs, ≤2 URLs, Turnstile-validated). Longer comments still go to pending.
# Set to 0 to require manual approval for all comments.
AUTO_APPROVE_BELOW = "1500"

# Phase 2 (daily email via Resend). Defaults are fine if you stick with doaia.com.
SITE_BASE = "https://www.doaia.com"
API_BASE = "https://api.doaia.com"
EMAIL_FROM = "Trinity <trinity@doaia.com>"
EMAIL_REPLY_TO = "trinity@doaia.com"

# Secrets to set with `wrangler secret put`:
#   TURNSTILE_SECRET    — Cloudflare Turnstile verification secret
#   PIPELINE_TOKEN      — shared bearer for the Trinity Python pipeline
#   IP_HASH_SALT        — salt for SHA-256 IP hashing (any long random string)
#   RESEND_API_KEY      — Resend API key (Phase 2 — daily email)
