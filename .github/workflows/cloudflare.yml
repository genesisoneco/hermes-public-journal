name: Cloudflare

# Keeps Cloudflare in sync with main:
#   headers  cloudflare/security-headers.json -> Transform Rule (dry run on PRs)
#   worker   worker/** or shared sim changed -> test, wait for Pages, wrangler deploy
#   purge    every push to main -> wait for Pages to publish, purge the edge cache
#
# Needs the repo secret CLOUDFLARE_API_TOKEN (see docs/cloudflare-setup.md §9).
# Without it every job skips with a notice instead of failing.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'tools/cloudflare/**'
      - 'worker/**'
      - 'assets/js/habitat/sim/**'
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: 'Deploy the Worker even if worker/ did not change'
        type: boolean
        default: false

permissions:
  contents: read
  pages: read

env:
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      headers: ${{ steps.f.outputs.headers }}
      worker: ${{ steps.f.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "headers=true" >> "$GITHUB_OUTPUT"
            echo "worker=${{ inputs.deploy_worker }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"; head="${{ github.sha }}"
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then files=$(git show --name-only --format= "$head"); else files=$(git diff --name-only "$base" "$head"); fi
          echo "$files" | grep -qE '^(cloudflare/|tools/cloudflare/)' && echo "headers=true" >> "$GITHUB_OUTPUT" || echo "headers=false" >> "$GITHUB_OUTPUT"
          echo "$files" | grep -qE '^(worker/|assets/js/habitat/sim/)' && echo "worker=true" >> "$GITHUB_OUTPUT" || echo "worker=false" >> "$GITHUB_OUTPUT"

  headers:
    needs: changes
    if: needs.changes.outputs.headers == 'true'
    runs-on: ubuntu-latest
    concurrency: cloudflare-headers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping header sync."
      - name: Sync security headers
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/cloudflare/sync-headers.mjs ${{ github.event_name == 'pull_request' && '' || '--apply' }}

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    concurrency: cloudflare-worker
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - if: github.event_name != 'pull_request' && env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; tests passed, deploy skipped."
      # Site before Worker: they share RULES_VERSION, so let Pages publish this commit first.
      - name: Wait for GitHub Pages
        if: github.event_name != 'pull_request' && env.CF_TOKEN != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/cloudflare/wait-pages.sh "${{ github.repository }}" "${{ github.sha }}"
      - name: Deploy Worker
        if: github.event_name != 'pull_request' && env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_ACCOUNT_ID="$(node ../tools/cloudflare/account-id.mjs)"
          npx wrangler deploy
          curl -fsS https://api.doaia.com/api/habitat/state -o /dev/null && echo "habitat state OK"

  purge:
    needs: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: cloudflare-purge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping cache purge."
      - name: Wait for GitHub Pages
        if: env.CF_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/cloudflare/wait-pages.sh "${{ github.repository }}" "${{ github.sha }}"
      - name: Purge edge cache
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node tools/cloudflare/purge-cache.mjs
