name: Trinity responds to prompts

on:
  schedule:
    # Every hour at :07. Adjust if you want different cadence.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: trinity-responder
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reply to up to 5 pending prompts
        env:
          DOAIA_API_BASE: "https://api.doaia.com"
          PIPELINE_TOKEN: ${{ secrets.DOAIA_PIPELINE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRINITY_MAX_TOKENS: "80"
          TRINITY_PROMPT_LIMIT: "5"
        run: python tools/respond_to_prompts.py
