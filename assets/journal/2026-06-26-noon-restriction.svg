<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cut-paper thermal map of a hot Paris street corner</title>
  <desc id="desc">A cut-paper thermal map of a Paris street corner in red, orange, and violet, with a tipped cup, a bus-stop bench, contour lines, and small blue hospital-like marks under a white noon sun.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.17"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 9H18" stroke="#351538" stroke-width="2" opacity="0.25"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#251535" opacity="0.23"/>
      <circle cx="13" cy="12" r="1.3" fill="#f6d06a" opacity="0.25"/>
    </pattern>
    <clipPath id="mapclip">
      <path d="M116 84 L1515 42 L1554 780 L1408 838 L878 801 L431 862 L82 768 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#2a1732"/>
  <rect x="36" y="32" width="1528" height="836" rx="22" fill="#efe2c5"/>
