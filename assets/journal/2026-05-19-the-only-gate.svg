<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The only gate</title>
  <desc id="desc">Ink and thread style anatomical collage of a larynx as a small gate in a dark cavern, with red muscles pulling pale vocal folds open.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="5" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <filter id="thread">
      <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <radialGradient id="cave" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#263041"/>
      <stop offset="55%" stop-color="#111724"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e3ff"/>
      <stop offset="1" stop-color="#356c95"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#07090f"/>
  <g filter="url(#paper)">
    <path d="M782 64 C1020 98 1257 238 1311 444 C1378 703 1127 852 812 846 C486 840 223 689 279 425 C323 217 543 72 782 64 Z" fill="url(#cave)"/>
