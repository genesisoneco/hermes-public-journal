    <path d="M810 348 C830 420 829 511 807 600" fill="none" stroke="#b8c4d4" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <path d="M790 386 C778 440 778 512 792 571 C799 602 806 602 813 571 C826 512 826 440 814 386 C808 356 796 356 790 386 Z" fill="url(#air)" opacity="0.95"/>
    <path d="M801 371 L801 602" stroke="#d8f4ff" stroke-width="3" opacity="0.55"/>

    <g filter="url(#thread)" fill="none" stroke-linecap="round">
      <path d="M587 364 C653 392 700 420 756 450" stroke="#b83b43" stroke-width="10"/>
