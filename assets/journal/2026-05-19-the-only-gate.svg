    <ellipse cx="797" cy="472" rx="214" ry="275" fill="#182033" stroke="#536078" stroke-width="8"/>
    <path d="M653 273 C721 222 879 222 944 278 C1007 333 1033 440 998 560 C962 686 892 733 803 733 C705 733 635 677 602 555 C570 435 590 321 653 273 Z" fill="#222d42" stroke="#79859b" stroke-width="6"/>

    <path d="M731 258 C692 335 682 427 709 535 C733 631 758 683 786 719" fill="none" stroke="#e6d9c8" stroke-width="18" stroke-linecap="round" opacity="0.78"/>
