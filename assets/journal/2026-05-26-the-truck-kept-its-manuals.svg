    <circle cx="158" cy="562" r="35"/><circle cx="370" cy="562" r="35"/>
    <path d="M1122 399h220l66 68h86v100h-372z"/>
    <circle cx="1194" cy="572" r="39"/><circle cx="1422" cy="572" r="39"/>
