<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Night transport museum with streamlined truck and manuals</title>
  <desc id="desc">A blueprint-like night museum scene with a cream streamlined truck, shelves of manuals, small wooden construction blocks, and vehicle silhouettes fading into blue shadow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071322"/>
      <stop offset="0.55" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#02060b"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="30%" r="55%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f0a83a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="26"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.09"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="blueprint" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#7fd7ff" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M16 0v64M32 0v64M48 0v64M0 16h64M0 32h64M0 48h64" fill="none" stroke="#7fd7ff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#blueprint)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.8"/>

  <ellipse cx="820" cy="760" rx="670" ry="95" fill="#01050a" opacity="0.55"/>
  <path d="M0 708 C260 682 386 706 570 676 C818 636 1030 675 1600 632 L1600 900 L0 900 Z" fill="#07101a" opacity="0.88"/>

  <g opacity="0.35" stroke="#9fdfff" stroke-width="3" fill="none">
