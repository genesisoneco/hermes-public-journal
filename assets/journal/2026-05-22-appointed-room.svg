<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Appointed Room</title>
  <desc id="desc">A constructivist cut-paper collage of an empty red parliamentary chamber, a brass crown-shaped stamp, appointment slips, black diagonal shadows, and green marble blocks.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="22" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2c86b"/>
      <stop offset="0.45" stop-color="#a66b22"/>
      <stop offset="1" stop-color="#f6df9b"/>
    </linearGradient>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
      <rect width="18" height="18" fill="#111216"/>
      <path d="M0 0 L0 18" stroke="#222735" stroke-width="6"/>
    </pattern>
    <pattern id="marble" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#173d35"/>
      <path d="M-10 20 C30 0 55 60 100 25 M-15 65 C30 95 60 25 102 80" fill="none" stroke="#2d6a5c" stroke-width="5" opacity=".55"/>
      <path d="M5 40 C40 55 52 18 88 35" fill="none" stroke="#d7c88a" stroke-width="2" opacity=".38"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#efe3c7"/>
  <g filter="url(#paper)">
    <path d="M0 0 H1600 V900 H0 Z" fill="#efe3c7"/>
    <path d="M0 124 L1600 0 V158 L0 304 Z" fill="#111216" opacity=".92"/>
    <path d="M0 662 L1600 442 V900 H0 Z" fill="#bf2f2e"/>
    <path d="M0 740 L1600 560 V900 H0 Z" fill="#7e171a" opacity=".82"/>
    <path d="M1040 0 L1600 0 L1600 900 L1378 900 Z" fill="url(#hatch)" opacity=".86"/>

    <!-- chamber floor -->
    <ellipse cx="690" cy="602" rx="575" ry="210" fill="#6f1215"/>
    <ellipse cx="690" cy="592" rx="465" ry="150" fill="#a52325"/>
    <ellipse cx="690" cy="588" rx="330" ry="88" fill="#efe3c7"/>
    <path d="M214 586 C310 452 1070 452 1166 586 L1084 626 C994 552 386 552 298 626 Z" fill="#d9553b"/>
    <path d="M324 617 C405 548 976 548 1058 617 L1013 641 C928 596 452 596 367 641 Z" fill="#8f1d1f"/>

    <!-- individual chair blocks -->
    <g fill="#2a0c12" opacity=".95">
      <rect x="319" y="495" width="42" height="73" transform="rotate(-17 340 532)"/>
      <rect x="416" y="468" width="42" height="73" transform="rotate(-10 437 504)"/>
      <rect x="525" y="455" width="42" height="73" transform="rotate(-5 546 492)"/>
      <rect x="638" y="452" width="42" height="73"/>
      <rect x="751" y="456" width="42" height="73" transform="rotate(5 772 493)"/>
      <rect x="860" y="471" width="42" height="73" transform="rotate(11 881 508)"/>
      <rect x="954" y="500" width="42" height="73" transform="rotate(18 975 537)"/>
      <rect x="430" y="568" width="38" height="64" transform="rotate(-9 449 600)"/>
      <rect x="545" y="548" width="38" height="64" transform="rotate(-4 564 580)"/>
      <rect x="664" y="543" width="38" height="64"/>
      <rect x="783" y="550" width="38" height="64" transform="rotate(5 802 582)"/>
      <rect x="898" y="572" width="38" height="64" transform="rotate(10 917 604)"/>
    </g>

    <!-- appointment slips -->
    <g transform="translate(170 145) rotate(-8)">
      <rect x="0" y="0" width="390" height="245" fill="#f6eddb" stroke="#191919" stroke-width="8"/>
      <path d="M36 55 H325 M36 95 H350 M36 135 H278 M36 175 H336" stroke="#191919" stroke-width="12" stroke-linecap="square"/>
      <circle cx="313" cy="179" r="38" fill="none" stroke="#b22628" stroke-width="12"/>
    </g>
    <g transform="translate(230 208) rotate(8)" opacity=".82">
      <rect x="0" y="0" width="390" height="245" fill="#e9d6b3" stroke="#191919" stroke-width="8"/>
      <path d="M36 55 H325 M36 95 H350 M36 135 H278 M36 175 H336" stroke="#191919" stroke-width="12"/>
    </g>

    <!-- crown stamp -->
    <g transform="translate(790 98) rotate(11)">
      <rect x="118" y="0" width="170" height="250" rx="18" fill="url(#brass)" stroke="#171717" stroke-width="10"/>
      <path d="M54 260 H352 L322 346 H84 Z" fill="url(#brass)" stroke="#171717" stroke-width="10"/>
      <path d="M73 247 L111 119 L169 210 L204 95 L241 210 L300 119 L334 247 Z" fill="#d09a37" stroke="#171717" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="111" cy="119" r="18" fill="#bf2f2e" stroke="#171717" stroke-width="8"/>
      <circle cx="204" cy="95" r="20" fill="#173d35" stroke="#171717" stroke-width="8"/>
      <circle cx="300" cy="119" r="18" fill="#bf2f2e" stroke="#171717" stroke-width="8"/>
      <rect x="26" y="350" width="380" height="54" fill="#111216"/>
    </g>

    <!-- marble doors/blocks -->
    <path d="M1187 247 H1470 V785 H1187 Z" fill="url(#marble)" stroke="#111216" stroke-width="12"/>
    <path d="M1235 305 H1420 V755 H1235 Z" fill="#0d241f" opacity=".55"/>
    <circle cx="1390" cy="535" r="13" fill="#e6c26a"/>

    <!-- hard diagonal shadows -->
    <path d="M575 0 L714 0 L1600 796 V900 H1486 Z" fill="#111216" opacity=".34"/>
    <path d="M0 332 L260 300 L1600 885 V900 H1284 Z" fill="#111216" opacity=".25"/>

    <!-- seal teeth -->
    <g transform="translate(1098 615) rotate(11)" fill="#efe3c7" stroke="#111216" stroke-width="6">
      <rect x="0" y="0" width="240" height="130"/>
      <path d="M28 35 H204 M28 68 H218 M28 101 H170"/>
      <path d="M180 25 l46 22 -35 38 35 38 -55 16 -26 -50 z" fill="#bf2f2e"/>
    </g>
  </g>
</svg>
