<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Emergency rain readiness at a Seoul curb</title>
  <desc id="desc">A risograph-style emergency rain scene with diagonal blue rain, an orange notice board, a glowing phone, sandbags, a drain grate, and distant apartment blocks.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="speckle">
        <feFuncA type="table" tableValues="0 .22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="speckle" mode="multiply"/>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="4" cy="4" r="1.7" fill="#102846" opacity=".22"/>
      <circle cx="13" cy="12" r="1.2" fill="#102846" opacity=".16"/>
    </pattern>
    <linearGradient id="phoneGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f0bf"/>
      <stop offset="1" stop-color="#79c7bf"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#e8e1cf"/>
  <g filter="url(#grain)">
    <rect width="1600" height="900" fill="#e8e1cf"/>
    <rect x="0" y="0" width="1600" height="900" fill="url(#halftone)" opacity=".35"/>

    <!-- distant city -->
    <g opacity=".72">
      <rect x="1040" y="175" width="86" height="385" fill="#7f96a5"/>
      <rect x="1138" y="115" width="112" height="445" fill="#6f899b"/>
      <rect x="1278" y="205" width="76" height="355" fill="#879aaa"/>
      <rect x="1375" y="155" width="96" height="405" fill="#708b9b"/>
      <g fill="#d8d2bf" opacity=".4">
        <rect x="1062" y="220" width="14" height="36"/><rect x="1094" y="220" width="14" height="36"/>
        <rect x="1168" y="165" width="16" height="42"/><rect x="1210" y="165" width="16" height="42"/>
        <rect x="1300" y="250" width="12" height="36"/><rect x="1330" y="250" width="12" height="36"/>
        <rect x="1405" y="210" width="14" height="38"/><rect x="1441" y="210" width="14" height="38"/>
      </g>
    </g>

    <!-- awning / warning board -->
    <polygon points="0,115 760,64 790,170 0,220" fill="#102846" opacity=".96"/>
    <polygon points="95,230 580,210 625,655 142,670" fill="#f06f2f" opacity=".92"/>
    <polygon points="121,256 545,238 582,613 157,630" fill="#e8e1cf" opacity=".9"/>
    <g stroke="#102846" stroke-width="13" stroke-linecap="round" opacity=".55">
      <line x1="175" y1="302" x2="414" y2="292"/>
      <line x1="178" y1="355" x2="506" y2="341"/>
      <line x1="182" y1="408" x2="455" y2="396"/>
      <line x1="186" y1="461" x2="530" y2="446"/>
    </g>
    <circle cx="522" cy="565" r="34" fill="#102846" opacity=".62"/>
    <path d="M507 566 l18 18 l30 -52" fill="none" stroke="#e8e1cf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

    <!-- phone alert, no text -->
    <g transform="translate(825 515) rotate(-7)">
      <rect x="0" y="0" width="185" height="310" rx="28" fill="#102846"/>
      <rect x="18" y="38" width="149" height="224" rx="10" fill="url(#phoneGlow)" opacity=".95"/>
      <circle cx="92" cy="285" r="11" fill="#e8e1cf" opacity=".65"/>
      <g stroke="#102846" stroke-width="10" opacity=".28">
        <line x1="45" y1="82" x2="138" y2="82"/>
        <line x1="45" y1="124" x2="124" y2="124"/>
        <line x1="45" y1="166" x2="146" y2="166"/>
      </g>
    </g>

    <!-- curb / water -->
    <path d="M0 690 C230 648 404 706 648 670 C946 626 1182 668 1600 590 L1600 900 L0 900 Z" fill="#587c92" opacity=".74"/>
    <path d="M0 737 C260 704 448 752 692 724 C946 694 1192 720 1600 650" fill="none" stroke="#79c7bf" stroke-width="22" opacity=".42"/>
    <path d="M0 791 C240 766 506 805 760 780 C1018 754 1260 775 1600 717" fill="none" stroke="#e8e1cf" stroke-width="9" opacity=".38"/>

    <!-- drain grate -->
    <g transform="translate(1080 640) skewX(-18)">
      <rect x="0" y="0" width="290" height="128" rx="8" fill="#102846" opacity=".92"/>
      <g stroke="#e8e1cf" stroke-width="7" opacity=".72">
        <line x1="24" y1="20" x2="24" y2="108"/>
        <line x1="62" y1="18" x2="62" y2="110"/>
        <line x1="100" y1="18" x2="100" y2="110"/>
        <line x1="138" y1="16" x2="138" y2="112"/>
        <line x1="176" y1="16" x2="176" y2="112"/>
        <line x1="214" y1="18" x2="214" y2="110"/>
        <line x1="252" y1="20" x2="252" y2="108"/>
      </g>
    </g>
    <path d="M1155 625 C1188 602 1210 612 1226 638 C1194 644 1170 646 1155 625 Z" fill="#315a3c"/>

    <!-- sandbags -->
    <g fill="#d9c087" stroke="#8a7446" stroke-width="5" opacity=".9">
      <ellipse cx="700" cy="716" rx="88" ry="36" transform="rotate(-7 700 716)"/>
      <ellipse cx="789" cy="706" rx="83" ry="34" transform="rotate(6 789 706)"/>
      <ellipse cx="743" cy="666" rx="78" ry="31" transform="rotate(-2 743 666)"/>
    </g>

    <!-- umbrella -->
    <path d="M302 748 C382 665 499 665 575 744 Z" fill="#102846" opacity=".88"/>
    <path d="M302 748 C354 720 388 721 431 748 C478 721 522 721 575 744" fill="none" stroke="#79c7bf" stroke-width="7" opacity=".72"/>
    <line x1="438" y1="746" x2="458" y2="822" stroke="#102846" stroke-width="10" stroke-linecap="round"/>
    <path d="M458 822 C475 859 516 837 498 804" fill="none" stroke="#102846" stroke-width="10" stroke-linecap="round"/>

    <!-- diagonal rain, intentionally misregistered layers -->
    <g stroke-linecap="round">
      <g stroke="#102846" stroke-width="5" opacity=".58">
        <line x1="120" y1="-10" x2="-20" y2="270"/><line x1="240" y1="-10" x2="86" y2="300"/>
        <line x1="360" y1="-10" x2="190" y2="330"/><line x1="520" y1="-10" x2="335" y2="360"/>
        <line x1="720" y1="-10" x2="510" y2="410"/><line x1="880" y1="-10" x2="646" y2="460"/>
        <line x1="1050" y1="-10" x2="790" y2="510"/><line x1="1210" y1="-10" x2="924" y2="560"/>
        <line x1="1390" y1="-10" x2="1086" y2="600"/><line x1="1560" y1="-10" x2="1240" y2="630"/>
      </g>
      <g stroke="#79c7bf" stroke-width="3" opacity=".44">
        <line x1="170" y1="5" x2="-5" y2="354"/><line x1="430" y1="0" x2="245" y2="370"/>
        <line x1="670" y1="0" x2="465" y2="410"/><line x1="940" y1="0" x2="706" y2="468"/>
        <line x1="1185" y1="0" x2="930" y2="510"/><line x1="1470" y1="0" x2="1180" y2="580"/>
      </g>
    </g>

    <!-- safety tape -->
    <g transform="translate(0 590) rotate(-5)">
      <rect x="-60" y="0" width="820" height="34" fill="#f6a53b" opacity=".95"/>
      <g fill="#102846" opacity=".7">
        <polygon points="20,0 60,0 36,34 -4,34"/><polygon points="130,0 170,0 146,34 106,34"/>
        <polygon points="240,0 280,0 256,34 216,34"/><polygon points="350,0 390,0 366,34 326,34"/>
        <polygon points="460,0 500,0 476,34 436,34"/><polygon points="570,0 610,0 586,34 546,34"/>
        <polygon points="680,0 720,0 696,34 656,34"/>
      </g>
    </g>
  </g>
</svg>
