<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Claim form under fluorescent light</title>
  <desc id="desc">A dawn construction frame, translucent paperwork grid, paperclip marks, work gloves, and an empty ID sleeve.</desc>
  <defs>
    <pattern id="security" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M0 32 C16 0 48 0 64 32 C48 64 16 64 0 32Z" fill="none" stroke="#6aa399" stroke-width="1" opacity="0.22"/>
      <path d="M32 0 C64 16 64 48 32 64 C0 48 0 16 32 0Z" fill="none" stroke="#233a4b" stroke-width="0.8" opacity="0.18"/>
    </pattern>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#1d2b35" opacity="0.28"/>
      <circle cx="13" cy="12" r="1.1" fill="#1d2b35" opacity="0.18"/>
    </pattern>
    <linearGradient id="dawn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#162636"/>
      <stop offset="0.48" stop-color="#31475a"/>
      <stop offset="1" stop-color="#d7834f"/>
    </linearGradient>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="17"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>
  </defs>

  <rect width="1600" height="900" fill="#d9d1bf"/>
  <rect width="1600" height="900" fill="url(#dawn)" opacity="0.82"/>
  <rect width="1600" height="900" fill="url(#halftone)" opacity="0.38"/>

  <!-- unfinished plant frame -->
  <g opacity="0.74" stroke="#1b2a35" stroke-width="12" stroke-linecap="square" fill="none" filter="url(#rough)">
    <path d="M115 735 L318 238 L525 735 M272 355 L483 355 M232 462 L441 462 M192 574 L399 574"/>
    <path d="M472 735 L642 172 L810 735 M600 292 L765 292 M565 416 L724 416 M530 548 L688 548"/>
    <path d="M785 735 L1000 210 L1210 735 M944 330 L1161 330 M905 450 L1116 450 M862 576 L1072 576"/>
    <path d="M110 735 H1275"/>
    <path d="M147 677 L1205 255 M331 735 L1290 355 M620 735 L1298 455" stroke-width="5" opacity="0.75"/>
  </g>

  <!-- cold table -->
  <polygon points="0,690 1600,620 1600,900 0,900" fill="#7f8b8d" opacity="0.92"/>
  <polygon points="0,704 1600,634 1600,668 0,742" fill="#c7d1cc" opacity="0.35"/>

  <!-- translucent claim form -->
  <g transform="rotate(-5 850 445)">
    <rect x="410" y="140" width="800" height="560" rx="10" fill="#eef1e5" opacity="0.78" stroke="#203343" stroke-width="5"/>
    <rect x="410" y="140" width="800" height="560" rx="10" fill="url(#security)" opacity="0.72"/>
    <g stroke="#263b4a" stroke-width="2" opacity="0.64">
      <path d="M450 215 H1168 M450 290 H1168 M450 365 H1168 M450 440 H1168 M450 515 H1168 M450 590 H1168"/>
      <path d="M560 175 V665 M710 175 V665 M905 175 V665 M1040 175 V665"/>
    </g>
    <g fill="#35495b" opacity="0.35">
      <rect x="455" y="182" width="230" height="12" rx="6"/><rect x="455" y="242" width="122" height="9" rx="4"/>
      <rect x="736" y="242" width="280" height="9" rx="4"/><rect x="455" y="319" width="410" height="9" rx="4"/>
      <rect x="455" y="392" width="210" height="9" rx="4"/><rect x="735" y="392" width="360" height="9" rx="4"/>
      <rect x="455" y="468" width="510" height="9" rx="4"/><rect x="455" y="546" width="185" height="9" rx="4"/>
      <rect x="735" y="546" width="305" height="9" rx="4"/><rect x="455" y="620" width="430" height="9" rx="4"/>
    </g>
  </g>

  <!-- many paperclip marks along margin -->
  <g transform="translate(1265 128) rotate(7)" fill="none" stroke="#dce7df" stroke-width="3" opacity="0.92">
    <g>
      <path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/>
    </g>
    <g transform="translate(8 58) scale(.72)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
    <g transform="translate(-11 104) scale(.58)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
    <g transform="translate(10 142) scale(.66)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
    <g transform="translate(-4 194) scale(.49)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
    <g transform="translate(7 232) scale(.61)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
    <g transform="translate(-12 282) scale(.53)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
    <g transform="translate(9 322) scale(.7)"><path d="M0 0 c20 -14 36 10 18 24 l-36 29 c-29 22 -57 -17 -26 -42 l53 -42 c42 -32 83 29 38 65 l-47 38"/></g>
  </g>

  <!-- gloves -->
  <g transform="translate(235 620) rotate(-13)" filter="url(#rough)">
    <path d="M92 96 c-30 -7 -47 -25 -45 -57 l8 -122 c2 -21 34 -20 37 0 l5 80 13 -130 c3 -25 41 -21 40 6 l-2 118 24 -131 c5 -24 42 -16 36 11 l-22 126 38 -90 c10 -24 43 -9 34 17 l-48 119 c-16 40 -63 61 -118 53Z" fill="#303a36" stroke="#111a1b" stroke-width="5"/>
    <path d="M135 103 c-33 -2 -57 -21 -63 -52 l-27 -117 c-5 -20 25 -30 35 -12 l34 73 -22 -127 c-4 -25 34 -32 40 -6 l29 114 -1 -133 c0 -25 38 -27 41 0 l13 129 16 -98 c4 -24 40 -21 38 7 l-8 128 c-3 52 -56 98 -125 94Z" fill="#4d594f" stroke="#111a1b" stroke-width="5"/>
    <path d="M82 76 c31 18 84 22 125 4" stroke="#a7b1a6" stroke-width="7" opacity="0.45"/>
  </g>

  <!-- ID-card sleeve -->
  <g transform="translate(1015 690) rotate(8)">
    <rect x="0" y="0" width="265" height="158" rx="18" fill="#dcebee" opacity="0.52" stroke="#f0fff8" stroke-width="7"/>
    <rect x="22" y="26" width="65" height="65" rx="7" fill="#93aaa8" opacity="0.45"/>
    <rect x="105" y="34" width="116" height="10" rx="5" fill="#51616a" opacity="0.28"/>
    <rect x="105" y="62" width="86" height="10" rx="5" fill="#51616a" opacity="0.22"/>
    <rect x="105" y="91" width="133" height="10" rx="5" fill="#51616a" opacity="0.18"/>
    <circle cx="132" cy="143" r="10" fill="#f6fbf3" opacity="0.76"/>
  </g>

  <!-- fluorescent light -->
  <g transform="rotate(-4 840 90)">
    <rect x="235" y="60" width="1130" height="32" rx="16" fill="#f8ffe7" opacity="0.92"/>
    <rect x="235" y="92" width="1130" height="120" fill="#f8ffe7" opacity="0.13"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#121a22" stroke-width="18" opacity="0.55"/>
</svg>
