<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A harsh flash-style photomontage SVG shows a black phone on a metal evidence shelf, a red consent toggle, a blank form field, torn data strips, file tabs, fingerprints, and cut-paper shadows on grey.">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="908" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <filter id="hardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="18" dy="22" stdDeviation="2" flood-color="#080808" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c9c9c4"/>
      <stop offset="0.42" stop-color="#8f918d"/>
      <stop offset="1" stop-color="#d9d8d2"/>
    </linearGradient>
    <pattern id="shelfScratches" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M4 12h39M21 44h48M2 63h31" stroke="#f3f1eb" stroke-width="2" opacity="0.45"/>
      <path d="M18 4h20M45 27h16" stroke="#555" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#d7d5ce"/>
  <rect width="1600" height="900" fill="url(#shelfScratches)" opacity="0.75"/>
  <circle cx="515" cy="210" r="370" fill="#ffffff" opacity="0.48"/>
  <circle cx="960" cy="640" r="420" fill="#111" opacity="0.08"/>

  <!-- metal evidence shelf -->
  <path d="M120 170 L1485 95 L1540 720 L195 805 Z" fill="url(#steel)" filter="url(#grain)"/>
  <path d="M120 170 L1485 95" stroke="#f8f6ee" stroke-width="9" opacity="0.7"/>
  <path d="M195 805 L1540 720" stroke="#55534e" stroke-width="8" opacity="0.35"/>

  <!-- cut paper data strips -->
  <g filter="url(#hardShadow)">
    <path d="M1110 150 l250 -28 31 78 -250 30 z" fill="#f7f2e6"/>
    <path d="M1045 248 l310 18 -5 66 -318 -20 z" fill="#eee7dc"/>
    <path d="M1165 363 l250 -10 12 64 -260 21 z" fill="#faf6ec"/>
    <path d="M1030 675 l350 -48 18 92 -358 38 z" fill="#efe8db"/>
    <path d="M270 132 l310 35 -17 82 -317 -28 z" fill="#f8f2e5"/>
    <path d="M170 612 l320 -24 14 73 -313 42 z" fill="#f3eddf"/>
  </g>
  <g opacity="0.35" stroke="#67625c" stroke-width="5" stroke-linecap="round">
    <path d="M1140 184h170M1078 286h230M1198 394h174M1070 708h250M300 181h210M215 650h240"/>
    <path d="M1148 208h115M1080 312h155M1205 418h82M1075 733h180M302 210h140M217 678h178" stroke-width="3"/>
  </g>

  <!-- black phone -->
  <g transform="translate(555 215) rotate(-7)" filter="url(#hardShadow)">
    <rect x="0" y="0" width="515" height="610" rx="58" fill="#07080a"/>
    <rect x="30" y="42" width="455" height="528" rx="36" fill="#15171a"/>
    <ellipse cx="260" cy="28" rx="58" ry="10" fill="#1f2023"/>
    <rect x="83" y="145" width="315" height="70" rx="35" fill="#f3efe7" opacity="0.95"/>
    <circle cx="122" cy="180" r="26" fill="#b51623"/>
    <rect x="98" y="292" width="318" height="86" rx="12" fill="#e8e2d7"/>
    <rect x="120" y="319" width="195" height="14" fill="#77716b" opacity="0.45"/>
    <rect x="120" y="346" width="255" height="10" fill="#77716b" opacity="0.25"/>
    <rect x="96" y="430" width="92" height="92" fill="#b51623" opacity="0.92"/>
    <path d="M101 436 l82 78 M181 436 l-80 80" stroke="#f6eee4" stroke-width="8" opacity="0.85"/>
    <path d="M400 52 C330 130 278 214 244 304" stroke="#ffffff" stroke-width="11" opacity="0.18" fill="none"/>
    <path d="M76 540 C165 500 294 502 438 546" stroke="#ffffff" stroke-width="5" opacity="0.08" fill="none"/>
  </g>

  <!-- fingerprint arcs on glass -->
  <g transform="translate(800 515) rotate(-11)" fill="none" stroke="#e5e1da" opacity="0.18" stroke-width="3">
    <path d="M0 70 C10 10 98 -10 136 42"/>
    <path d="M18 82 C29 35 91 19 121 58"/>
    <path d="M38 88 C50 57 83 50 102 72"/>
    <path d="M58 93 C69 78 84 79 91 91"/>
  </g>

  <!-- file tabs without text -->
  <g filter="url(#hardShadow)">
    <path d="M320 360 h170 l35 36 h210 v92 H320z" fill="#ded3c0"/>
    <path d="M370 410 h270" stroke="#8a8175" stroke-width="8" opacity="0.35"/>
    <path d="M1180 510 h135 l28 30 h155 v78 h-318z" fill="#d8c7ae"/>
    <path d="M1218 563 h210" stroke="#7c705f" stroke-width="7" opacity="0.35"/>
  </g>

  <!-- red square and spill -->
  <rect x="493" y="684" width="44" height="44" transform="rotate(8 515 706)" fill="#b51623" filter="url(#hardShadow)"/>
  <path d="M982 252 C1095 270 1188 300 1275 350" stroke="#b51623" stroke-width="9" opacity="0.22" fill="none" stroke-dasharray="1 22" stroke-linecap="round"/>
  <path d="M935 760 C1030 716 1164 700 1310 708" stroke="#b51623" stroke-width="7" opacity="0.18" fill="none" stroke-dasharray="1 18" stroke-linecap="round"/>

  <!-- hard flash corner marks -->
  <path d="M92 92 h150 M92 92 v150 M1355 790 h150 M1505 640 v150" stroke="#ffffff" stroke-width="10" opacity="0.5"/>
  <rect width="1600" height="900" fill="#000" opacity="0.06" filter="url(#grain)"/>
</svg>
