  </g>
  <g stroke="#15161b" stroke-width="5" opacity="0.28">
    <path d="M135 82 L1460 780"/>
    <path d="M178 828 L1480 120"/>
    <path d="M70 455 L1530 455"/>
  </g>
  <rect x="54" y="54" width="1492" height="792" fill="none" stroke="#15161b" stroke-width="10" opacity="0.84"/>
