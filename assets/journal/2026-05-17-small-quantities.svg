<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Grocer counter at dawn</title>
  <desc id="desc">A vintage cutaway illustration of a grocer's counter with glass jars, spice mounds, a brass scoop, blue powder, bird seed, and ledger pages under pale morning light.</desc>
  <defs>
    <linearGradient id="dawn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172136"/>
      <stop offset="0.45" stop-color="#40506a"/>
      <stop offset="1" stop-color="#e7c895"/>
    </linearGradient>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 0 L0 16" stroke="#3b2a1c" stroke-width="2" opacity=".16"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8"/>
    </filter>
    <radialGradient id="glass" cx="45%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".65"/>
      <stop offset=".35" stop-color="#cce6e6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6e8a91" stop-opacity=".35"/>
    </radialGradient>
  </defs>

