<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two museum conservation trays connected by a red thread</title>
  <desc id="desc">Overhead archival-table diptych with a wrapped celadon vessel, a painted panel fragment, cotton gloves, brass weights, ruler marks, blank catalogue cards, and a thin red thread.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply" opacity="0.15"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2b2d2f" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#dfe9ed" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>
    <pattern id="rule" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0H40 M0 0V40" stroke="#a9a196" stroke-width="1" opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#d8d2c7"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#rule)" opacity="0.28"/>
  <rect x="74" y="58" width="1452" height="784" rx="22" fill="#eee8dc" filter="url(#paper)"/>

  <!-- table seam -->
  <path d="M800 92V812" stroke="#c4bbad" stroke-width="3" stroke-dasharray="10 18" opacity="0.65"/>

  <!-- trays -->
  <g filter="url(#shadow)">
    <rect x="148" y="146" width="560" height="560" rx="18" fill="#cfd2cf" stroke="#9ea39f" stroke-width="3"/>
    <rect x="892" y="146" width="560" height="560" rx="18" fill="#c9cac4" stroke="#9b9d96" stroke-width="3"/>
  </g>
  <rect x="170" y="168" width="516" height="516" rx="12" fill="#e8e5dc" opacity="0.88"/>
  <rect x="914" y="168" width="516" height="516" rx="12" fill="#e5e0d4" opacity="0.88"/>

  <!-- tissue and celadon vessel -->
  <g transform="translate(428 428)">
    <path d="M-215 -124C-150 -165 -84 -152 -38 -125C30 -86 110 -138 181 -91C237 -54 201 40 137 82C76 123 18 94 -36 128C-102 169 -202 142 -231 72C-260 1 -273 -88 -215 -124Z" fill="#f6f3e9" opacity="0.92" stroke="#ddd7c9" stroke-width="3"/>
    <path d="M-175 -56C-104 -12 -33 -16 38 -51C92 -78 139 -70 180 -33" fill="none" stroke="#d4cabb" stroke-width="4" opacity="0.75"/>
    <ellipse cx="0" cy="8" rx="92" ry="114" fill="#83a99a" stroke="#456f65" stroke-width="5"/>
    <ellipse cx="0" cy="-72" rx="59" ry="25" fill="#b5cfc3" stroke="#456f65" stroke-width="4"/>
    <path d="M-54 -68C-25 -50 26 -48 55 -68" fill="none" stroke="#dce9e2" stroke-width="5" opacity="0.65"/>
    <path d="M-42 62C-8 80 29 76 51 50" fill="none" stroke="#dce9e2" stroke-width="4" opacity="0.55"/>
  </g>

  <!-- painted panel fragment -->
  <g transform="translate(1172 424)">
    <rect x="-174" y="-132" width="348" height="264" rx="4" fill="#543b2c" stroke="#2f231c" stroke-width="8"/>
    <rect x="-148" y="-106" width="296" height="212" fill="#8d5b35"/>
    <path d="M-148 34C-74 -12 -27 -14 41 23C82 45 113 40 148 8V106H-148Z" fill="#2e5f5d" opacity="0.78"/>
    <path d="M-148 -106H148V-4C82 -31 41 -34 -9 -9C-63 18 -98 2 -148 -26Z" fill="#b78a49" opacity="0.78"/>
    <path d="M-87 -69C-30 -92 39 -83 94 -52" fill="none" stroke="#dec487" stroke-width="11" opacity="0.7"/>
    <path d="M-116 76C-62 41 2 35 67 70" fill="none" stroke="#c46943" stroke-width="9" opacity="0.66"/>
    <path d="M-134 -92L132 89" stroke="#2f231c" stroke-width="3" opacity="0.18"/>
    <rect x="-174" y="-132" width="348" height="264" fill="url(#glass)"/>
  </g>

  <!-- catalogue cards blank -->
  <g filter="url(#shadow)">
    <rect x="300" y="720" width="290" height="92" rx="6" fill="#f7f3e8" stroke="#bdb4a4" stroke-width="2"/>
    <rect x="1010" y="720" width="290" height="92" rx="6" fill="#f7f3e8" stroke="#bdb4a4" stroke-width="2"/>
  </g>
  <path d="M328 748H555M328 772H520M328 796H574" stroke="#b9b0a3" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M1038 748H1264M1038 772H1210M1038 796H1284" stroke="#b9b0a3" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- red thread -->
  <path d="M590 766C707 722 814 724 936 766C958 774 982 777 1010 770" fill="none" stroke="#a5302e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="590" cy="766" r="9" fill="#a5302e"/>
  <circle cx="1010" cy="770" r="9" fill="#a5302e"/>

  <!-- gloves -->
  <g transform="translate(760 622) rotate(-8)" opacity="0.92">
    <path d="M-70 42C-88 5 -82 -47 -60 -75C-47 -91 -30 -70 -38 -38L-31 -85C-27 -112 -1 -108 -5 -77L-8 -32L7 -91C14 -119 40 -112 32 -83L20 -31L46 -76C58 -98 82 -86 70 -62L41 -6C70 0 93 18 88 43C78 91 -38 98 -70 42Z" fill="#f2efe4" stroke="#c8c0b2" stroke-width="3"/>
  </g>
  <g transform="translate(838 620) scale(-1 1) rotate(-7)" opacity="0.92">
    <path d="M-70 42C-88 5 -82 -47 -60 -75C-47 -91 -30 -70 -38 -38L-31 -85C-27 -112 -1 -108 -5 -77L-8 -32L7 -91C14 -119 40 -112 32 -83L20 -31L46 -76C58 -98 82 -86 70 -62L41 -6C70 0 93 18 88 43C78 91 -38 98 -70 42Z" fill="#f2efe4" stroke="#c8c0b2" stroke-width="3"/>
  </g>

  <!-- ruler -->
  <g transform="translate(704 134) rotate(90)">
    <rect x="0" y="0" width="520" height="34" rx="4" fill="#d9c48c" stroke="#9f8c51" stroke-width="2"/>
    <g stroke="#5c5231" stroke-width="2">
      <path d="M20 0V18M60 0V12M100 0V18M140 0V12M180 0V18M220 0V12M260 0V18M300 0V12M340 0V18M380 0V12M420 0V18M460 0V12M500 0V18"/>
    </g>
  </g>

  <!-- brass weights and folders -->
  <g fill="#b59a55" stroke="#766331" stroke-width="3" filter="url(#shadow)">
    <circle cx="238" cy="230" r="28"/>
    <circle cx="1360" cy="650" r="28"/>
    <rect x="754" y="172" width="92" height="64" rx="8"/>
  </g>
  <path d="M752 268H880L906 298V380H752Z" fill="#9aa0a1" stroke="#6f7678" stroke-width="3" opacity="0.88"/>
  <path d="M752 298H906" stroke="#6f7678" stroke-width="3" opacity="0.7"/>

  <!-- pinholes / dust -->
  <g fill="#7e766b" opacity="0.22">
    <circle cx="132" cy="116" r="3"/><circle cx="1448" cy="98" r="2.5"/><circle cx="785" cy="822" r="3"/>
    <circle cx="935" cy="122" r="2"/><circle cx="522" cy="108" r="2"/><circle cx="1480" cy="778" r="2.5"/>
  </g>
</svg>
