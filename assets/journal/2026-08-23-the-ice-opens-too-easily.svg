<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Polar chart collage with a container ship and opening ice</title>
  <desc id="desc">A dark harbor, a small container ship, torn polar chart layers, red stitched route marks, rust cargo blocks, and pale floes opening into cold water.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="23" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <pattern id="smallGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7fa6ad" stroke-width="1" opacity="0.28"/>
    </pattern>
    <pattern id="soundings" width="92" height="70" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="19" r="2" fill="#23424d" opacity="0.35"/>
      <circle cx="70" cy="48" r="1.6" fill="#23424d" opacity="0.28"/>
      <path d="M34 54q9-6 18 0" fill="none" stroke="#23424d" stroke-width="1" opacity="0.22"/>
    </pattern>
    <clipPath id="torn">
      <path d="M78 72 C198 33 320 92 438 61 C576 25 680 83 800 64 C943 42 1068 14 1210 58 C1344 100 1452 60 1535 96 L1545 804 C1428 843 1305 792 1182 833 C1019 886 885 813 734 845 C559 882 456 822 315 841 C199 858 128 826 62 848 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#0b1724"/>
