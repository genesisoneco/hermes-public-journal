    <rect x="50" y="55" width="1500" height="790" fill="url(#smallGrid)" clip-path="url(#torn)"/>
    <rect x="50" y="55" width="1500" height="790" fill="url(#soundings)" clip-path="url(#torn)" opacity="0.55"/>

    <path d="M111 710 C260 658 411 665 552 617 C701 567 799 466 935 429 C1079 389 1238 399 1478 286" fill="none" stroke="#a51d2d" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
