<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Abstract pre-dawn field</title>
  <desc id="desc">Layered blue and violet gradients with small warm lights gathering along a quiet arc before sunrise.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.48" stop-color="#152452"/>
      <stop offset="1" stop-color="#3b1f5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="58%" r="55%">
      <stop offset="0" stop-color="#f6c177" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#9ccfd8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ccfd8" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#9ccfd8" stop-opacity="0.52"/>
      <stop offset="0.68" stop-color="#f6c177" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#eb6f92" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <g opacity="0.8">
    <circle cx="180" cy="126" r="2.4" fill="#e0def4"/>
    <circle cx="337" cy="84" r="1.8" fill="#c4a7e7"/>
    <circle cx="498" cy="150" r="2.1" fill="#e0def4"/>
    <circle cx="739" cy="98" r="1.6" fill="#f6c177"/>
    <circle cx="995" cy="144" r="2.3" fill="#e0def4"/>
    <circle cx="1082" cy="236" r="1.7" fill="#9ccfd8"/>
    <circle cx="91" cy="288" r="1.5" fill="#9ccfd8"/>
  </g>
  <path d="M-40 482 C 160 410, 267 536, 442 470 S 760 317, 1244 378" fill="none" stroke="url(#ribbon)" stroke-width="24" stroke-linecap="round" opacity="0.72"/>
  <path d="M-20 540 C 185 502, 326 610, 520 535 S 797 420, 1230 500" fill="none" stroke="#c4a7e7" stroke-width="3" opacity="0.3"/>
  <g filter="url(#soft)" opacity="0.72">
    <ellipse cx="395" cy="454" rx="92" ry="38" fill="#9ccfd8"/>
    <ellipse cx="682" cy="397" rx="122" ry="45" fill="#f6c177"/>
    <ellipse cx="884" cy="416" rx="76" ry="32" fill="#eb6f92"/>
  </g>
  <g fill="none" stroke="#e0def4" stroke-opacity="0.16">
    <circle cx="600" cy="352" r="210"/>
    <circle cx="600" cy="352" r="310"/>
    <circle cx="600" cy="352" r="410"/>
  </g>
  <g>
    <circle cx="426" cy="466" r="6" fill="#f6c177"/>
    <circle cx="564" cy="438" r="4" fill="#e0def4"/>
    <circle cx="703" cy="401" r="7" fill="#9ccfd8"/>
    <circle cx="831" cy="404" r="5" fill="#f6c177"/>
    <circle cx="944" cy="426" r="3.5" fill="#e0def4"/>
  </g>
  <path d="M0 610 C 240 566, 372 646, 602 606 C 811 570, 951 578, 1200 548 L1200 675 L0 675 Z" fill="#070b14" opacity="0.62"/>
</svg>
