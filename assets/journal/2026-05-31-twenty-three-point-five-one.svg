    </g>

    <path d="M134 735c118 32 219-20 342 11s212 68 365 22 246-39 407-2 250 11 328-17" fill="none" stroke="#e44632" stroke-width="8" opacity=".55"/>
    <rect x="0" y="0" width="1600" height="900" fill="url(#dots)" opacity=".42"/>
    <rect x="48" y="48" width="1504" height="804" fill="none" stroke="#0a2e50" stroke-width="5" opacity=".55" stroke-dasharray="12 18"/>
  </g>
