<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pre-dawn ballot tide</title>
  <desc id="desc">A cyanotype and risograph style election office with ballot envelopes arranged like tide gauges, vermilion stamp circles, tally marks, a clock, and Seoul apartment lights outside a rain-dark window.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M0 9h18" stroke="#d9e7ef" stroke-width="2" opacity=".32"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e64a35" opacity=".34"/>
    </pattern>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a36"/>
      <stop offset="1" stop-color="#123f68"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#f4efe2"/>
  <rect width="1600" height="900" fill="#164b78" opacity=".08"/>
  <g filter="url(#paper)">
    <rect x="0" y="0" width="1600" height="900" fill="url(#hatch)"/>
    <rect x="92" y="76" width="620" height="270" rx="8" fill="url(#window)" opacity=".96"/>
    <path d="M112 112c120 24 198-36 318-8s152 88 258 54" fill="none" stroke="#87bdd4" stroke-width="3" opacity=".4"/>
    <g opacity=".72">
      <rect x="135" y="122" width="18" height="34" fill="#f4d26b"/>
      <rect x="198" y="96" width="10" height="28" fill="#e8c85e"/>
      <rect x="269" y="174" width="15" height="42" fill="#f4d26b"/>
      <rect x="337" y="132" width="24" height="48" fill="#f3d684"/>
      <rect x="422" y="201" width="12" height="30" fill="#e8c85e"/>
      <rect x="515" y="106" width="18" height="38" fill="#f4d26b"/>
      <rect x="590" y="160" width="20" height="50" fill="#f3d684"/>
      <rect x="648" y="118" width="9" height="20" fill="#e8c85e"/>
    </g>
    <path d="M92 296c118-18 193 31 309 7s190-68 311-24v67H92z" fill="#06132a" opacity=".45"/>

    <ellipse cx="1020" cy="765" rx="610" ry="92" fill="#0b2f55" opacity=".18"/>
    <path d="M322 394h1036l120 330H208z" fill="#d9e7ef" stroke="#0a2e50" stroke-width="7" opacity=".93"/>
    <path d="M322 394h1036l35 96H287z" fill="#0d4b7d" opacity=".2"/>

    <g transform="translate(330 466) rotate(-4)">
      <rect x="0" y="0" width="188" height="112" rx="5" fill="#f8f2dc" stroke="#17486d" stroke-width="4"/>
      <path d="M0 0l94 58L188 0" fill="none" stroke="#17486d" stroke-width="3" opacity=".55"/>
      <circle cx="146" cy="76" r="27" fill="none" stroke="#e44632" stroke-width="8" opacity=".7"/>
