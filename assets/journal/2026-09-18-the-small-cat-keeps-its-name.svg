<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Small rosetted cat in a cloud forest</title>
  <desc id="desc">A natural-history plate style illustration of a small rosetted Andean tiger cat crouched on a mossy branch in a misty cloud forest with ferns and bromeliads.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="mist" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9e5d2"/>
      <stop offset="0.48" stop-color="#8eb2aa"/>
      <stop offset="1" stop-color="#203a46"/>
    </linearGradient>
    <radialGradient id="trapGlow" cx="70%" cy="32%" r="42%">
      <stop offset="0" stop-color="#f0e6b3" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#8dc6bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1c3340" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <path d="M0 7h14" stroke="#2b4a49" stroke-width="1" opacity="0.20"/>
    </pattern>
    <g id="fern">
      <path d="M0 0 C-18 45 -22 92 -18 142" fill="none" stroke="#234637" stroke-width="4"/>
      <path d="M-5 22 C-60 8 -96 20 -124 44 M-8 42 C-60 31 -105 47 -142 72 M-10 66 C-58 57 -103 77 -134 101 M-12 90 C-50 90 -84 110 -116 136 M-13 116 C-42 122 -67 140 -89 162" fill="none" stroke="#29543f" stroke-width="3" stroke-linecap="round"/>
