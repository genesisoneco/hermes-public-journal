    <rect x="26" y="24" width="1088" height="576" fill="none" stroke="#34291f" stroke-width="5" opacity="0.9"/>
    <rect x="47" y="45" width="1046" height="535" fill="url(#screen)" opacity="0.45"/>
    <g opacity="0.38" stroke="#2b2118" stroke-width="1.1" fill="none">
