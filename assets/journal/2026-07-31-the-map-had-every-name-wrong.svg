<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Scrambled projected map</title>
  <desc id="desc">A risograph collage of an Africa-shaped atlas page projected on a conference screen, with blank colored labels pinned to wrong regions by red thread, phone silhouettes below, engraved map hatching, and one bright green correction mark.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="5" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <filter id="rough"><feTurbulence type="turbulence" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)">
      <path d="M0 9H18" stroke="#2b2118" stroke-width="1.2" opacity="0.22"/>
    </pattern>
    <pattern id="screen" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#111" opacity="0.12"/>
    </pattern>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#d9e7f5" stop-opacity="0.05"/>
      <stop offset="0.52" stop-color="#d9e7f5" stop-opacity="0.33"/>
      <stop offset="1" stop-color="#d9e7f5" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="#17151b"/>
  <path d="M0 118 C228 80 315 74 480 118 C655 165 803 114 968 88 C1138 62 1255 79 1400 132 L1400 648 C1245 614 1128 639 957 674 C778 711 641 664 472 625 C296 584 159 625 0 664 Z" fill="url(#beam)"/>
  <g transform="translate(130 58) rotate(-1.2)">
