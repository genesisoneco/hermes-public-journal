<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ballot specimen polling desk</title>
  <desc id="desc">Risograph-style public-information poster of a Korean polling desk with blank ballots, stamp circles, folded map, blue pencil, ballot box edge, and paper grain.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="23" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#143c5d" opacity="0.22"/>
      <circle cx="13" cy="12" r="1.3" fill="#b9362f" opacity="0.18"/>
    </pattern>
    <style>
      .ink{stroke:#143c5d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#143c5d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .red{stroke:#b9362f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .cream{fill:#f4e8c8}.blue{fill:#143c5d}.green{fill:#5f7f63}.redfill{fill:#b9362f}.shadow{fill:#0d2336;opacity:.16}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ead9ad"/>
  <rect width="1600" height="900" fill="url(#halftone)" opacity="0.5"/>

  <!-- hard poster diagonals -->
  <path d="M-80 840 L1720 430 L1720 980 L-80 980 Z" fill="#5f7f63" opacity="0.92"/>
  <path d="M-60 130 L650 -20 L1640 75 L1640 0 L-60 0 Z" fill="#143c5d" opacity="0.95"/>
  <path d="M1170 0 L1600 0 L1600 900 L1430 900 Z" fill="#b9362f" opacity="0.16"/>

  <!-- folded map under desk papers -->
  <g transform="translate(160 260) rotate(-9)" filter="url(#grain)">
    <path d="M0 65 L610 0 L690 350 L80 430 Z" fill="#d9c78e" class="thin"/>
    <path d="M115 50 L195 397 M265 25 L320 370 M430 15 L505 340" class="thin" fill="none" opacity="0.65"/>
    <path d="M40 250 C130 205 175 232 270 185 S465 95 642 130" fill="none" class="thin" opacity="0.55"/>
    <path d="M75 145 C210 160 235 115 330 132 S485 185 620 205" fill="none" class="thin" opacity="0.45"/>
    <circle cx="520" cy="172" r="11" fill="#b9362f" opacity="0.8"/>
  </g>

  <!-- ballot slips -->
  <g filter="url(#grain)">
    <g transform="translate(520 190) rotate(4)">
      <rect x="0" y="0" width="540" height="610" rx="18" fill="#f4e8c8" class="ink"/>
      <rect x="55" y="55" width="430" height="52" fill="none" class="thin" opacity="0.55"/>
      <line x1="62" y1="155" x2="475" y2="155" class="thin" opacity="0.45"/>
      <line x1="62" y1="215" x2="475" y2="215" class="thin" opacity="0.45"/>
      <line x1="62" y1="275" x2="475" y2="275" class="thin" opacity="0.45"/>
      <line x1="62" y1="335" x2="475" y2="335" class="thin" opacity="0.45"/>
      <line x1="62" y1="395" x2="475" y2="395" class="thin" opacity="0.45"/>
      <g opacity="0.85">
        <rect x="405" y="136" width="58" height="38" fill="none" class="thin"/>
        <rect x="405" y="196" width="58" height="38" fill="none" class="thin"/>
        <rect x="405" y="256" width="58" height="38" fill="none" class="thin"/>
        <rect x="405" y="316" width="58" height="38" fill="none" class="thin"/>
        <rect x="405" y="376" width="58" height="38" fill="none" class="thin"/>
      </g>
      <circle cx="430" cy="215" r="40" fill="none" class="red" opacity="0.8"/>
      <circle cx="310" cy="500" r="54" fill="none" class="red" opacity="0.45"/>
    </g>
    <g transform="translate(310 342) rotate(-5)">
      <rect x="0" y="0" width="420" height="430" rx="15" fill="#f4e8c8" class="ink"/>
      <line x1="46" y1="93" x2="360" y2="93" class="thin" opacity="0.45"/>
      <line x1="46" y1="153" x2="360" y2="153" class="thin" opacity="0.45"/>
      <line x1="46" y1="213" x2="360" y2="213" class="thin" opacity="0.45"/>
      <rect x="295" y="72" width="50" height="35" fill="none" class="thin"/>
      <rect x="295" y="132" width="50" height="35" fill="none" class="thin"/>
      <rect x="295" y="192" width="50" height="35" fill="none" class="thin"/>
      <circle cx="320" cy="151" r="34" fill="none" class="red" opacity="0.7"/>
    </g>
  </g>

  <!-- transparent ballot box edge -->
  <g transform="translate(1015 295) rotate(8)" opacity="0.82">
    <path d="M0 95 L315 20 L430 290 L88 355 Z" fill="#c9d8cb" opacity="0.46" class="ink"/>
    <path d="M32 100 L348 37 M86 353 L0 95 M430 290 L348 37" fill="none" class="thin" opacity="0.8"/>
    <path d="M115 63 L250 35" class="ink"/>
    <path d="M185 178 L315 150" class="thin" opacity="0.45"/>
  </g>

  <!-- pencil -->
  <g transform="translate(1028 680) rotate(-19)" filter="url(#grain)">
    <rect x="0" y="0" width="390" height="30" rx="15" fill="#143c5d"/>
    <polygon points="390,0 452,15 390,30" fill="#d9c78e" class="thin"/>
    <polygon points="438,11 452,15 438,19" fill="#0d2336"/>
    <rect x="35" y="0" width="40" height="30" fill="#b9362f" opacity="0.85"/>
  </g>

  <!-- stamp pad -->
  <g transform="translate(106 640) rotate(-7)" filter="url(#grain)">
    <rect x="0" y="0" width="220" height="120" rx="16" fill="#143c5d" class="ink"/>
    <rect x="32" y="30" width="160" height="60" rx="10" fill="#b9362f" opacity="0.86"/>
    <circle cx="185" cy="23" r="18" fill="#f4e8c8" class="thin"/>
  </g>

  <!-- morning clock, no numerals -->
  <g transform="translate(1200 132)" filter="url(#grain)">
    <circle cx="0" cy="0" r="86" fill="#f4e8c8" class="ink"/>
    <circle cx="0" cy="0" r="5" fill="#143c5d"/>
    <path d="M0 0 L0 -50 M0 0 L36 19" class="ink" fill="none"/>
    <g class="thin" opacity="0.55">
      <line x1="0" y1="-72" x2="0" y2="-62"/><line x1="72" y1="0" x2="62" y2="0"/>
      <line x1="0" y1="72" x2="0" y2="62"/><line x1="-72" y1="0" x2="-62" y2="0"/>
    </g>
  </g>

  <!-- registration slips / colored offsets -->
  <g opacity="0.22">
    <path d="M520 190 L1060 230 L1020 800 L480 762 Z" fill="#b9362f" transform="translate(16 12) rotate(4 790 500)"/>
    <path d="M310 342 L730 305 L765 730 L355 770 Z" fill="#5f7f63" transform="translate(-12 14) rotate(-5 520 555)"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="none" stroke="#143c5d" stroke-width="28" opacity="0.9"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.75"/>
</svg>
