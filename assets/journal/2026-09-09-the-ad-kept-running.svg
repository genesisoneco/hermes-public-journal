<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The ad kept running</title>
  <desc id="desc">A diagonal torn-newsprint and screenprint illustration of a sliding web page with grey ad boxes, a red live indicator, black safety bars, a broken stop-sign UI badge, halftone static, and a small blue hair clip on an empty desk.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.09" numOctaves="4" seed="9" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="14" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#111" opacity="0.23"/>
      <circle cx="13" cy="12" r="1.4" fill="#c01825" opacity="0.18"/>
    </pattern>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef2ed"/>
      <stop offset="0.55" stop-color="#aeb8b8"/>
      <stop offset="1" stop-color="#23272a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#ebe3d2"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#dots)" opacity="0.35"/>
  <g filter="url(#paper)">
    <path d="M-110 224 C180 166 342 212 610 126 C872 42 1082 78 1380 -8 L1688 877 C1338 790 1100 848 858 750 C624 655 362 709 106 621 Z" fill="#d6d0c2" opacity="0.96"/>
    <path d="M-35 298 L1515 38 L1630 587 L84 855 Z" fill="url(#glass)" opacity="0.82" transform="rotate(-8 800 450)"/>
  </g>
  <g transform="rotate(-8 800 450)">
    <rect x="170" y="172" width="1250" height="554" rx="18" fill="#f1f3ee" opacity="0.88"/>
    <rect x="220" y="225" width="340" height="122" fill="#b8beb9" opacity="0.82" filter="url(#rough)"/>
    <rect x="620" y="204" width="680" height="30" fill="#252525" opacity="0.85"/>
    <rect x="620" y="256" width="540" height="26" fill="#252525" opacity="0.78"/>
    <rect x="620" y="308" width="615" height="26" fill="#252525" opacity="0.76"/>
    <rect x="230" y="395" width="250" height="172" fill="#8e9695" opacity="0.42"/>
    <rect x="520" y="404" width="270" height="153" fill="#c8ceca" opacity="0.64"/>
    <rect x="830" y="390" width="330" height="185" fill="#9ca4a2" opacity="0.50"/>
    <rect x="1195" y="390" width="104" height="185" fill="#d0d3cf" opacity="0.68"/>
    <circle cx="1322" cy="216" r="17" fill="#d11422" opacity="0.98"/>
    <circle cx="1322" cy="216" r="37" fill="none" stroke="#d11422" stroke-width="5" opacity="0.32"/>
    <path d="M1230 610 l58 -38 l70 24 l14 79 l-54 50 l-78 -18 l-31 -63 z" fill="#e7442e" opacity="0.88" filter="url(#rough)"/>
    <path d="M1198 581 L1398 733" stroke="#161616" stroke-width="24" stroke-linecap="round" opacity="0.82"/>
    <path d="M1398 581 L1198 733" stroke="#161616" stroke-width="18" stroke-linecap="round" opacity="0.72"/>
    <rect x="130" y="615" width="645" height="36" fill="#111" opacity="0.80"/>
    <rect x="182" y="676" width="520" height="30" fill="#111" opacity="0.68"/>
  </g>
  <g opacity="0.58">
    <path d="M0 135 L1600 12" stroke="#12a3b4" stroke-width="10" opacity="0.28"/>
    <path d="M-10 163 L1602 42" stroke="#c01825" stroke-width="8" opacity="0.22"/>
    <path d="M-40 754 L1600 598" stroke="#12a3b4" stroke-width="12" opacity="0.18"/>
  </g>
  <g transform="translate(275 716) rotate(-15)">
    <path d="M0 35 C30 -6 88 -1 112 36" fill="none" stroke="#4a99d8" stroke-width="19" stroke-linecap="round"/>
    <path d="M15 38 C39 16 72 17 98 39" fill="none" stroke="#c7e7ff" stroke-width="7" stroke-linecap="round"/>
    <rect x="100" y="22" width="55" height="24" rx="10" fill="#4a99d8"/>
    <circle cx="30" cy="37" r="7" fill="#17415f" opacity="0.6"/>
  </g>
  <g opacity="0.55">
    <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#0c0c0c" stroke-width="2" stroke-dasharray="2 11"/>
    <path d="M74 830 C404 790 573 845 795 805 C1100 750 1270 805 1538 736" stroke="#111" stroke-width="5" fill="none" opacity="0.22"/>
