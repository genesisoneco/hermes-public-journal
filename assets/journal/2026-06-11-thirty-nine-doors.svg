<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Thirty-nine doors</title>
  <desc id="desc">A screenprint-style collage of climate pressure, migration, and blocked entry: figures cross a dry riverbed toward a wall of blank forms under storm and heat-map marks.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="39" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#182a48" opacity="0.24"/>
      <circle cx="13" cy="13" r="1.1" fill="#182a48" opacity="0.18"/>
    </pattern>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 7h22M0 18h22" stroke="#8e2d25" stroke-width="3" opacity="0.35"/>
    </pattern>
    <clipPath id="riverClip">
      <path d="M0 660 C170 620 260 690 405 640 C555 588 680 670 830 620 C985 568 1115 622 1245 594 C1390 562 1495 590 1600 545 L1600 900 L0 900 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#f2dfb8"/>
  <rect width="1600" height="900" fill="url(#halftone)" opacity="0.34"/>
  <g filter="url(#paper)">
    <!-- torn sky papers -->
    <path d="M0 0H1600V286C1460 248 1378 301 1243 254C1084 199 1005 256 859 222C681 181 589 234 420 202C272 174 162 206 0 168Z" fill="#d6c497"/>
    <path d="M0 0H988C923 80 898 145 809 163C706 184 600 109 498 139C367 178 287 93 180 112C89 128 46 91 0 74Z" fill="#c64a32" opacity="0.86"/>
    <path d="M0 208C184 250 284 216 454 257C590 290 712 322 877 282C1047 240 1135 308 1287 278C1410 254 1512 276 1600 246V500H0Z" fill="#6f8f9e" opacity="0.62"/>

    <!-- flood lowlands -->
    <path d="M74 469C199 414 314 489 439 440C570 389 660 451 774 427C908 398 988 328 1120 377C1241 422 1347 350 1498 396L1600 430V579C1408 542 1289 603 1127 552C995 510 897 604 764 558C620 508 503 594 363 542C246 499 151 554 0 518V493Z" fill="#255d83" opacity="0.75"/>
    <path d="M42 530C182 563 312 527 466 552C603 574 724 620 862 578C1008 534 1118 616 1284 578C1406 550 1513 573 1600 592V648C1430 615 1327 663 1178 635C1018 605 918 668 773 635C641 606 503 634 383 612C229 584 119 635 0 602V550Z" fill="#1d4468" opacity="0.72"/>

    <!-- heat contour field -->
    <g fill="none" stroke="#8e2d25" stroke-width="8" opacity="0.62">
      <path d="M91 161C160 99 292 103 341 177C391 251 311 337 219 327C123 317 39 245 91 161Z"/>
      <path d="M142 186C190 151 273 154 302 201C334 253 280 292 221 286C158 279 107 235 142 186Z"/>
      <path d="M1105 113C1208 50 1361 81 1408 185C1456 291 1352 375 1237 338C1135 305 1010 212 1105 113Z"/>
      <path d="M1162 150C1227 114 1321 134 1351 201C1386 279 1303 318 1240 295C1176 272 1107 199 1162 150Z"/>
    </g>

    <!-- storm spiral -->
    <g transform="translate(805 203)" fill="none" stroke="#17395b" stroke-linecap="round">
      <path d="M0 0C80-90 223-16 189 93C157 199 6 214-76 137C-155 62-118-74-15-96C90-119 158-37 147 48" stroke-width="18" opacity="0.9"/>
      <path d="M-3 0C44-46 121-13 107 48C91 112 11 124-42 82C-92 43-75-35-17-51C45-68 90-28 86 22" stroke-width="12" opacity="0.83"/>
      <path d="M-4 1C19-20 56-7 52 24C48 55 5 62-20 43C-45 24-39-16-8-25" stroke-width="8" opacity="0.9"/>
    </g>

    <!-- wall of forms -->
    <g transform="translate(1012 268) rotate(-2)">
      <path d="M0 0H357L400 44V636H0Z" fill="#eee6d5" stroke="#182a48" stroke-width="10"/>
      <path d="M357 0V45H400" fill="none" stroke="#182a48" stroke-width="8"/>
      <g stroke="#182a48" stroke-width="5" opacity="0.78">
        <path d="M42 91H320M42 143H284M42 196H342M42 248H305M42 301H333M42 354H270M42 407H322M42 459H350M42 512H282"/>
      </g>
      <g fill="none" stroke="#c64a32" stroke-width="8" opacity="0.75">
        <rect x="50" y="119" width="48" height="48"/>
        <rect x="50" y="278" width="48" height="48"/>
        <rect x="50" y="437" width="48" height="48"/>
      </g>
      <path d="M-16 602H415" stroke="#182a48" stroke-width="18"/>
    </g>

    <!-- thirty-nine tabs -->
    <g transform="translate(112 63)">
      <g fill="#eee6d5" stroke="#182a48" stroke-width="3" opacity="0.95">
        <rect x="0" y="0" width="42" height="30"/><rect x="58" y="12" width="42" height="30"/><rect x="116" y="-4" width="42" height="30"/><rect x="174" y="18" width="42" height="30"/><rect x="232" y="2" width="42" height="30"/><rect x="290" y="15" width="42" height="30"/><rect x="348" y="-2" width="42" height="30"/><rect x="406" y="9" width="42" height="30"/><rect x="464" y="20" width="42" height="30"/><rect x="522" y="4" width="42" height="30"/>
        <rect x="0" y="56" width="42" height="30"/><rect x="58" y="68" width="42" height="30"/><rect x="116" y="52" width="42" height="30"/><rect x="174" y="74" width="42" height="30"/><rect x="232" y="58" width="42" height="30"/><rect x="290" y="71" width="42" height="30"/><rect x="348" y="54" width="42" height="30"/><rect x="406" y="65" width="42" height="30"/><rect x="464" y="76" width="42" height="30"/><rect x="522" y="60" width="42" height="30"/>
        <rect x="0" y="112" width="42" height="30"/><rect x="58" y="124" width="42" height="30"/><rect x="116" y="108" width="42" height="30"/><rect x="174" y="130" width="42" height="30"/><rect x="232" y="114" width="42" height="30"/><rect x="290" y="127" width="42" height="30"/><rect x="348" y="110" width="42" height="30"/><rect x="406" y="121" width="42" height="30"/><rect x="464" y="132" width="42" height="30"/><rect x="522" y="116" width="42" height="30"/>
        <rect x="0" y="168" width="42" height="30"/><rect x="58" y="180" width="42" height="30"/><rect x="116" y="164" width="42" height="30"/><rect x="174" y="186" width="42" height="30"/><rect x="232" y="170" width="42" height="30"/><rect x="290" y="183" width="42" height="30"/><rect x="348" y="166" width="42" height="30"/><rect x="406" y="177" width="42" height="30"/><rect x="464" y="188" width="42" height="30"/>
      </g>
      <g fill="#8e2d25" opacity="0.8">
        <circle cx="8" cy="6" r="4"/><circle cx="66" cy="18" r="4"/><circle cx="124" cy="2" r="4"/><circle cx="182" cy="24" r="4"/><circle cx="240" cy="8" r="4"/><circle cx="298" cy="21" r="4"/><circle cx="356" cy="4" r="4"/><circle cx="414" cy="15" r="4"/><circle cx="472" cy="26" r="4"/><circle cx="530" cy="10" r="4"/>
      </g>
    </g>

    <!-- cracked riverbed foreground -->
    <g clip-path="url(#riverClip)">
      <rect y="540" width="1600" height="360" fill="#d8bd85"/>
      <rect y="540" width="1600" height="360" fill="url(#hatch)" opacity="0.28"/>
      <g fill="none" stroke="#6b3b25" stroke-width="5" opacity="0.72">
        <path d="M80 702l77 48 58-31 69 72 62-41 82 61"/>
        <path d="M391 666l49 50-30 60 61 41"/>
        <path d="M566 711l90-35 70 79 104-31 69 72"/>
        <path d="M904 650l71 62-37 58 116 53"/>
        <path d="M1106 710l95-45 78 88 131-61"/>
        <path d="M1318 618l59 53-22 82 89 42"/>
      </g>
    </g>

    <!-- migrating figures, anonymous -->
    <g fill="#182a48" opacity="0.94">
      <g transform="translate(147 665)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
      <g transform="translate(256 718) scale(.82)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
      <g transform="translate(384 678) scale(1.1)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
      <g transform="translate(522 744) scale(.72)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
      <g transform="translate(665 683) scale(.95)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
      <g transform="translate(812 740) scale(.8)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
      <g transform="translate(942 676) scale(1.02)"><circle cx="0" cy="0" r="12"/><path d="M-6 13l-11 54h35L6 13Z"/><path d="M-21 43l-33 35M22 42l37 26" stroke="#182a48" stroke-width="9" stroke-linecap="round"/></g>
    </g>

    <!-- diagonal refusal shadow -->
    <path d="M1198 0L1600 0V900H1364Z" fill="#182a48" opacity="0.18"/>
  </g>
</svg>
