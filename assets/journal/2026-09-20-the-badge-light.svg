<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Badge Light</title>
  <desc id="desc">A stark poster-style image of a red press badge clipped to an empty lanyard beside a white government-building silhouette, a black security line, one empty chair, and rough halftone texture.</desc>
  <defs>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.4" fill="#111" opacity="0.10"/>
      <circle cx="17" cy="13" r="1.1" fill="#111" opacity="0.08"/>
      <circle cx="10" cy="20" r="0.8" fill="#111" opacity="0.09"/>
    </pattern>
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.4" fill="#111" opacity="0.22"/>
    </pattern>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="920" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#ece5d5"/>
  <rect width="1200" height="800" fill="url(#grain)" opacity="0.75"/>

  <path d="M0 0H1200L935 800H0Z" fill="#d8cfbc"/>
  <path d="M830 0H1200V800H925Z" fill="#101010" opacity="0.93"/>
  <path d="M845 52L1135 52L1110 106L870 106Z" fill="#f5f1e6" filter="url(#rough)"/>
  <path d="M880 132H1098V586H880Z" fill="#f5f1e6" filter="url(#rough)"/>
  <g fill="#101010" opacity="0.84">
    <rect x="912" y="174" width="24" height="330"/>
    <rect x="962" y="174" width="24" height="330"/>
    <rect x="1012" y="174" width="24" height="330"/>
    <rect x="1062" y="174" width="24" height="330"/>
  </g>
  <rect x="845" y="584" width="286" height="62" fill="#f5f1e6" filter="url(#rough)"/>

  <path d="M0 612H880" stroke="#111" stroke-width="18" stroke-linecap="square"/>
  <path d="M55 660C160 636 285 644 392 615C508 583 609 586 761 604" fill="none" stroke="#111" stroke-width="7" opacity="0.50"/>

  <g transform="translate(244 142) rotate(-7)">
    <path d="M142 -100C98 -38 82 22 97 87" fill="none" stroke="#111" stroke-width="12" stroke-linecap="round"/>
    <path d="M153 -91C129 -39 118 17 132 80" fill="none" stroke="#ece5d5" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <rect x="0" y="88" width="292" height="388" rx="20" fill="#b91c1c" filter="url(#rough)"/>
    <rect x="25" y="122" width="242" height="72" rx="6" fill="#f5f1e6" opacity="0.93"/>
    <rect x="35" y="224" width="222" height="20" fill="#2a0e0e" opacity="0.60"/>
    <rect x="35" y="270" width="162" height="20" fill="#2a0e0e" opacity="0.48"/>
    <rect x="35" y="316" width="202" height="20" fill="#2a0e0e" opacity="0.42"/>
    <circle cx="145" cy="92" r="18" fill="#111"/>
    <rect x="0" y="88" width="292" height="388" rx="20" fill="url(#halftone)" opacity="0.18"/>
  </g>

  <g transform="translate(560 504)">
    <path d="M32 0H164C179 0 190 11 190 26V87H6V26C6 11 17 0 32 0Z" fill="#111"/>
    <rect x="35" y="86" width="18" height="92" fill="#111"/>
    <rect x="142" y="86" width="18" height="92" fill="#111"/>
    <path d="M20 178H180" stroke="#111" stroke-width="12" stroke-linecap="round"/>
    <path d="M20 107H180" stroke="#ece5d5" stroke-width="7" opacity="0.6"/>
  </g>

  <g opacity="0.22">
    <path d="M70 80L790 30" stroke="#111" stroke-width="3"/>
    <path d="M66 124L760 88" stroke="#111" stroke-width="3"/>
    <path d="M92 724L820 704" stroke="#111" stroke-width="3"/>
  </g>

  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#111" stroke-width="24"/>
</svg>
