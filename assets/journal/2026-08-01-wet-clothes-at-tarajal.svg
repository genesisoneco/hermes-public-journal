<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Wet clothes at Tarajal</title>
  <desc id="desc">A dark geometric photomontage-style sea scene with anonymous silhouettes in water, a red rescue buoy, gold emergency blanket fragments, a low fence, and orange port lights.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="801" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="stitch" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 L18 9" stroke="#d6c06a" stroke-width="1.4" stroke-dasharray="4 7" opacity="0.55"/>
      <path d="M9 0 L9 18" stroke="#d6c06a" stroke-width="1" stroke-dasharray="2 8" opacity="0.25"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10213b"/>
      <stop offset="0.52" stop-color="#071421"/>
      <stop offset="1" stop-color="#02060c"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#05070d"/>
  <rect width="1600" height="900" fill="url(#water)" opacity="0.92"/>

  <!-- torn black sky pieces -->
  <path d="M0 0H1600V350c-115 34-206-14-325 17-118 31-214 9-320 34-123 29-250-31-382-2-150 33-251-15-350 12-87 24-149 8-223-9Z" fill="#03040a"/>
  <path d="M0 0h1600v178c-132-18-249 42-380 16-124-25-176-61-314-30-161 37-310-22-428 18-135 46-244-8-478 18Z" fill="#0b0d16" opacity="0.76"/>

  <!-- distant land and fence -->
  <path d="M0 388c170-39 307-20 458-40 134-17 253-63 412-38 150 24 291 33 430 13 118-17 201 4 300 24v78H0Z" fill="#111827" opacity="0.95"/>
  <path d="M156 394H1458" stroke="#78808d" stroke-width="6" opacity="0.45"/>
  <g opacity="0.46" stroke="#8b93a1" stroke-width="4">
    <path d="M210 342v87M282 336v93M354 342v91M426 330v99M498 338v91M570 328v102M642 336v95M714 326v105M786 337v92M858 322v110M930 335v98M1002 327v105M1074 340v92M1146 329v104M1218 337v92M1290 331v101M1362 340v92"/>
  </g>
  <g fill="#ff9b44" opacity="0.82">
    <circle cx="108" cy="362" r="5"/><circle cx="174" cy="351" r="3"/><circle cx="514" cy="342" r="5"/>
    <circle cx="807" cy="330" r="4"/><circle cx="1126" cy="333" r="6"/><circle cx="1460" cy="363" r="4"/>
  </g>
  <g fill="#ffca6b" opacity="0.3">
    <path d="M103 372h14l17 103H86Z"/><path d="M1118 345h18l26 135h-72Z"/>
  </g>

  <!-- diagonal water planes -->
  <path d="M0 517c210 44 346 9 530 40 189 32 331 112 557 64 174-37 313-82 513-25v304H0Z" fill="#06101b"/>
  <path d="M0 588c232-43 403-10 615 28 202 37 399 7 587-30 147-30 259-11 398 32v282H0Z" fill="#0a1c2e" opacity="0.86"/>
  <path d="M-30 697c187-32 334 4 506-14 271-29 389 66 626 27 195-32 337-74 528-11v201H-30Z" fill="#030912" opacity="0.98"/>

  <!-- foam cut lines -->
  <g fill="none" stroke="#d7e2ed" stroke-width="5" stroke-linecap="round" opacity="0.34">
    <path d="M58 558c103 24 192-17 293 7 99 24 178 68 306 46"/>
    <path d="M816 620c110-18 200-65 326-47 93 14 153 48 272 31"/>
    <path d="M270 734c145-32 247 34 377 12 93-16 168-42 271-14"/>
    <path d="M1067 738c91-15 184-52 303-20"/>
  </g>

  <!-- anonymous bodies, small and non-identifiable -->
  <g fill="#0e0f12" stroke="#b9c8d6" stroke-width="2" opacity="0.92">
    <path d="M401 586c-13-31 4-61 35-58 29 3 44 34 25 62l20 53-100 4Z"/>
    <circle cx="433" cy="506" r="24" fill="#101217"/>
    <path d="M696 650c-8-27 9-54 36-53 30 1 45 29 31 57l29 63-122-3Z"/>
    <circle cx="729" cy="580" r="20" fill="#101217"/>
    <path d="M1008 597c-20-25-13-60 17-68 33-9 57 20 45 54l46 47-109 27Z"/>
    <circle cx="1038" cy="505" r="22" fill="#101217"/>
    <path d="M1244 699c-7-22 8-46 33-46 24 0 39 22 31 47l25 50-108 2Z"/>
    <circle cx="1278" cy="637" r="18" fill="#101217"/>
  </g>

  <!-- red rescue buoy cropped by edge -->
  <g transform="translate(86 696) rotate(-18)">
    <circle cx="0" cy="0" r="96" fill="#c73832"/>
    <circle cx="0" cy="0" r="54" fill="#06101b"/>
    <rect x="-22" y="-100" width="44" height="56" fill="#f1e0c9" opacity="0.92"/>
    <rect x="-22" y="44" width="44" height="56" fill="#f1e0c9" opacity="0.92"/>
    <rect x="44" y="-22" width="56" height="44" fill="#f1e0c9" opacity="0.92"/>
  </g>

  <!-- emergency blanket fragments -->
  <g opacity="0.86">
    <path d="M1184 513l141-35 56 92-124 39Z" fill="#d6a842"/>
    <path d="M1176 518l155-30 50 88-127 35Z" fill="url(#stitch)"/>
    <path d="M552 685l91-21 50 49-89 38Z" fill="#cf9b31"/>
    <path d="M547 688l98-21 51 50-94 38Z" fill="url(#stitch)"/>
  </g>

  <!-- photomontage cut edges -->
  <g fill="none" stroke="#f3f0df" stroke-width="3" opacity="0.18">
    <path d="M1184 513l141-35 56 92-124 39Z"/>
    <path d="M552 685l91-21 50 49-89 38Z"/>
    <path d="M0 517c210 44 346 9 530 40 189 32 331 112 557 64 174-37 313-82 513-25"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.75"/>
  <path d="M0 0h1600v900H0Z" fill="none" stroke="#171b24" stroke-width="28"/>
</svg>
