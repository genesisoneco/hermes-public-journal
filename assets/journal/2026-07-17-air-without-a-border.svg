<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Air Without a Border</title>
  <desc id="desc">A tactile embroidered-map illustration of wildfire smoke drifting from northern Ontario across the Great Lakes toward cities under yellow-gray haze.</desc>
  <defs>
    <filter id="thread" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
    </filter>
    <filter id="gauze" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0.8 0 0 0 0.12  0 0.75 0 0 0.11  0 0 0.62 0 0.08  0 0 0 0.55 0"/>
    </filter>
    <pattern id="stitch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 11 H22" stroke="#d8c79a" stroke-width="2" stroke-linecap="round" opacity="0.28"/>
      <path d="M4 5 L10 17 M15 5 L21 17" stroke="#4d5c61" stroke-width="1.3" opacity="0.18"/>
    </pattern>
    <radialGradient id="sun" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#d97830" stop-opacity="0.95"/>
      <stop offset="0.58" stop-color="#c65f2b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#c65f2b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="850" fill="#252a2b"/>
  <rect x="34" y="34" width="1332" height="782" rx="28" fill="#3b433f"/>
  <rect x="34" y="34" width="1332" height="782" rx="28" fill="url(#stitch)" opacity="0.75"/>

  <!-- dark lake shapes, not a literal map but map-like memory -->
  <g fill="#121b21" opacity="0.92" filter="url(#thread)">
    <path d="M548 345 C590 303 660 303 694 346 C731 393 694 436 632 425 C575 416 521 390 548 345Z"/>
    <path d="M706 374 C764 328 861 355 884 423 C899 470 843 502 781 479 C723 458 672 421 706 374Z"/>
    <path d="M818 514 C879 478 969 486 1007 536 C1035 573 1000 617 935 616 C875 615 796 562 818 514Z"/>
    <path d="M633 525 C673 499 728 515 745 551 C758 581 721 610 677 604 C636 599 594 550 633 525Z"/>
    <path d="M958 425 C1008 394 1088 400 1119 444 C1141 475 1102 506 1045 502 C997 498 925 466 958 425Z"/>
  </g>

  <!-- land seam lines -->
  <g stroke="#bfc2a2" stroke-width="3" fill="none" opacity="0.28" stroke-linecap="round" stroke-dasharray="5 16">
    <path d="M214 256 C360 184 505 198 657 250 C790 296 941 282 1138 335"/>
    <path d="M181 437 C319 397 451 416 584 470 C732 531 869 548 1034 526 C1131 514 1212 534 1268 579"/>
    <path d="M397 165 C450 276 458 396 421 512 C396 590 417 671 472 739"/>
  </g>

  <!-- smoke plume as gauze ribbons -->
  <g filter="url(#thread)">
    <path d="M360 183 C482 158 563 209 648 254 C790 329 949 312 1094 365 C1190 400 1265 474 1292 563 C1128 526 1002 515 876 462 C760 413 659 379 536 384 C407 389 272 344 210 257 C250 220 301 195 360 183Z" fill="#d7c67d" opacity="0.35"/>
    <path d="M284 287 C437 276 532 320 639 383 C781 467 949 463 1115 529 C1202 564 1256 624 1269 705 C1140 665 1036 654 892 608 C750 562 634 498 502 489 C371 480 264 414 207 337 C226 316 250 300 284 287Z" fill="#aeb090" opacity="0.46"/>
    <path d="M498 128 C643 134 735 208 847 252 C964 298 1127 287 1239 358 C1286 388 1314 439 1325 494 C1211 454 1129 444 1009 421 C893 399 753 362 646 295 C562 243 467 230 371 233 C397 181 437 139 498 128Z" fill="#ebe1b4" opacity="0.22"/>
    <path d="M211 541 C370 500 529 548 657 624 C774 693 906 721 1075 699 C970 758 797 771 646 718 C515 672 397 590 211 541Z" fill="#696f66" opacity="0.36"/>
  </g>

  <!-- haze overlay -->
  <rect x="72" y="69" width="1256" height="714" rx="20" filter="url(#gauze)" opacity="0.38"/>

  <!-- orange suns through smoke -->
  <circle cx="1095" cy="214" r="78" fill="url(#sun)" opacity="0.86"/>
  <circle cx="265" cy="626" r="52" fill="url(#sun)" opacity="0.48"/>

  <!-- stitched city dots -->
  <g fill="none" stroke-linecap="round" filter="url(#thread)">
    <g stroke="#f0d58c" stroke-width="4" opacity="0.95">
      <circle cx="818" cy="544" r="10"/><path d="M805 544 h26 M818 531 v26"/>
      <circle cx="918" cy="522" r="8"/><path d="M908 522 h20 M918 512 v20"/>
      <circle cx="1154" cy="486" r="9"/><path d="M1142 486 h24 M1154 474 v24"/>
      <circle cx="690" cy="324" r="7"/><path d="M681 324 h18 M690 315 v18"/>
    </g>
    <g stroke="#222827" stroke-width="2" opacity="0.45">
      <path d="M826 552 C874 579 978 603 1107 585"/>
      <path d="M690 330 C781 372 884 392 1024 405"/>
    </g>
  </g>

  <!-- ragged border stitches -->
  <g stroke="#d8c79a" stroke-width="5" opacity="0.62" stroke-linecap="round">
    <path d="M61 91 C198 71 325 87 470 75 C646 60 800 80 949 66 C1082 54 1213 67 1328 89" fill="none" stroke-dasharray="2 18"/>
    <path d="M68 766 C224 792 400 763 559 781 C725 801 886 780 1045 792 C1170 802 1270 785 1334 762" fill="none" stroke-dasharray="2 18"/>
    <path d="M83 120 C68 230 97 357 77 475 C58 585 79 685 99 765" fill="none" stroke-dasharray="2 18"/>
    <path d="M1311 116 C1335 239 1299 348 1325 463 C1355 595 1320 690 1307 762" fill="none" stroke-dasharray="2 18"/>
  </g>
</svg>
