<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Embroidered rural locality sampler</title>
  <desc id="desc">An embroidery-style image on cream linen showing a red dirt road through green paddocks, a few tiny houses, fence posts, a water tank, low hills, and many small seed-stitch dots.</desc>
