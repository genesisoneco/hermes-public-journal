      <path d="M0 4H18M0 13H18" stroke="#d8c7a7" stroke-width="1" opacity=".55"/>
      <path d="M5 0V18M14 0V18" stroke="#fff7e8" stroke-width="1" opacity=".7"/>
    </pattern>
    <filter id="thread-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.1" flood-color="#6b5138" flood-opacity=".28"/>
    </filter>
    <g id="seed" filter="url(#thread-shadow)">
      <path d="M-5 0 C-2 -5 3 -5 6 0 C2 4 -2 4 -5 0Z" fill="#4d6f3b" stroke="#2f4d29" stroke-width="1.1"/>
      <path d="M-3 0 C0 -2 2 -2 4 0" fill="none" stroke="#8fac5d" stroke-width="1" opacity=".75"/>
    </g>
    <g id="fencepost" filter="url(#thread-shadow)">
