<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Authority Without Classrooms</title>
  <desc id="desc">Risograph-style collage of blank assessment forms, boxes, a hovering stamp, coastline contour lines, a ruler, and a small green frog.</desc>
  <defs>
    <pattern id="dotsTeal" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#0b6f78" opacity="0.26"/>
    </pattern>
    <pattern id="dotsOrange" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.5" fill="#ff6b35" opacity="0.22"/>
    </pattern>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="24"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f3e7c9"/>
  <rect width="1600" height="900" fill="url(#dotsOrange)" opacity="0.9"/>
  <rect width="1600" height="900" fill="url(#dotsTeal)" opacity="0.8"/>

  <!-- coastline / contour traces -->
  <g fill="none" stroke="#0b6f78" stroke-width="6" opacity="0.5" filter="url(#rough)">
    <path d="M1070 76c-32 44-13 77-49 108-34 30-91 18-116 57-28 45 24 93-4 142-25 45-87 31-119 75-40 55 10 125-37 170-37 36-111 1-151 45-30 33-15 91-49 129"/>
    <path d="M1145 96c-28 48-4 88-42 126-37 36-93 22-126 67-31 43 16 85-11 133-29 52-92 44-126 89-38 50-1 109-40 150-42 45-112 11-158 54"/>
    <path d="M1220 127c-17 39 15 77-20 119-31 38-85 38-111 76-30 43 10 90-27 133-34 39-83 29-121 75-34 41-21 92-62 127"/>
  </g>

  <!-- form sheets -->
  <g filter="url(#rough)">
    <rect x="188" y="120" width="520" height="690" transform="rotate(-6 448 465)" fill="#fff7df" stroke="#16232b" stroke-width="7"/>
    <rect x="266" y="88" width="540" height="704" transform="rotate(4 536 440)" fill="#f8eecf" stroke="#16232b" stroke-width="7"/>
    <rect x="716" y="172" width="462" height="572" transform="rotate(-2 947 458)" fill="#fff2ce" stroke="#16232b" stroke-width="7"/>
  </g>

  <!-- form marks without readable text -->
  <g stroke="#16232b" stroke-width="6" fill="none" stroke-linecap="square" opacity="0.88">
    <path d="M342 194h264M342 231h180M342 294h392M342 331h326M342 368h358"/>
    <path d="M802 258h260M802 297h180M802 356h285M802 396h320M802 436h240"/>
    <rect x="344" y="430" width="46" height="46"/><rect x="421" y="430" width="46" height="46"/><rect x="498" y="430" width="46" height="46"/><rect x="575" y="430" width="46" height="46"/>
    <rect x="808" y="500" width="54" height="54"/><rect x="892" y="500" width="54" height="54"/><rect x="976" y="500" width="54" height="54"/>
    <path d="M350 545h300M350 590h255M350 635h330M350 680h210"/>
    <path d="M807 604h260M807 646h190"/>
  </g>

  <!-- orange overlays / misregistration -->
  <g fill="none" stroke="#ff6b35" stroke-width="12" opacity="0.72" filter="url(#rough)">
    <path d="M332 434l21 23 48-57"/>
    <path d="M806 504l26 27 55-70"/>
    <circle cx="624" cy="632" r="70"/>
    <path d="M585 632h78M624 593v78"/>
  </g>

  <!-- hovering rubber stamp -->
  <g transform="translate(990 110) rotate(14)" filter="url(#rough)">
    <rect x="0" y="0" width="300" height="96" rx="18" fill="#16232b"/>
    <rect x="52" y="90" width="190" height="60" rx="12" fill="#333"/>
    <rect x="24" y="146" width="260" height="64" rx="8" fill="#0b6f78"/>
    <rect x="48" y="164" width="210" height="22" fill="#f3e7c9" opacity="0.34"/>
  </g>
  <ellipse cx="1128" cy="360" rx="190" ry="54" fill="#ff6b35" opacity="0.15" transform="rotate(14 1128 360)"/>

  <!-- ruler -->
  <g transform="translate(166 780) rotate(-10)" filter="url(#rough)">
    <rect x="0" y="0" width="720" height="54" fill="#e7c96f" stroke="#16232b" stroke-width="6"/>
    <g stroke="#16232b" stroke-width="4">
      <path d="M35 0v25M70 0v38M105 0v25M140 0v38M175 0v25M210 0v38M245 0v25M280 0v38M315 0v25M350 0v38M385 0v25M420 0v38M455 0v25M490 0v38M525 0v25M560 0v38M595 0v25M630 0v38M665 0v25"/>
    </g>
  </g>

  <!-- frog -->
  <g transform="translate(1178 620)" filter="url(#rough)">
    <ellipse cx="86" cy="96" rx="78" ry="54" fill="#4aa84f" stroke="#16232b" stroke-width="6"/>
    <circle cx="46" cy="50" r="34" fill="#68bd56" stroke="#16232b" stroke-width="6"/>
    <circle cx="126" cy="50" r="34" fill="#68bd56" stroke="#16232b" stroke-width="6"/>
    <circle cx="46" cy="45" r="10" fill="#16232b"/>
    <circle cx="126" cy="45" r="10" fill="#16232b"/>
    <path d="M54 103c22 18 47 18 70 0" fill="none" stroke="#16232b" stroke-width="6" stroke-linecap="round"/>
    <path d="M18 127c-20 24-32 43-8 53M153 127c24 17 41 37 22 56" fill="none" stroke="#16232b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- black registration slashes -->
  <g stroke="#16232b" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M92 112l76 0M130 74v76M1392 768l82 0M1433 725v84"/>
  </g>
  <rect width="1600" height="900" fill="transparent" filter="url(#paper)"/>
</svg>
