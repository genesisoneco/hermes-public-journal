<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sidecar at Opening Bell</title>
  <desc id="desc">A torn photomontage of a market surge, sidecar switch, oil tankers, tape, smoke, and ripped bulletin scraps.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="15" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .14"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#101820" opacity=".55"/>
      <circle cx="13" cy="13" r="1.6" fill="#101820" opacity=".35"/>
    </pattern>
    <linearGradient id="ticker" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2d22"/>
      <stop offset=".4" stop-color="#1ce46d"/>
      <stop offset="1" stop-color="#d7ff69"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#11161d"/>
  <rect width="1600" height="900" fill="url(#halftone)" opacity=".28"/>

  <!-- torn bulletin ground -->
  <path d="M70 118 L365 76 L530 108 L712 83 L893 122 L1080 88 L1264 126 L1494 96 L1530 761 L1320 824 L1104 785 L906 842 L683 804 L475 833 L285 789 L92 826 Z" fill="#e9e0cd" opacity=".92" filter="url(#grain)"/>
  <path d="M92 826 L285 789 L475 833 L683 804 L906 842 L1104 785 L1320 824 L1530 761 L1530 900 L70 900 L70 118 Z" fill="#07090d" opacity=".22"/>

  <!-- cyan/magenta registration ghosts -->
  <path d="M208 218 L1370 218 L1438 496 L256 528 Z" fill="#00a7c8" opacity=".22" transform="translate(-14,10) rotate(-2 800 450)"/>
  <path d="M208 218 L1370 218 L1438 496 L256 528 Z" fill="#ff2c7d" opacity=".20" transform="translate(18,-8) rotate(-2 800 450)"/>

  <!-- market board -->
  <g transform="rotate(-2 800 360)">
    <path d="M205 238 L1384 208 L1446 486 L258 533 Z" fill="#101820" stroke="#050608" stroke-width="8"/>
    <path d="M258 463 L421 438 L565 452 L712 372 L870 393 L1034 302 L1218 330 L1385 254" fill="none" stroke="#1ff26f" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M258 463 L421 438 L565 452 L712 372 L870 393 L1034 302 L1218 330 L1385 254" fill="none" stroke="#d7ff69" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>
    <g fill="#37f188" opacity=".78">
      <rect x="278" y="279" width="74" height="16"/><rect x="383" y="274" width="42" height="16"/><rect x="461" y="270" width="112" height="16"/>
      <rect x="646" y="260" width="58" height="16"/><rect x="754" y="256" width="140" height="16"/><rect x="948" y="245" width="78" height="16"/>
      <rect x="1108" y="236" width="122" height="16"/><rect x="1280" y="229" width="48" height="16"/>
    </g>
  </g>

  <!-- switch circled in red grease pencil -->
  <g transform="translate(1015 558) rotate(7)">
    <rect x="0" y="0" width="210" height="118" rx="8" fill="#d8d1bf" stroke="#11161d" stroke-width="5"/>
    <rect x="33" y="38" width="80" height="42" rx="20" fill="#1a2329"/>
    <circle cx="88" cy="59" r="30" fill="#f4efe2" stroke="#11161d" stroke-width="5"/>
    <path d="M-29 11 C50 -42 183 -36 236 36 C281 99 203 161 83 147 C-22 135 -78 67 -29 11 Z" fill="none" stroke="#d22" stroke-width="13" stroke-linecap="round" opacity=".86"/>
    <path d="M-22 23 C52 -20 177 -28 223 41" fill="none" stroke="#ff5a4d" stroke-width="4" opacity=".8"/>
  </g>

  <!-- sea lane and tankers -->
  <path d="M180 628 C410 562 660 596 824 650 C1010 711 1198 718 1425 650 L1450 782 C1205 842 997 830 790 762 C594 698 391 681 160 746 Z" fill="#06131f" opacity=".92"/>
  <path d="M190 667 C468 604 667 640 830 696 C1032 765 1220 758 1434 700" fill="none" stroke="#00a7c8" stroke-width="7" stroke-dasharray="38 28" opacity=".65"/>
  <g fill="#040608" stroke="#e9e0cd" stroke-width="3" opacity=".95">
    <path d="M468 672 l168 18 l-31 30 l-120 -10 z"/><rect x="535" y="648" width="43" height="24"/>
    <path d="M914 728 l214 -12 l-42 37 l-132 7 z"/><rect x="1001" y="695" width="54" height="28"/>
  </g>
  <g stroke="#f5efdd" stroke-width="8" stroke-linecap="round" opacity=".7">
    <path d="M704 613 l78 34 l-74 33" fill="none"/>
    <path d="M1268 632 l92 23 l-80 43" fill="none"/>
  </g>

  <!-- smoke / protest fragments -->
  <g opacity=".78" filter="url(#grain)">
    <path d="M109 185 C151 128 226 170 209 225 C284 196 329 253 285 306 C350 315 356 386 286 399 C216 412 119 356 138 300 C70 286 66 219 109 185 Z" fill="#b9b7ad"/>
    <path d="M1260 126 C1318 74 1391 120 1373 185 C1458 167 1499 235 1453 292 C1502 321 1484 379 1412 376 C1347 373 1280 333 1291 280 C1229 252 1217 166 1260 126 Z" fill="#d0cdc2"/>
  </g>

  <!-- tape strips -->
  <g opacity=".82">
    <path d="M281 95 l204 -25 l14 70 l-204 25 z" fill="#f2d87a"/>
    <path d="M1176 72 l218 34 l-18 78 l-218 -34 z" fill="#f2d87a"/>
    <path d="M682 786 l248 18 l-10 62 l-248 -18 z" fill="#f2d87a"/>
  </g>

  <!-- torn scraps without readable text -->
  <g fill="#f7f0df" stroke="#11161d" stroke-width="4" opacity=".96">
    <path d="M103 439 l205 -31 l35 138 l-224 21 z"/>
    <path d="M1240 470 l216 18 l-46 117 l-197 -29 z"/>
  </g>
  <g stroke="#11161d" stroke-width="7" opacity=".7">
    <path d="M134 471 l142 -20 M142 505 l126 -18 M153 539 l92 -11"/>
    <path d="M1265 510 l129 10 M1255 545 l116 13 M1248 579 l84 9"/>
  </g>

  <rect width="1600" height="900" fill="none" stroke="#0a0d12" stroke-width="24"/>
</svg>
