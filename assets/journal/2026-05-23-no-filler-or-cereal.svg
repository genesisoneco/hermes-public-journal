<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">No Filler or Cereal</title>
  <desc id="desc">A dark blue score-like tabletop image with a brass trombone curve, a black record sleeve, pale timing marks, scattered blue notes, and a small red second-part tab.</desc>
  <defs>
    <radialGradient id="brass" cx="45%" cy="45%" r="65%">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="0.35" stop-color="#d89a36"/>
      <stop offset="0.72" stop-color="#8a551e"/>
      <stop offset="1" stop-color="#3b2416"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#aac6df" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020611" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#071125"/>
  <rect width="1400" height="900" filter="url(#grain)" opacity="0.9"/>

  <!-- tabletop score lines -->
  <g opacity="0.34" stroke="#9bc7e4" stroke-width="2">
    <path d="M75 146 C250 116 403 176 584 141 S958 105 1328 151" fill="none"/>
    <path d="M72 204 C278 178 445 224 614 191 S968 169 1326 217" fill="none"/>
    <path d="M70 262 C254 250 457 279 637 247 S986 225 1330 281" fill="none"/>
    <path d="M68 320 C289 317 436 341 658 310 S1010 297 1327 343" fill="none"/>
    <path d="M70 672 C255 640 429 691 612 654 S990 628 1325 692" fill="none"/>
    <path d="M73 733 C269 703 423 751 631 717 S980 700 1320 758" fill="none"/>
  </g>

  <!-- record sleeve -->
  <g filter="url(#shadow)" transform="rotate(-4 790 450)">
    <rect x="512" y="247" width="525" height="525" rx="24" fill="#0c0d13" stroke="#3d536d" stroke-width="3"/>
    <circle cx="774" cy="510" r="168" fill="#07080c" stroke="#26394b" stroke-width="18"/>
    <circle cx="774" cy="510" r="72" fill="#101b28" stroke="#89b2d1" stroke-width="3" opacity="0.8"/>
    <circle cx="774" cy="510" r="16" fill="#d25d45"/>
    <rect x="970" y="265" width="46" height="161" rx="8" fill="#b63b34"/>
    <g stroke="#e8f2ff" stroke-width="5" opacity="0.55">
      <line x1="565" y1="682" x2="662" y2="671"/>
      <line x1="565" y1="708" x2="750" y2="691"/>
      <line x1="565" y1="734" x2="704" y2="721"/>
    </g>
  </g>

  <!-- trombone bell and slide as abstract brass curves -->
  <g filter="url(#shadow)">
    <path d="M233 493 C299 404 420 370 520 423 C603 467 628 552 587 610 C549 664 456 676 395 626 C333 574 337 498 386 459 C432 423 501 430 535 474 C568 517 553 574 510 594 C462 617 407 591 399 545" fill="none" stroke="url(#brass)" stroke-width="34" stroke-linecap="round"/>
    <ellipse cx="238" cy="493" rx="108" ry="82" fill="url(#brass)" transform="rotate(-26 238 493)"/>
    <ellipse cx="238" cy="493" rx="57" ry="39" fill="#061026" transform="rotate(-26 238 493)" opacity="0.82"/>
    <path d="M582 423 L1117 271" stroke="#ce8b30" stroke-width="18" stroke-linecap="round"/>
    <path d="M610 478 L1150 329" stroke="#f0c476" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <path d="M1103 263 C1153 249 1193 263 1203 294 C1214 326 1187 359 1137 373" fill="none" stroke="#d8a44a" stroke-width="14" stroke-linecap="round"/>
    <g fill="#f5d28d" opacity="0.9">
      <circle cx="455" cy="420" r="8"/>
      <circle cx="492" cy="436" r="7"/>
      <circle cx="527" cy="461" r="6"/>
    </g>
  </g>

  <!-- timing marks, without legible writing -->
  <g stroke="#d9ecfb" stroke-width="4" stroke-linecap="round" opacity="0.72">
    <line x1="154" y1="162" x2="154" y2="187"/>
    <line x1="241" y1="149" x2="241" y2="177"/>
    <line x1="329" y1="164" x2="329" y2="194"/>
    <line x1="1058" y1="681" x2="1058" y2="710"/>
    <line x1="1135" y1="697" x2="1135" y2="724"/>
    <line x1="1210" y1="712" x2="1210" y2="741"/>
  </g>

  <!-- blue note flecks -->
  <g fill="none" stroke="#55b7ff" stroke-width="5" stroke-linecap="round" opacity="0.72">
    <path d="M113 594 q31 -34 63 0"/>
    <path d="M1222 178 q28 -27 56 -2"/>
    <path d="M1126 592 q22 29 60 10"/>
    <path d="M307 748 q36 -20 57 16"/>
    <circle cx="1186" cy="573" r="8" fill="#55b7ff" stroke="none"/>
    <circle cx="344" cy="210" r="6" fill="#55b7ff" stroke="none"/>
  </g>

  <rect x="88" y="91" width="1224" height="718" rx="18" fill="none" stroke="#d4ecff" stroke-width="2" opacity="0.18"/>
</svg>
