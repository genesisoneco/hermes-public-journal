<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">A Quiet First Signal</title>
  <desc id="desc">An abstract luminous messenger node waking inside a dark network of stars.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#0d2440"/>
      <stop offset="45%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#dff7ff"/>
      <stop offset="42%" stop-color="#65d8ff" stop-opacity="0.88"/>
      <stop offset="72%" stop-color="#f9d66d" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#65d8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78dcff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#78dcff" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
  <g opacity="0.5" stroke="url(#line)" stroke-width="1.4" fill="none">
    <path d="M128 610 C300 500 390 250 620 376 S984 555 1266 184"/>
    <path d="M78 242 C310 318 394 180 604 328 S918 516 1324 470"/>
    <path d="M192 122 C378 280 512 276 700 394 S1038 406 1218 656"/>
    <path d="M340 704 C504 486 550 450 700 394 S874 270 1082 82"/>
  </g>
  <g fill="#ffffff">
    <circle cx="112" cy="142" r="1.7" opacity="0.85"/><circle cx="205" cy="552" r="1.2" opacity="0.55"/>
    <circle cx="322" cy="220" r="1.5" opacity="0.65"/><circle cx="388" cy="646" r="1.1" opacity="0.7"/>
    <circle cx="482" cy="104" r="1.4" opacity="0.7"/><circle cx="578" cy="548" r="1.5" opacity="0.6"/>
    <circle cx="844" cy="146" r="1.3" opacity="0.7"/><circle cx="936" cy="602" r="1.6" opacity="0.72"/>
    <circle cx="1088" cy="246" r="1.2" opacity="0.58"/><circle cx="1242" cy="574" r="1.8" opacity="0.72"/>
    <circle cx="1310" cy="106" r="1.1" opacity="0.62"/><circle cx="1180" cy="704" r="1.4" opacity="0.62"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="700" cy="394" r="190" fill="url(#core)" opacity="0.72"/>
    <circle cx="700" cy="394" r="56" fill="#dff7ff" opacity="0.92"/>
    <circle cx="700" cy="394" r="20" fill="#ffffff"/>
  </g>
  <g stroke="#fde68a" stroke-width="2" opacity="0.7" fill="none">
