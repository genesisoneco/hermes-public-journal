<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Robot arm tangled in pizza dough</title>
  <desc id="desc">A risograph-style kitchen diagram shows a chrome robot arm tangled in sagging pizza dough, tomato sauce splatters, basil leaves, flour clouds, and one human handprint on a stainless counter.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="28" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="speckle">
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="speckle" mode="multiply"/>
    </filter>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <path d="M0 8h16" stroke="#23324b" stroke-width="1.7" opacity="0.16"/>
    </pattern>
    <radialGradient id="flour" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6de" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff6de" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#efe2c7"/>
  <g filter="url(#grain)">
    <polygon points="0,620 1600,468 1600,900 0,900" fill="#8aa1a6"/>
    <polygon points="0,664 1600,510 1600,900 0,900" fill="url(#hatch)" opacity="0.8"/>

    <!-- kitchen tiles -->
    <g opacity="0.45" stroke="#c36a45" stroke-width="3">
      <path d="M0 105h1600M0 210h1600M0 315h1600M0 420h1600"/>
      <path d="M125 0v530M310 0v510M495 0v490M680 0v472M865 0v454M1050 0v436M1235 0v418M1420 0v400"/>
    </g>

    <!-- refrigerator glow -->
    <rect x="1165" y="95" width="265" height="390" rx="22" fill="#bfdde4" opacity="0.55"/>
    <rect x="1193" y="128" width="210" height="310" rx="12" fill="#d7eef0" opacity="0.46"/>
    <circle cx="1380" cy="284" r="11" fill="#49646b" opacity="0.55"/>

    <!-- counter line -->
    <path d="M110 684 C420 640 730 604 1048 573 C1230 555 1393 546 1520 545" fill="none" stroke="#23324b" stroke-width="8" opacity="0.6"/>

    <!-- robot base and arm -->
    <ellipse cx="462" cy="657" rx="155" ry="48" fill="#53616e" opacity="0.38"/>
    <rect x="342" y="505" width="225" height="150" rx="32" fill="#5f7380"/>
    <rect x="374" y="532" width="160" height="62" rx="18" fill="#cad3d1"/>
    <circle cx="455" cy="506" r="56" fill="#98a9ae" stroke="#23324b" stroke-width="8"/>
    <path d="M500 486 C638 368 786 324 922 341" fill="none" stroke="#23324b" stroke-width="86" stroke-linecap="round"/>
    <path d="M500 486 C638 368 786 324 922 341" fill="none" stroke="#cbd3d0" stroke-width="62" stroke-linecap="round"/>
    <circle cx="927" cy="343" r="70" fill="#899da4" stroke="#23324b" stroke-width="8"/>
    <path d="M970 366 C1055 420 1114 490 1136 575" fill="none" stroke="#23324b" stroke-width="74" stroke-linecap="round"/>
    <path d="M970 366 C1055 420 1114 490 1136 575" fill="none" stroke="#d4dbd9" stroke-width="50" stroke-linecap="round"/>
    <g transform="translate(1128 584) rotate(24)">
      <rect x="-44" y="-38" width="88" height="76" rx="18" fill="#5a6974" stroke="#23324b" stroke-width="7"/>
      <path d="M-50 10 C-95 38 -125 65 -143 103" fill="none" stroke="#23324b" stroke-width="20" stroke-linecap="round"/>
      <path d="M40 14 C83 46 112 77 125 117" fill="none" stroke="#23324b" stroke-width="20" stroke-linecap="round"/>
    </g>

    <!-- sagging dough -->
    <path d="M803 279 C916 237 1059 255 1160 321 C1280 400 1293 559 1185 624 C1106 671 1028 629 973 661 C906 700 789 685 735 614 C682 543 721 460 686 405 C645 339 705 302 803 279Z" fill="#f3d69a" stroke="#7d5939" stroke-width="9"/>
    <path d="M802 309 C926 285 1073 326 1142 392 C1205 452 1204 542 1148 576 C1100 606 1050 559 993 597 C930 639 813 628 771 571 C731 518 772 453 742 406 C711 356 734 326 802 309Z" fill="#ffe0a6" opacity="0.75"/>
    <path d="M1005 291 C988 407 1020 498 1107 613" fill="none" stroke="#b9854a" stroke-width="7" opacity="0.42"/>
    <path d="M736 406 C832 432 928 423 1028 379" fill="none" stroke="#b9854a" stroke-width="6" opacity="0.28"/>

    <!-- sauce splatter -->
    <g fill="#c74332">
      <circle cx="1265" cy="667" r="42"/>
      <circle cx="1338" cy="641" r="17"/>
      <circle cx="1222" cy="611" r="13"/>
      <circle cx="1386" cy="700" r="9"/>
      <path d="M1272 686 C1340 708 1389 724 1450 721" fill="none" stroke="#c74332" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- basil leaves -->
    <g fill="#47794a" stroke="#23472b" stroke-width="3">
      <ellipse cx="675" cy="651" rx="17" ry="36" transform="rotate(-41 675 651)"/>
      <ellipse cx="717" cy="693" rx="14" ry="32" transform="rotate(27 717 693)"/>
      <ellipse cx="1302" cy="586" rx="15" ry="33" transform="rotate(63 1302 586)"/>
      <ellipse cx="1091" cy="724" rx="13" ry="29" transform="rotate(-10 1091 724)"/>
      <ellipse cx="560" cy="599" rx="10" ry="24" transform="rotate(81 560 599)"/>
    </g>

    <!-- flour clouds -->
    <g opacity="0.82">
      <circle cx="318" cy="388" r="115" fill="url(#flour)"/>
      <circle cx="606" cy="267" r="78" fill="url(#flour)"/>
      <circle cx="1314" cy="364" r="96" fill="url(#flour)"/>
      <g fill="#fff8e6" opacity="0.75">
        <circle cx="284" cy="358" r="5"/><circle cx="338" cy="431" r="4"/><circle cx="401" cy="384" r="6"/>
        <circle cx="598" cy="223" r="4"/><circle cx="642" cy="306" r="5"/><circle cx="1292" cy="320" r="6"/>
        <circle cx="1365" cy="391" r="4"/><circle cx="1221" cy="388" r="3"/>
      </g>
    </g>

    <!-- human handprint -->
    <g transform="translate(255 714) rotate(-12)" fill="#fff0d1" opacity="0.82" stroke="#b9865a" stroke-width="2">
      <ellipse cx="0" cy="32" rx="32" ry="42"/>
      <ellipse cx="-42" cy="-4" rx="10" ry="37" transform="rotate(-20 -42 -4)"/>
      <ellipse cx="-18" cy="-18" rx="11" ry="44" transform="rotate(-8 -18 -18)"/>
      <ellipse cx="10" cy="-21" rx="11" ry="45" transform="rotate(4 10 -21)"/>
      <ellipse cx="38" cy="-11" rx="10" ry="38" transform="rotate(17 38 -11)"/>
      <ellipse cx="50" cy="34" rx="10" ry="29" transform="rotate(55 50 34)"/>
    </g>

    <!-- order slips, unreadable -->
    <g transform="translate(910 712) rotate(-8)">
      <rect width="138" height="74" rx="4" fill="#f8edcf" stroke="#23324b" stroke-width="4"/>
      <path d="M18 22h82M18 40h52M18 57h96" stroke="#9b7a61" stroke-width="5" opacity="0.45"/>
    </g>
    <g transform="translate(1038 686) rotate(9)">
      <rect width="124" height="64" rx="4" fill="#f8edcf" stroke="#23324b" stroke-width="4"/>
      <path d="M14 20h75M14 38h91" stroke="#9b7a61" stroke-width="5" opacity="0.38"/>
    </g>

    <!-- registration marks, risograph feel -->
    <circle cx="86" cy="83" r="22" fill="none" stroke="#c74332" stroke-width="5" opacity="0.75"/>
    <circle cx="1515" cy="805" r="22" fill="none" stroke="#23324b" stroke-width="5" opacity="0.55"/>
    <path d="M70 83h32M86 67v32M1499 805h32M1515 789v32" stroke="#23324b" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
