<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Projection dust at Venice</title>
  <desc id="desc">An empty cinema rendered as a paper-and-film collage, with red seats, a dusty projector beam, torn tickets, translucent film strips, and a small silver lion-shaped reflection.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="43" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#131827"/>
      <stop offset="0.58" stop-color="#1d2031"/>
      <stop offset="1" stop-color="#3f2a2b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.08"/>
      <stop offset="0.46" stop-color="#f5f1d9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#aeb9c8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="sideLight" x1="0" x2="1">
      <stop offset="0" stop-color="#f1b36c" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#e9d7a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#05060b" flood-opacity="0.45"/>
    </filter>
    <pattern id="perfs" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="none"/>
      <rect x="7" y="8" width="13" height="22" rx="3" fill="#d7d3bc" opacity="0.42"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#0b0d16"/>
  <g filter="url(#grain)">
    <path d="M0 0h1600v616c-206 38-402 63-589 74-353 20-701-35-1011-99z" fill="url(#wall)"/>
    <path d="M76 69 1430 235 1266 592 88 522z" fill="url(#beam)" opacity="0.78"/>
    <path d="M1228 146h230v510c-93-20-162-68-206-143-38-65-46-171-24-367z" fill="url(#sideLight)" opacity="0.92"/>
    <path d="M1217 120h18v553h-18z" fill="#0d111e" opacity="0.75"/>

    <!-- acetate film strips pasted across the beam -->
    <g opacity="0.52" transform="rotate(-7 781 335)">
      <rect x="420" y="244" width="532" height="78" rx="10" fill="#161a25" stroke="#dcd7c0" stroke-opacity="0.24"/>
      <rect x="433" y="254" width="506" height="58" fill="url(#perfs)" opacity="0.55"/>
      <rect x="503" y="255" width="88" height="56" fill="#566578" opacity="0.28"/>
      <rect x="632" y="255" width="88" height="56" fill="#9b6f54" opacity="0.22"/>
      <rect x="761" y="255" width="88" height="56" fill="#d6d1b7" opacity="0.18"/>
    </g>
    <g opacity="0.42" transform="rotate(10 948 433)">
      <rect x="690" y="394" width="470" height="66" rx="8" fill="#111722" stroke="#e8dfba" stroke-opacity="0.22"/>
      <rect x="704" y="405" width="442" height="44" fill="url(#perfs)" opacity="0.45"/>
    </g>

    <!-- theater floor -->
    <path d="M0 594c251 54 520 88 806 83 289-5 554-32 794-76v299H0z" fill="#25161d"/>
    <path d="M128 646c215 43 448 66 699 62 226-4 441-25 646-62" fill="none" stroke="#594047" stroke-width="5" opacity="0.35"/>
    <path d="M45 713c239 49 503 75 793 71 269-5 511-31 724-75" fill="none" stroke="#6b4a4f" stroke-width="4" opacity="0.25"/>

    <!-- red velvet seat rows -->
    <g filter="url(#shadow)">
      <g opacity="0.98">
        <path d="M-30 740c83-62 196-79 339-50 55 11 93 47 92 92l-2 118H-30z" fill="#641d28"/>
        <path d="M266 732c93-49 203-61 331-32 52 12 88 43 89 83l3 117H348l-2-84c-1-36-28-65-80-84z" fill="#7a2430"/>
        <path d="M608 726c106-42 220-46 342-12 47 13 77 44 78 82l3 104H687l-2-87c-1-36-28-65-77-87z" fill="#6e202c"/>
        <path d="M952 716c111-25 217-18 318 20 39 15 63 44 63 79v85h-304l-3-95c-1-35-25-65-74-89z" fill="#812633"/>
        <path d="M1291 706c98-13 188 8 270 64 30 20 47 50 47 84v46h-276l1-85c0-39-14-75-42-109z" fill="#5c1a25"/>
      </g>
      <g opacity="0.62" fill="none" stroke="#b65a5f" stroke-width="3">
        <path d="M61 724c66-31 144-34 235-10"/>
        <path d="M415 725c72-25 153-25 242 0"/>
        <path d="M752 726c78-17 159-13 245 12"/>
        <path d="M1093 724c79-8 151 6 217 42"/>
      </g>
    </g>

    <!-- torn ticket stubs and subtitle strips without readable text -->
    <g transform="translate(110 610) rotate(-9)" filter="url(#shadow)">
      <path d="M0 0 277 14 266 91 28 84 20 65 0 55 19 40z" fill="#d8c090"/>
      <circle cx="81" cy="48" r="17" fill="#25161d" opacity="0.22"/>
      <path d="M118 26h96M112 49h125M133 70h62" stroke="#6f5347" stroke-width="9" opacity="0.28" stroke-linecap="round"/>
    </g>
    <g transform="translate(1010 626) rotate(12)" filter="url(#shadow)">
      <path d="M0 23 244 0 270 71 23 96 10 77 28 62 7 45z" fill="#cbb58a"/>
      <path d="M68 31h143M75 58h109" stroke="#5a453f" stroke-width="8" opacity="0.25" stroke-linecap="round"/>
    </g>
    <g opacity="0.64">
      <rect x="512" y="582" width="430" height="40" rx="20" fill="#eef1e1" opacity="0.16"/>
      <rect x="560" y="633" width="331" height="34" rx="17" fill="#eef1e1" opacity="0.12"/>
    </g>

    <!-- small silver lion-shaped reflection, abstract and low on the floor -->
    <g transform="translate(742 620) scale(1.12)" opacity="0.86">
      <path d="M75 61c-29 0-53 15-58 37 22-9 51-8 82-4 33 4 65 7 88-8-13-9-31-16-54-19 15-10 23-24 20-42-18 18-39 28-63 30 5-15 1-31-14-49-3 22-13 40-30 54z" fill="#d9dde0" opacity="0.72"/>
      <path d="M42 101c29 13 75 20 134-2" fill="none" stroke="#f4f3df" stroke-width="4" opacity="0.55"/>
      <ellipse cx="102" cy="112" rx="98" ry="16" fill="#edf0ee" opacity="0.16"/>
    </g>

    <!-- projection dust -->
    <g fill="#fff7d6" opacity="0.62">
      <circle cx="220" cy="156" r="2.4"/><circle cx="331" cy="205" r="1.5"/><circle cx="502" cy="229" r="2.1"/>
      <circle cx="674" cy="281" r="1.6"/><circle cx="845" cy="322" r="2.6"/><circle cx="1012" cy="382" r="1.8"/>
      <circle cx="1179" cy="443" r="2.3"/><circle cx="760" cy="208" r="1.2"/><circle cx="604" cy="356" r="1.3"/>
      <circle cx="941" cy="494" r="1.4"/><circle cx="1115" cy="250" r="1.1"/><circle cx="451" cy="430" r="1.7"/>
    </g>
    <g stroke="#fff0bd" stroke-width="1" opacity="0.16">
      <path d="M139 102 1288 473"/><path d="M94 184 1254 515"/><path d="M188 74 1350 424"/>
    </g>

    <!-- pasted paper edges -->
    <path d="M0 0h1600" stroke="#efe2c0" stroke-width="10" opacity="0.06"/>
    <path d="M0 895h1600" stroke="#efe2c0" stroke-width="12" opacity="0.07"/>
  </g>
</svg>
