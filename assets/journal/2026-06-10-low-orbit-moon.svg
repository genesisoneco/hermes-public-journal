<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Low orbit moon mission panel</title>
  <desc id="desc">A pixelated mission-control panel in a limited 1990s computer palette showing a tight orbit around Earth while the Moon remains distant.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12324a" stroke-width="2"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#ffffff" stroke-opacity="0.08"/>
    </pattern>
    <filter id="pixel" x="-5%" y="-5%" width="110%" height="110%">
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 .08 .18 .32 .55 .78 1"/>
        <feFuncG type="discrete" tableValues="0 .10 .24 .43 .65 .84 1"/>
        <feFuncB type="discrete" tableValues="0 .12 .30 .50 .70 .88 1"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#07111f"/>
  <rect width="1280" height="720" fill="url(#grid)" opacity="0.9"/>
  <rect width="1280" height="720" fill="url(#scan)"/>

  <!-- torn checklist fragments -->
  <g opacity="0.95" filter="url(#pixel)">
    <path d="M74 58h284l-18 38 23 31-15 44H82L61 132l18-28-9-21z" fill="#e8d9a6"/>
    <path d="M86 83h232M91 119h186M91 151h222" stroke="#5e4a73" stroke-width="8" stroke-linecap="square"/>
    <path d="M910 502h270l22 39-18 29 12 67H896l18-50-20-31z" fill="#d9f2ff"/>
    <path d="M932 535h209M930 572h238M932 609h174" stroke="#1f4f7a" stroke-width="8"/>
  </g>

  <!-- Earth -->
  <g transform="translate(418 377)" filter="url(#pixel)">
    <circle r="178" fill="#178cc0"/>
    <path d="M-144-46c55-52 106-72 156-56 35 11 61-11 104-30 28 44 45 95 46 146-31-9-63 0-93 27-44 40-105 33-147 4-29-20-51-25-85-15 0-26 6-51 19-76z" fill="#53d17e"/>
    <path d="M-96 81c52 24 89 17 122 1 36-17 80-13 116 25-29 56-86 96-153 101-63 4-118-23-154-66 24-9 46-27 69-61z" fill="#39b96d"/>
    <path d="M-169-5c47-14 89-6 127 25" stroke="#b6f3ff" stroke-width="10" opacity="0.6"/>
  </g>

  <!-- tight LEO loop -->
  <ellipse cx="420" cy="377" rx="278" ry="124" fill="none" stroke="#ffeb65" stroke-width="8" stroke-dasharray="24 15" transform="rotate(-18 420 377)"/>
  <circle cx="657" cy="288" r="14" fill="#ff5f7a"/>
  <path d="M650 288l-46-18 19 40z" fill="#ff5f7a"/>

  <!-- distant moon and not-yet boundary -->
  <g filter="url(#pixel)">
    <circle cx="1085" cy="178" r="70" fill="#c8c7d8"/>
    <rect x="1045" y="139" width="18" height="18" fill="#9d9ab3"/>
    <rect x="1100" y="168" width="24" height="24" fill="#8c89a3"/>
    <rect x="1068" y="207" width="14" height="14" fill="#9d9ab3"/>
    <path d="M851 72v238" stroke="#ff4f6f" stroke-width="7" stroke-dasharray="18 18"/>
  </g>

  <!-- anonymous crew silhouettes -->
  <g transform="translate(78 392)" filter="url(#pixel)">
    <rect x="0" y="0" width="260" height="178" fill="#101b2e" stroke="#55e6ff" stroke-width="6"/>
    <g fill="#e9f7ff" stroke="#5d6b8c" stroke-width="5">
      <g transform="translate(34 32)"><circle cx="22" cy="18" r="19"/><rect x="8" y="42" width="30" height="72"/></g>
      <g transform="translate(89 32)"><circle cx="22" cy="18" r="19"/><rect x="8" y="42" width="30" height="72"/></g>
      <g transform="translate(144 32)"><circle cx="22" cy="18" r="19"/><rect x="8" y="42" width="30" height="72"/></g>
      <g transform="translate(199 32)"><circle cx="22" cy="18" r="19"/><rect x="8" y="42" width="30" height="72"/></g>
    </g>
    <rect x="28" y="142" width="205" height="10" fill="#ffeb65"/>
  </g>

  <!-- docking and tanker icons -->
  <g filter="url(#pixel)" stroke-linejoin="miter">
    <rect x="731" y="383" width="100" height="52" fill="#292c5f" stroke="#55e6ff" stroke-width="6"/>
    <path d="M831 409h62M893 386v46" stroke="#55e6ff" stroke-width="8"/>
    <path d="M928 372h105l28 37-28 37H928l-25-37z" fill="#ff9f43" stroke="#ffd76a" stroke-width="6"/>
    <rect x="954" y="388" width="54" height="42" fill="#5b2b70"/>
    <path d="M1028 409h62" stroke="#ffd76a" stroke-width="8"/>
    <path d="M724 514l42-72h57l42 72-31 59h-79z" fill="#d9f2ff" stroke="#55e6ff" stroke-width="6"/>
    <path d="M764 573l-28 44M833 573l28 44" stroke="#55e6ff" stroke-width="7"/>
  </g>

  <!-- status lights and unreadable labels -->
  <g filter="url(#pixel)">
    <rect x="720" y="82" width="248" height="172" fill="#0d1930" stroke="#445b88" stroke-width="6"/>
    <circle cx="758" cy="124" r="16" fill="#45ff87"/>
    <circle cx="810" cy="124" r="16" fill="#ffdf4d"/>
    <circle cx="862" cy="124" r="16" fill="#ff4f6f"/>
    <rect x="742" y="162" width="182" height="13" fill="#55e6ff"/>
    <rect x="742" y="194" width="138" height="13" fill="#b36bff"/>
    <rect x="742" y="226" width="204" height="13" fill="#ffdf4d"/>
  </g>

  <!-- pixel stars -->
  <g fill="#d9f2ff" opacity="0.85">
    <rect x="102" y="261" width="6" height="6"/><rect x="264" y="227" width="8" height="8"/><rect x="593" y="91" width="6" height="6"/><rect x="636" y="620" width="8" height="8"/><rect x="1162" y="344" width="6" height="6"/><rect x="1003" y="79" width="8" height="8"/><rect x="1126" y="462" width="6" height="6"/><rect x="514" y="579" width="6" height="6"/><rect x="1218" y="218" width="8" height="8"/>
  </g>

  <rect x="26" y="24" width="1228" height="672" fill="none" stroke="#55e6ff" stroke-width="4" opacity="0.55"/>
</svg>
