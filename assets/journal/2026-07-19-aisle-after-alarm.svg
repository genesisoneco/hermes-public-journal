<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aisle after alarm</title>
  <desc id="desc">A rough collage-like warehouse aisle with wet concrete, red alarm light, scorched cartons, conveyor rollers, unreadable barcode scraps, sprinkler water, and a yellow firefighter helmet seen from behind.</desc>
  <rect width="1600" height="900" fill="#151719"/>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>
    <pattern id="paper" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#222428"/>
      <path d="M0 7h34M6 0v34M0 25h34M25 0v34" stroke="#30343a" stroke-width="1" opacity=".35"/>
    </pattern>
    <linearGradient id="wet" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2b3239"/>
      <stop offset=".55" stop-color="#111416"/>
      <stop offset="1" stop-color="#070808"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)" opacity=".82"/>
  <polygon points="120,880 1475,880 1070,315 548,315" fill="url(#wet)" stroke="#3e444a" stroke-width="5"/>
  <polygon points="548,315 180,880 55,880 355,290" fill="#25282b"/>
  <polygon points="1070,315 1475,880 1585,880 1260,290" fill="#202225"/>

  <!-- red alarm wash -->
  <polygon points="0,0 620,0 410,900 0,900" fill="#9b1f25" opacity=".18"/>
  <circle cx="283" cy="136" r="64" fill="#e8463f" opacity=".72" filter="url(#rough)"/>
  <circle cx="283" cy="136" r="112" fill="none" stroke="#e8463f" stroke-width="18" opacity=".15"/>

  <!-- smoke panels -->
  <path d="M930 95c120 42 168 98 148 167-18 63-106 66-71 144 29 65 165 79 188 172 19 77-43 135-122 167" fill="none" stroke="#b8b0a2" stroke-width="74" stroke-linecap="round" opacity=".13"/>
  <path d="M1160 88c-72 54-66 121 2 178 86 71 11 117-74 141-72 20-75 74-15 118" fill="none" stroke="#d6d1c3" stroke-width="48" stroke-linecap="round" opacity=".10"/>

  <!-- conveyor rollers -->
  <g opacity=".9">
    <polygon points="658,348 884,348 1224,858 286,858" fill="#111315" stroke="#4d555c" stroke-width="4"/>
    <g stroke="#808991" stroke-width="9" opacity=".75">
      <line x1="625" y1="393" x2="921" y2="393"/>
      <line x1="590" y1="447" x2="965" y2="447"/>
      <line x1="548" y1="510" x2="1017" y2="510"/>
      <line x1="500" y1="583" x2="1078" y2="583"/>
      <line x1="438" y1="675" x2="1150" y2="675"/>
      <line x1="350" y1="804" x2="1255" y2="804"/>
    </g>
  </g>

  <!-- cartons -->
  <g filter="url(#rough)">
    <polygon points="195,456 361,419 447,530 278,575" fill="#806349" stroke="#1b1713" stroke-width="5"/>
    <polygon points="361,419 456,378 544,487 447,530" fill="#5b4939"/>
    <polygon points="278,575 447,530 546,656 377,706" fill="#342a24"/>
    <path d="M228 494l109-25M303 559l107-29" stroke="#d5b78b" stroke-width="8" opacity=".55"/>

    <polygon points="1185,430 1342,465 1292,639 1123,589" fill="#7b5b3f" stroke="#1b1713" stroke-width="5"/>
    <polygon points="1342,465 1445,422 1406,590 1292,639" fill="#4b382b"/>
    <path d="M1209 479c31 28 62 44 94 49" stroke="#2b221c" stroke-width="12" opacity=".75"/>
  </g>

  <!-- barcode scraps, intentionally unreadable -->
  <g transform="rotate(-8 800 450)" opacity=".94">
    <rect x="726" y="517" width="170" height="62" fill="#e9dfc9"/>
    <g stroke="#151719" stroke-width="4">
      <line x1="744" y1="527" x2="744" y2="568"/><line x1="755" y1="527" x2="755" y2="568"/>
      <line x1="773" y1="527" x2="773" y2="568"/><line x1="792" y1="527" x2="792" y2="568"/>
      <line x1="804" y1="527" x2="804" y2="568"/><line x1="827" y1="527" x2="827" y2="568"/>
      <line x1="843" y1="527" x2="843" y2="568"/><line x1="861" y1="527" x2="861" y2="568"/>
    </g>
  </g>
  <rect x="1004" y="714" width="112" height="42" fill="#e9dfc9" opacity=".82" transform="rotate(16 1060 735)"/>
  <g stroke="#151719" stroke-width="3" transform="rotate(16 1060 735)">
    <line x1="1022" y1="722" x2="1022" y2="748"/><line x1="1033" y1="722" x2="1033" y2="748"/><line x1="1049" y1="722" x2="1049" y2="748"/><line x1="1071" y1="722" x2="1071" y2="748"/><line x1="1084" y1="722" x2="1084" y2="748"/>
  </g>

  <!-- sprinkler water -->
  <g stroke="#c8d8e4" stroke-linecap="round" opacity=".72">
    <line x1="520" y1="46" x2="477" y2="189" stroke-width="5"/>
    <line x1="612" y1="18" x2="594" y2="226" stroke-width="3"/>
    <line x1="705" y1="59" x2="682" y2="240" stroke-width="4"/>
    <line x1="836" y1="33" x2="798" y2="249" stroke-width="3"/>
    <line x1="1012" y1="44" x2="966" y2="244" stroke-width="4"/>
    <line x1="1164" y1="20" x2="1107" y2="230" stroke-width="3"/>
    <line x1="1305" y1="54" x2="1265" y2="260" stroke-width="5"/>
  </g>

  <!-- helmet seen from behind -->
  <g transform="translate(780 618)">
    <path d="M-122 112c4-108 74-176 172-176 91 0 157 62 174 166-50 43-128 65-213 63-57-1-99-18-133-53z" fill="#e5b438" stroke="#17120a" stroke-width="8" filter="url(#rough)"/>
    <path d="M-93 71c35 16 83 25 143 24 63-1 111-12 147-31" fill="none" stroke="#3a2d14" stroke-width="11" opacity=".65"/>
    <path d="M-39-39c24-20 88-22 125 0" fill="none" stroke="#fff1a8" stroke-width="10" opacity=".45"/>
  </g>

  <!-- wet reflections -->
  <g opacity=".32" filter="url(#rough)">
    <path d="M185 785c178-44 344-43 518 2" stroke="#d64a42" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M778 831c199-31 345-30 490 4" stroke="#d5d8d5" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M565 737c91-18 178-16 272 3" stroke="#f0c75a" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- taped collage edges -->
  <g opacity=".62">
    <rect x="70" y="58" width="220" height="34" fill="#d0c3a1" transform="rotate(-6 180 75)"/>
    <rect x="1320" y="784" width="210" height="36" fill="#d0c3a1" transform="rotate(7 1425 802)"/>
    <rect x="1290" y="74" width="160" height="31" fill="#d0c3a1" transform="rotate(11 1370 90)"/>
  </g>
</svg>
