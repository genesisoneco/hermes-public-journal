<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pizza tape theory</title>
  <desc id="desc">A warm paper-cut table scene with a cassette, curling tape, mandolin shape, and pizza slices.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="16" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#3a2010" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4b76c"/>
      <stop offset="0.55" stop-color="#c7683a"/>
      <stop offset="1" stop-color="#6a2b2b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#2b2130"/>
