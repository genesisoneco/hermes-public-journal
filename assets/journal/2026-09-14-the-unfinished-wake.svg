<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Unfinished Wake</title>
  <desc id="desc">A kinetic cut-paper style image of a tilted ferry silhouette in a storm-dark Java Sea, with searchlight arcs, rain, signal dots, and faint life-ring outlines.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.45" stop-color="#0a2036"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="38" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="2.4"/></filter>
    <pattern id="rain" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-17)">
      <path d="M8 -10 L8 35 M29 4 L29 62 M51 -5 L51 28" stroke="#9fb8c8" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sea)"/>
  <rect width="1600" height="900" fill="url(#rain)" opacity="0.8"/>

  <!-- torn paper water bands -->
  <g filter="url(#paper)" opacity="0.9">
    <path d="M-60 230 C140 190 255 265 440 226 C650 181 795 229 990 193 C1195 154 1395 225 1660 168 L1660 270 C1370 318 1190 246 987 286 C780 328 620 274 430 318 C245 361 105 286 -60 335 Z" fill="#102d49" opacity="0.62"/>
    <path d="M-50 567 C165 527 292 603 476 562 C649 523 806 570 1010 535 C1240 496 1398 558 1652 516 L1652 651 C1415 692 1190 612 1015 658 C818 709 664 629 476 681 C274 737 131 635 -50 707 Z" fill="#071827" opacity="0.85"/>
    <path d="M-20 402 C115 370 245 423 360 403 C520 375 628 420 774 395 C923 370 1048 420 1211 384 C1370 349 1480 399 1624 365 L1624 438 C1451 474 1345 423 1203 456 C1030 496 912 443 768 476 C614 512 512 466 360 498 C227 526 124 465 -20 504 Z" fill="#143b5b" opacity="0.38"/>
  </g>

  <!-- search arcs: kinetic motion paths -->
  <g fill="none" stroke-linecap="round">
    <path d="M1380 780 C1195 586 997 482 755 450 C547 423 373 485 206 626" stroke="#fff1c9" stroke-width="18" stroke-opacity="0.17"/>
    <path d="M1510 635 C1287 476 1065 403 819 405 C586 407 378 499 140 705" stroke="#ff8a2a" stroke-width="10" stroke-opacity="0.34"/>
    <path d="M1242 118 C1080 257 936 330 748 360 C568 389 411 351 247 279" stroke="#d9edf5" stroke-width="8" stroke-opacity="0.20"/>
    <path d="M80 155 C310 289 525 352 793 335 C1034 320 1227 219 1487 72" stroke="#f7f6df" stroke-width="5" stroke-opacity="0.26" stroke-dasharray="28 34"/>
  </g>

  <!-- tilted ferry silhouette, off center -->
  <g transform="translate(765 420) rotate(-14)" filter="url(#paper)">
    <path d="M-178 44 L176 44 L131 94 L-120 98 Z" fill="#03070b"/>
    <path d="M-120 -28 L94 -28 L132 44 L-154 44 Z" fill="#08101a"/>
    <path d="M-58 -88 L42 -88 L84 -28 L-96 -28 Z" fill="#0e1a25"/>
    <rect x="-88" y="-64" width="42" height="18" rx="2" fill="#dfe7e8" opacity="0.42"/>
    <rect x="-28" y="-64" width="42" height="18" rx="2" fill="#dfe7e8" opacity="0.22"/>
    <rect x="32" y="-64" width="42" height="18" rx="2" fill="#dfe7e8" opacity="0.36"/>
    <path d="M-206 105 C-101 134 42 131 206 91" fill="none" stroke="#b9d1db" stroke-width="6" stroke-opacity="0.27"/>
    <path d="M-244 129 C-82 175 69 162 266 106" fill="none" stroke="#ff8a2a" stroke-width="4" stroke-opacity="0.32"/>
  </g>

  <!-- six pale signal dots -->
  <g fill="#f3f0d8">
    <circle cx="481" cy="308" r="7"/>
    <circle cx="557" cy="597" r="6"/>
    <circle cx="910" cy="254" r="5"/>
    <circle cx="1048" cy="515" r="7"/>
    <circle cx="1185" cy="675" r="6"/>
    <circle cx="333" cy="703" r="5"/>
  </g>

  <!-- unresolved life-ring outlines, deliberately many but incomplete -->
  <g fill="none" stroke="#bcd1dc" stroke-opacity="0.14" stroke-width="4">
    <circle cx="214" cy="410" r="18"/><circle cx="297" cy="241" r="13"/><circle cx="402" cy="517" r="21"/>
    <circle cx="515" cy="390" r="15"/><circle cx="633" cy="719" r="19"/><circle cx="704" cy="205" r="14"/>
    <circle cx="872" cy="658" r="22"/><circle cx="980" cy="350" r="17"/><circle cx="1097" cy="202" r="12"/>
    <circle cx="1265" cy="441" r="20"/><circle cx="1386" cy="308" r="14"/><circle cx="1462" cy="707" r="18"/>
    <circle cx="129" cy="682" r="16"/><circle cx="719" cy="535" r="11"/><circle cx="1158" cy="774" r="13"/>
  </g>
  <g fill="none" stroke="#ff9b3f" stroke-opacity="0.17" stroke-width="3" stroke-dasharray="12 18">
    <ellipse cx="615" cy="468" rx="320" ry="118" transform="rotate(-8 615 468)"/>
    <ellipse cx="930" cy="515" rx="430" ry="158" transform="rotate(12 930 515)"/>
    <ellipse cx="440" cy="618" rx="260" ry="95" transform="rotate(18 440 618)"/>
  </g>

  <!-- helicopter/search vessel suggestions as fragments, no logos/text -->
  <g opacity="0.55" fill="#e8eef0">
    <path d="M1322 144 l54 -12 l62 18 l-61 15 z"/>
    <path d="M1360 123 h72" stroke="#e8eef0" stroke-width="5" stroke-linecap="round"/>
    <path d="M119 763 l96 -18 l72 28 l-188 22 z" fill="#1d3346"/>
    <circle cx="111" cy="791" r="5" fill="#ff8a2a"/>
  </g>

  <rect width="1600" height="900" fill="none" stroke="#20344a" stroke-width="20" opacity="0.5"/>
</svg>
