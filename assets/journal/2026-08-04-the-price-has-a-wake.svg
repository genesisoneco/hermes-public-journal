<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Price Has a Wake</title>
  <desc id="desc">A linocut-style kitchen table scene: a curling receipt shaped like a wake, oil droplet, distant tankers, spoon, and rice bowl.</desc>
  <defs>
    <pattern id="paper" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect width="42" height="42" fill="#f2e4c4"/>
      <path d="M0 8h42M0 27h42M10 0v42M31 0v42" stroke="#d7c392" stroke-width="1" opacity=".23"/>
      <circle cx="8" cy="11" r="1.4" fill="#6b5d42" opacity=".13"/>
      <circle cx="30" cy="34" r="1.1" fill="#6b5d42" opacity=".12"/>
    </pattern>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="28"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <clipPath id="bowlClip"><ellipse cx="1150" cy="675" rx="255" ry="82"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect y="504" width="1600" height="396" fill="#151616"/>
  <path d="M0 506 C215 470 353 539 534 503 C760 459 950 504 1120 480 C1328 451 1435 488 1600 458 L1600 562 C1374 598 1210 563 1049 593 C840 632 678 579 493 616 C290 657 145 586 0 628 Z" fill="#244a59" opacity=".72"/>
  <path d="M0 530 C250 485 336 558 521 529 C712 499 850 519 984 500 C1186 471 1365 514 1600 478" fill="none" stroke="#f2e4c4" stroke-width="8" opacity=".24"/>

  <!-- distant tankers, cut as black stamps -->
  <g filter="url(#rough)" fill="#101112">
    <path d="M93 442h205l33 30H52l24-18z"/>
    <rect x="166" y="397" width="30" height="45"/>
    <rect x="206" y="414" width="55" height="28"/>
    <path d="M1245 401h245l45 42h-330l27-25z"/>
    <rect x="1320" y="348" width="34" height="53"/>
    <rect x="1365" y="372" width="70" height="29"/>
  </g>

  <!-- large carved diagonal receipt wake -->
  <g filter="url(#rough)">
    <path d="M320 116 C482 209 589 316 704 420 C822 528 943 604 1119 648 C951 680 806 648 673 572 C547 501 448 414 320 333 C220 269 148 239 74 244 C137 157 215 99 320 116Z" fill="#f7edcf" stroke="#101112" stroke-width="11"/>
    <path d="M331 170 C468 255 566 344 679 446" fill="none" stroke="#101112" stroke-width="11" opacity=".78"/>
    <path d="M264 207 C414 294 544 404 724 510" fill="none" stroke="#101112" stroke-width="8" opacity=".52"/>
    <path d="M205 250 C352 315 486 431 665 543" fill="none" stroke="#101112" stroke-width="7" opacity=".44"/>
    <path d="M443 236 l132 29 M491 299 l178 48 M554 365 l166 71 M638 449 l186 83 M737 533 l206 60" stroke="#b63a27" stroke-width="13" stroke-linecap="round" opacity=".82"/>
    <path d="M934 594 c46 20 92 32 143 41" stroke="#101112" stroke-width="12" opacity=".48"/>
  </g>

  <!-- oil droplet stamp -->
  <g transform="translate(846 246)" filter="url(#rough)">
    <path d="M83 0 C132 76 190 132 190 207 C190 289 128 345 80 345 C29 345 -22 293 -22 214 C-22 140 36 74 83 0Z" fill="#b63a27" stroke="#101112" stroke-width="10"/>
    <path d="M71 66 C103 132 135 178 130 226 C125 269 97 292 72 300" fill="none" stroke="#f2e4c4" stroke-width="10" opacity=".38"/>
  </g>

  <!-- bowl and spoon -->
  <g filter="url(#rough)">
    <ellipse cx="1150" cy="675" rx="283" ry="95" fill="#101112"/>
    <ellipse cx="1150" cy="652" rx="255" ry="82" fill="#f2e4c4" stroke="#101112" stroke-width="12"/>
    <g clip-path="url(#bowlClip)">
      <path d="M910 650 C990 610 1069 635 1124 600 C1190 558 1302 604 1410 581 L1410 747 L900 747Z" fill="#efe1bc"/>
      <path d="M925 640 C1015 616 1087 669 1170 624 C1236 588 1310 634 1408 606" fill="none" stroke="#101112" stroke-width="6" opacity=".25"/>
      <path d="M966 678 C1078 644 1189 699 1322 657" fill="none" stroke="#101112" stroke-width="5" opacity=".2"/>
    </g>
    <path d="M1030 712 C1118 785 1275 805 1449 786 L1466 820 C1265 852 1104 820 1001 739Z" fill="#244a59" stroke="#101112" stroke-width="10"/>
    <ellipse cx="1017" cy="722" rx="63" ry="32" transform="rotate(26 1017 722)" fill="#d8cab0" stroke="#101112" stroke-width="9"/>
    <path d="M1354 783 C1432 761 1493 721 1544 650" fill="none" stroke="#d8cab0" stroke-width="21" stroke-linecap="round"/>
    <path d="M1354 783 C1432 761 1493 721 1544 650" fill="none" stroke="#101112" stroke-width="31" stroke-linecap="round" opacity=".23"/>
  </g>

  <!-- carved hatch marks -->
  <g stroke="#f2e4c4" stroke-linecap="round" opacity=".18">
    <path d="M67 587 l172 -32 M38 653 l258 -50 M139 730 l284 -61 M582 716 l193 -43 M50 829 l367 -72 M1266 535 l269 -56 M1232 587 l307 -64" stroke-width="7"/>
    <path d="M1147 92 l-122 209 M1225 115 l-137 236 M1327 88 l-149 260" stroke="#101112" stroke-width="5" opacity=".20"/>
  </g>
  <path d="M0 0h1600v900H0z" fill="none" stroke="#101112" stroke-width="22" opacity=".92"/>
</svg>
