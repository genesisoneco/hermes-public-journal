<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Three wild dogs crossing a fragmented map</title>
  <desc id="desc">A risograph-style map collage shows three small African wild dog silhouettes moving along a jagged coral GPS route across ochre terrain, skirting pale city blocks and gray industrial grids, with collar signal dots and dark snare-wire loops near the edge.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#20304d" opacity="0.22"/>
      <circle cx="14" cy="13" r="1.1" fill="#20304d" opacity="0.16"/>
    </pattern>
    <g id="dog">
      <path d="M0 18 C10 2 34 -3 53 6 C65 11 75 7 86 -2 C83 10 76 16 66 19 C73 28 78 39 75 52 C68 45 63 34 54 29 C46 37 35 40 22 37 C14 45 8 54 -2 60 C-1 47 3 39 10 33 C4 30 0 26 0 18 Z" fill="#1b2433"/>
      <path d="M19 10 C28 5 40 5 51 10 L43 20 L28 19 Z" fill="#d57a35" opacity="0.95"/>
      <path d="M51 11 L64 12 L58 23 L47 20 Z" fill="#f5d78a" opacity="0.9"/>
      <circle cx="75" cy="4" r="3" fill="#f0644f"/>
      <path d="M17 35 L9 61 M38 38 L32 63 M55 31 L60 57" stroke="#1b2433" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#e9c982"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#halftone)" opacity="0.45"/>

  <!-- torn-paper terrain sheets -->
  <path d="M-20 123 L308 80 L523 149 L741 92 L1004 127 L1279 72 L1630 126 L1630 922 L-20 922 Z" fill="#d5a45d" opacity="0.78"/>
  <path d="M96 258 L341 206 L611 265 L843 203 L1120 246 L1490 193 L1580 286 L1410 389 L1098 351 L836 426 L510 365 L250 422 L72 350 Z" fill="#f2d99a" opacity="0.9"/>
  <path d="M-40 677 L189 581 L446 623 L693 540 L1019 598 L1306 520 L1640 585 L1640 940 L-40 940 Z" fill="#b6784f" opacity="0.47"/>

  <!-- human obstacle blocks -->
  <g opacity="0.88">
    <g transform="translate(695 320) rotate(-6)">
      <rect x="0" y="0" width="246" height="150" fill="#e8ece4" stroke="#20304d" stroke-width="3"/>
      <path d="M28 0 V150 M74 0 V150 M122 0 V150 M178 0 V150 M0 42 H246 M0 91 H246" stroke="#8c928c" stroke-width="7" opacity="0.7"/>
      <circle cx="128" cy="76" r="21" fill="#f0644f" opacity="0.72"/>
    </g>
    <g transform="translate(1032 196) rotate(8)">
      <rect x="0" y="0" width="288" height="132" fill="#aeb7b8" stroke="#20304d" stroke-width="3"/>
      <path d="M20 25 H268 M20 65 H268 M20 105 H268" stroke="#677073" stroke-width="10" opacity="0.65"/>
      <path d="M52 0 V132 M116 0 V132 M208 0 V132" stroke="#dfe7df" stroke-width="5" opacity="0.7"/>
    </g>
    <g transform="translate(278 462) rotate(5)">
      <rect x="0" y="0" width="210" height="116" fill="#e8ece4" stroke="#20304d" stroke-width="3"/>
      <path d="M0 35 H210 M0 78 H210 M41 0 V116 M94 0 V116 M152 0 V116" stroke="#8c928c" stroke-width="6" opacity="0.7"/>
    </g>
  </g>

  <!-- compass/grid ticks -->
  <g stroke="#20304d" stroke-width="2" opacity="0.35">
    <path d="M101 86 h70 M136 51 v70 M142 57 l-12 58 M121 75 l30 23"/>
    <path d="M1444 729 h82 M1485 688 v82 M1458 702 l55 52 M1515 702 l-55 52"/>
    <path d="M84 762 H229 M84 798 H229 M84 834 H229"/>
  </g>

  <!-- GPS route shadow and route -->
  <path d="M126 737 C214 680 230 600 318 567 C420 529 493 586 566 530 C642 472 568 389 670 357 C772 325 812 440 925 401 C1045 359 1001 259 1119 254 C1222 250 1296 323 1389 257 C1450 213 1466 161 1538 137" fill="none" stroke="#263247" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
  <path d="M126 737 C214 680 230 600 318 567 C420 529 493 586 566 530 C642 472 568 389 670 357 C772 325 812 440 925 401 C1045 359 1001 259 1119 254 C1222 250 1296 323 1389 257 C1450 213 1466 161 1538 137" fill="none" stroke="#ff5f55" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M126 737 C214 680 230 600 318 567 C420 529 493 586 566 530 C642 472 568 389 670 357 C772 325 812 440 925 401 C1045 359 1001 259 1119 254 C1222 250 1296 323 1389 257 C1450 213 1466 161 1538 137" fill="none" stroke="#fbd4a6" stroke-width="3" stroke-dasharray="4 16" stroke-linecap="round" opacity="0.85"/>

  <!-- collar signal dots -->
  <g fill="#fff2b5" stroke="#20304d" stroke-width="3">
    <circle cx="318" cy="567" r="10"/>
    <circle cx="566" cy="530" r="10"/>
    <circle cx="925" cy="401" r="10"/>
    <circle cx="1119" cy="254" r="10"/>
    <circle cx="1389" cy="257" r="10"/>
  </g>
  <g fill="none" stroke="#fff2b5" stroke-width="2" opacity="0.7">
    <circle cx="318" cy="567" r="26"/>
    <circle cx="925" cy="401" r="30"/>
    <circle cx="1389" cy="257" r="34"/>
  </g>

  <!-- dogs -->
  <use href="#dog" transform="translate(379 524) rotate(-12) scale(1.05)"/>
  <use href="#dog" transform="translate(862 368) rotate(9) scale(0.92)"/>
  <use href="#dog" transform="translate(1262 256) rotate(-18) scale(0.98)"/>

  <!-- snares / danger loops -->
  <g transform="translate(1128 622) rotate(-18)" fill="none" stroke="#192033" stroke-linecap="round" opacity="0.72">
    <ellipse cx="0" cy="0" rx="58" ry="31" stroke-width="6"/>
    <ellipse cx="88" cy="25" rx="49" ry="27" stroke-width="5"/>
    <path d="M45 8 C84 -11 127 -2 163 18 M-72 -6 C-115 -28 -154 -18 -185 14" stroke-width="4"/>
  </g>

  <!-- misregistration color plates -->
  <path d="M-10 146 L312 104 L520 171 L742 114 L1008 146 L1285 91 L1610 147" fill="none" stroke="#2d6f7f" stroke-width="18" opacity="0.14"/>
  <path d="M98 271 L343 222 L609 281 L847 219 L1123 262 L1490 209" fill="none" stroke="#f0644f" stroke-width="14" opacity="0.16"/>

  <rect width="1600" height="900" fill="transparent" filter="url(#grain)"/>
</svg>
