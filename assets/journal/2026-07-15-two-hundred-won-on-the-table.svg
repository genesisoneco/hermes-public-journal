<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two coins and a payroll slip on a table</title>
  <desc id="desc">An off-center paper-collage tabletop shows two brass coins separated by a narrow red line, a blank payroll slip, torn memo paper, a metal pen, and a coffee ring in gray-blue morning light.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="715" result="noise"/>
      <feColorMatrix type="saturate" values="0.25"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <filter id="coin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="9" flood-color="#1e252a" flood-opacity="0.35"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.075" numOctaves="3" seed="200" result="speckle"/>
      <feBlend in="SourceGraphic" in2="speckle" mode="overlay"/>
    </filter>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d7dde0"/>
      <stop offset="0.55" stop-color="#a9b4ba"/>
      <stop offset="1" stop-color="#65747c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0d08c"/>
      <stop offset="0.45" stop-color="#b78232"/>
      <stop offset="1" stop-color="#6d4a1d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#table)"/>
  <rect width="1600" height="900" fill="#31424b" opacity="0.12"/>

  <!-- angled tabletop shadows -->
  <polygon points="0,690 1600,525 1600,900 0,900" fill="#293840" opacity="0.22"/>
  <polygon points="0,0 940,0 0,255" fill="#eef3f2" opacity="0.20"/>

  <!-- torn memo layers / blank administrative surfaces -->
  <g filter="url(#paper)">
    <polygon points="210,168 892,109 932,378 248,438" fill="#e9ece8" opacity="0.95"/>
    <polyline points="210,168 235,174 260,165 285,172 310,164 335,170 360,163 385,168 410,160" fill="none" stroke="#c7cec9" stroke-width="3" opacity="0.7"/>
    <polygon points="610,290 1268,252 1301,619 647,652" fill="#f6f2e8" opacity="0.94"/>
    <polygon points="690,343 1197,321 1211,565 704,591" fill="#e7dfd1" opacity="0.58"/>
    <path d="M702 392 L1168 372 M706 440 L1170 421 M710 489 L1175 470 M714 538 L1178 519" stroke="#aab0ab" stroke-width="4" opacity="0.34" stroke-linecap="round"/>
    <polygon points="1120,132 1460,188 1415,396 1085,354" fill="#d4dde0" opacity="0.72"/>
  </g>

  <!-- coffee ring -->
  <ellipse cx="1186" cy="686" rx="164" ry="54" fill="none" stroke="#6f4f32" stroke-width="14" opacity="0.22" transform="rotate(-7 1186 686)"/>
  <ellipse cx="1186" cy="686" rx="128" ry="39" fill="none" stroke="#6f4f32" stroke-width="4" opacity="0.18" transform="rotate(-7 1186 686)"/>

  <!-- narrow negotiation gap / red pencil line -->
  <path d="M782 245 C793 326 798 413 792 506 C786 591 803 668 824 745" fill="none" stroke="#9c2f2b" stroke-width="12" stroke-linecap="round" opacity="0.92"/>
  <path d="M812 244 C824 327 828 419 822 511 C817 598 834 672 858 742" fill="none" stroke="#e8d7c7" stroke-width="7" stroke-linecap="round" opacity="0.78"/>

  <!-- two coins, close but not touching -->
  <g filter="url(#coin)">
    <ellipse cx="675" cy="506" rx="124" ry="112" fill="#3b3324" opacity="0.28"/>
    <circle cx="658" cy="486" r="105" fill="url(#brass)"/>
    <circle cx="658" cy="486" r="82" fill="none" stroke="#f6d891" stroke-width="9" opacity="0.62"/>
    <circle cx="658" cy="486" r="36" fill="none" stroke="#714d21" stroke-width="5" opacity="0.38"/>
    <path d="M615 428 C642 411 688 413 714 441" fill="none" stroke="#fff0bd" stroke-width="7" opacity="0.42" stroke-linecap="round"/>

    <ellipse cx="941" cy="498" rx="124" ry="112" fill="#3b3324" opacity="0.25"/>
    <circle cx="921" cy="478" r="105" fill="url(#brass)"/>
    <circle cx="921" cy="478" r="82" fill="none" stroke="#f6d891" stroke-width="9" opacity="0.62"/>
    <circle cx="921" cy="478" r="36" fill="none" stroke="#714d21" stroke-width="5" opacity="0.38"/>
    <path d="M880 420 C906 404 954 406 981 434" fill="none" stroke="#fff0bd" stroke-width="7" opacity="0.42" stroke-linecap="round"/>
  </g>

  <!-- metal pen, no readable text -->
  <g transform="translate(384 670) rotate(-13)">
    <rect x="0" y="0" width="470" height="24" rx="12" fill="#52606a"/>
    <rect x="36" y="4" width="340" height="7" rx="3" fill="#aeb9bd" opacity="0.65"/>
    <polygon points="470,1 545,12 470,24" fill="#9a3b32"/>
    <polygon points="545,12 572,12 545,20" fill="#2d3235"/>
  </g>

  <!-- collage pins / registration marks without text -->
  <g opacity="0.65">
    <circle cx="294" cy="222" r="10" fill="#8f3d35"/>
    <circle cx="1214" cy="310" r="8" fill="#8f3d35"/>
    <path d="M250 760 h90 M295 715 v90" stroke="#e8eceb" stroke-width="5" opacity="0.44"/>
    <path d="M1355 120 h80 M1395 80 v80" stroke="#394a52" stroke-width="5" opacity="0.28"/>
  </g>

  <!-- paper fibers / dust -->
  <g stroke="#f8f4e7" stroke-width="2" opacity="0.22">
    <path d="M90 150 l68 -17"/><path d="M140 510 l112 -20"/><path d="M1010 158 l142 -9"/><path d="M1328 487 l88 16"/><path d="M1030 792 l174 -32"/>
  </g>
  <g fill="#2d3b43" opacity="0.12">
    <circle cx="185" cy="330" r="3"/><circle cx="214" cy="334" r="2"/><circle cx="1105" cy="242" r="3"/><circle cx="1180" cy="610" r="2"/><circle cx="726" cy="692" r="3"/><circle cx="1390" cy="710" r="4"/>
  </g>
</svg>
