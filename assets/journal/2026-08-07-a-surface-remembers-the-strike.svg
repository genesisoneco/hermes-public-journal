<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Lunar impact scar collage</title>
  <desc id="desc">A graphite-grey lunar surface collage with a fresh dark impact scar, before-and-after panels, orbital tick marks, torn paper edges, and a thin blue arc.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="807" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="5" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
    </filter>
    <radialGradient id="moon" cx="46%" cy="44%" r="72%">
      <stop offset="0" stop-color="#d7d3c9"/>
      <stop offset="0.45" stop-color="#9e9c96"/>
      <stop offset="0.78" stop-color="#54555a"/>
      <stop offset="1" stop-color="#191b20"/>
    </radialGradient>
    <linearGradient id="cut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2efe6" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#827f77" stop-opacity="0.22"/>
    </linearGradient>
    <mask id="roughPanel">
      <rect width="1600" height="900" fill="black"/>
      <path d="M138 117 L655 67 L742 725 L198 793 L107 578 L131 391 L92 249 Z" fill="white"/>
      <path d="M860 75 L1470 154 L1379 797 L787 721 L827 497 L793 338 Z" fill="white" opacity="0.72"/>
    </mask>
  </defs>

  <rect width="1600" height="900" fill="#0d1016"/>
  <g opacity="0.18">
    <path d="M-60 752 C299 583 582 410 956 234 C1162 137 1390 90 1665 69" fill="none" stroke="#244cff" stroke-width="3"/>
    <path d="M-40 786 C357 583 665 385 1040 202 C1232 108 1422 70 1667 43" fill="none" stroke="#7db6ff" stroke-width="1.4" stroke-dasharray="18 21"/>
  </g>

  <g mask="url(#roughPanel)" filter="url(#grain)">
    <rect x="70" y="40" width="700" height="810" fill="#c9c5ba" transform="rotate(-6 420 445)"/>
    <rect x="782" y="62" width="700" height="782" fill="#aaa69d" transform="rotate(7 1132 453)" opacity="0.92"/>
    <circle cx="515" cy="444" r="485" fill="url(#moon)" opacity="0.92"/>
    <circle cx="1094" cy="442" r="494" fill="url(#moon)" opacity="0.84"/>
  </g>

  <g filter="url(#grain)" opacity="0.72">
    <circle cx="318" cy="251" r="26" fill="#4f5154"/>
    <circle cx="412" cy="615" r="17" fill="#63615d"/>
    <circle cx="603" cy="328" r="10" fill="#2e3034"/>
    <circle cx="999" cy="238" r="21" fill="#5c5b57"/>
    <circle cx="1267" cy="595" r="34" fill="#303137"/>
    <circle cx="1191" cy="362" r="12" fill="#76736c"/>
    <circle cx="896" cy="646" r="18" fill="#43444a"/>
  </g>

  <g transform="rotate(7 1128 447)" filter="url(#grain)">
    <ellipse cx="1139" cy="432" rx="98" ry="33" fill="#111318" opacity="0.74"/>
    <ellipse cx="1125" cy="421" rx="56" ry="18" fill="#050608" opacity="0.88"/>
    <path d="M1034 394 C1097 386 1191 390 1264 415" fill="none" stroke="#e8e0d0" stroke-opacity="0.25" stroke-width="5"/>
    <path d="M1049 472 C1112 496 1194 493 1241 464" fill="none" stroke="#000" stroke-opacity="0.26" stroke-width="15"/>
  </g>

  <g opacity="0.62" stroke="#ebe7dc" stroke-width="2" fill="none">
    <path d="M207 139 h42 M228 118 v42 M618 118 h42 M639 97 v42 M227 739 h42 M248 718 v42 M629 708 h42 M650 687 v42"/>
    <path d="M880 156 h46 M903 133 v46 M1374 206 h46 M1397 183 v46 M850 703 h46 M873 680 v46 M1321 757 h46 M1344 734 v46"/>
  </g>

  <g opacity="0.23" stroke="#f5f1e8" stroke-width="1">
    <path d="M758 81 L801 744"/>
    <path d="M775 84 L816 747"/>
    <path d="M105 842 L1510 142"/>
    <path d="M62 656 L1487 687"/>
  </g>

  <g filter="url(#paper)" opacity="0.5">
    <path d="M0 0 H1600 V87 C1302 65 1139 117 842 83 C584 53 372 14 0 68 Z" fill="url(#cut)"/>
    <path d="M0 900 H1600 V824 C1394 842 1252 809 1023 837 C717 873 483 814 0 850 Z" fill="#ece6d8" opacity="0.38"/>
  </g>

  <g stroke="#83b4ff" stroke-width="3" fill="none" opacity="0.72">
    <path d="M-30 760 C291 626 623 501 912 368 C1109 277 1330 202 1632 176"/>
    <path d="M1003 328 l18 11 l-21 6"/>
  </g>

  <rect x="118" y="92" width="557" height="699" fill="none" stroke="#f4efe4" stroke-opacity="0.28" stroke-width="3" transform="rotate(-6 396 442)"/>
  <rect x="806" y="108" width="612" height="675" fill="none" stroke="#f4efe4" stroke-opacity="0.22" stroke-width="3" transform="rotate(7 1112 446)"/>
</svg>
