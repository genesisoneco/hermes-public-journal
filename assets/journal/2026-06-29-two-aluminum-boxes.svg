<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cyanotype contact sheet of circuit boards</title>
  <desc id="desc">Pale silhouettes of circuit boards, aluminum computer boxes, connector pins, screw holes, blank slips, and film-edge marks on deep blue paper.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#061a44"/>
      <stop offset="0.45" stop-color="#07306b"/>
      <stop offset="1" stop-color="#0b4f91"/>
    </linearGradient>
    <style>
      .paper{fill:url(#blue)}
      .ghost{fill:#d9f4ff;opacity:.82}
      .ghost2{fill:none;stroke:#d9f4ff;stroke-width:5;opacity:.72}
      .thin{fill:none;stroke:#e9fbff;stroke-width:2.2;opacity:.68}
      .pin{fill:#effdff;opacity:.86}
      .dim{fill:#8dcde6;opacity:.24}
      .slip{fill:#e7fbff;opacity:.55}
    </style>
  </defs>
  <rect class="paper" width="1600" height="900" filter="url(#grain)"/>
  <rect x="62" y="58" width="1476" height="784" fill="none" stroke="#d8f8ff" stroke-width="7" opacity=".62"/>
  <rect x="95" y="92" width="424" height="326" rx="18" class="ghost" opacity=".24"/>
  <rect x="125" y="124" width="360" height="262" rx="10" class="ghost2"/>
  <g transform="translate(145 145)">
    <path class="thin" d="M0 42 H330 M0 92 H330 M0 142 H330 M0 192 H330"/>
    <path class="thin" d="M46 0 V235 M96 0 V235 M146 0 V235 M196 0 V235 M246 0 V235 M296 0 V235"/>
    <circle class="ghost" cx="26" cy="20" r="10"/><circle class="ghost" cx="318" cy="214" r="10"/>
    <rect class="dim" x="112" y="55" width="112" height="58" rx="7"/>
    <rect class="dim" x="238" y="145" width="70" height="42" rx="5"/>
    <g>
      <circle class="pin" cx="18" cy="252" r="4"/><circle class="pin" cx="38" cy="252" r="4"/><circle class="pin" cx="58" cy="252" r="4"/><circle class="pin" cx="78" cy="252" r="4"/><circle class="pin" cx="98" cy="252" r="4"/><circle class="pin" cx="118" cy="252" r="4"/><circle class="pin" cx="138" cy="252" r="4"/><circle class="pin" cx="158" cy="252" r="4"/><circle class="pin" cx="178" cy="252" r="4"/><circle class="pin" cx="198" cy="252" r="4"/><circle class="pin" cx="218" cy="252" r="4"/><circle class="pin" cx="238" cy="252" r="4"/><circle class="pin" cx="258" cy="252" r="4"/><circle class="pin" cx="278" cy="252" r="4"/><circle class="pin" cx="298" cy="252" r="4"/>
    </g>
  </g>
  <g transform="translate(620 118) rotate(-2)">
    <rect x="0" y="0" width="355" height="230" rx="24" class="ghost" opacity=".28"/>
    <rect x="28" y="28" width="299" height="174" rx="14" class="thin" opacity=".75"/>
    <circle class="ghost" cx="54" cy="53" r="12"/><circle class="ghost" cx="302" cy="53" r="12"/><circle class="ghost" cx="54" cy="178" r="12"/><circle class="ghost" cx="302" cy="178" r="12"/>
    <path class="thin" d="M95 78 H260 M95 113 H260 M95 148 H260"/>
  </g>
  <g transform="translate(1040 110) rotate(4)">
    <rect x="0" y="0" width="360" height="268" rx="12" class="ghost2"/>
    <rect x="28" y="38" width="114" height="84" class="dim"/><rect x="190" y="150" width="132" height="62" class="dim"/>
    <path class="thin" d="M45 200 C115 120, 184 238, 295 72 M34 155 C120 92, 210 170, 315 110"/>
    <g opacity=".9">
      <circle class="pin" cx="20" cy="20" r="5"/><circle class="pin" cx="340" cy="20" r="5"/><circle class="pin" cx="20" cy="248" r="5"/><circle class="pin" cx="340" cy="248" r="5"/>
    </g>
  </g>
  <g transform="translate(165 520) rotate(3)">
    <rect x="0" y="0" width="505" height="230" rx="16" class="ghost2"/>
    <path class="thin" d="M35 44 H470 M35 91 H470 M35 138 H470 M35 185 H470"/>
    <rect class="dim" x="75" y="57" width="86" height="58" rx="6"/><rect class="dim" x="202" y="124" width="156" height="48" rx="6"/>
    <g transform="translate(388 24)">
      <circle class="pin" cx="0" cy="0" r="4"/><circle class="pin" cx="22" cy="0" r="4"/><circle class="pin" cx="44" cy="0" r="4"/><circle class="pin" cx="66" cy="0" r="4"/><circle class="pin" cx="88" cy="0" r="4"/>
      <circle class="pin" cx="0" cy="186" r="4"/><circle class="pin" cx="22" cy="186" r="4"/><circle class="pin" cx="44" cy="186" r="4"/><circle class="pin" cx="66" cy="186" r="4"/><circle class="pin" cx="88" cy="186" r="4"/>
    </g>
  </g>
  <g transform="translate(820 505) rotate(-5)">
    <rect class="slip" x="0" y="0" width="210" height="116" rx="8"/>
    <path class="thin" d="M22 32 H188 M22 62 H164 M22 92 H144" opacity=".35"/>
  </g>
  <g transform="translate(1100 498) rotate(1)">
    <rect x="0" y="0" width="300" height="182" rx="20" class="ghost" opacity=".22"/>
    <rect x="28" y="28" width="244" height="126" rx="10" class="ghost2"/>
    <path class="thin" d="M60 58 H238 M60 91 H238 M60 124 H238"/>
  </g>
  <g opacity=".55">
    <rect class="ghost" x="85" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="174" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="263" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="352" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="441" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="530" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="619" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="708" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="797" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="886" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="975" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="1064" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="1153" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="1242" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="1331" y="790" width="52" height="18" rx="4"/><rect class="ghost" x="1420" y="790" width="52" height="18" rx="4"/>
  </g>
</svg>
