      <g transform="translate(546 399) rotate(-12)"><rect x="-28" y="-3" width="56" height="6" rx="3" fill="#e9d7a5"/><circle cx="33" cy="0" r="3" fill="#fff3c9"/></g>
      <g transform="translate(672 291) rotate(8)"><rect x="-24" y="-3" width="48" height="6" rx="3" fill="#d7c390"/><circle cx="29" cy="0" r="3" fill="#fff0bc"/></g>
      <g transform="translate(781 363) rotate(-4)"><rect x="-20" y="-3" width="40" height="6" rx="3" fill="#e1d0a2"/><circle cx="25" cy="0" r="2.5" fill="#fff1c4"/></g>
      <g transform="translate(908 325) rotate(5)"><rect x="-26" y="-3" width="52" height="6" rx="3" fill="#d8c79b"/><circle cx="32" cy="0" r="3" fill="#fff0bd"/></g>
    </g>

    <g stroke="#d49b5a" stroke-width="1" opacity="0.25" fill="none">
      <path d="M160 337 C282 307 400 313 522 342 C663 376 796 381 942 342 C1031 318 1117 314 1200 323"/>
      <path d="M0 359 C143 341 271 349 397 377 C532 408 684 411 823 379 C942 351 1059 345 1200 366"/>
      <path d="M0 382 C151 372 285 379 410 404 C545 430 683 436 822 409 C950 384 1063 383 1200 404"/>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#0b0d12" stroke-width="28" opacity="0.88"/>
