    <g opacity="0.95">
      <g transform="translate(312 344) rotate(-7)"><rect x="-22" y="-3" width="44" height="6" rx="3" fill="#e6d8b0"/><circle cx="27" cy="0" r="3" fill="#f6e9ba"/></g>
