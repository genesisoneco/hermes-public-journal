      <path d="M112 70 C179 83 239 87 311 79 C384 70 474 81 538 111"/>
      <path d="M90 118 C164 128 247 132 326 123 C405 115 486 126 560 156"/>
      <path d="M141 540 C223 524 305 533 380 559 C456 585 532 583 615 545"/>
      <path d="M700 588 C780 565 884 562 973 590 C1030 608 1092 610 1161 596"/>
