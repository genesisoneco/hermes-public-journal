<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The bill grows teeth</title>
  <desc id="desc">A cut-paper risograph-style office scene with a dot-matrix printer spitting a long blank invoice ribbon across a dark desk, red calculator blocks, a tipped coffee cup, and a leaning plant.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply" opacity="0.18"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="halftone" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.35" fill="#11151c" opacity="0.18"/>
      <circle cx="9" cy="9" r="1.05" fill="#11151c" opacity="0.12"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1cf"/>
      <stop offset="1" stop-color="#d9c79a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#10141d"/>
  <g filter="url(#grain)">
    <rect x="0" y="0" width="1600" height="900" fill="#151a24"/>
    <polygon points="0,0 1600,0 1140,540 0,330" fill="#243a43" opacity="0.72"/>
    <polygon points="1600,120 1600,900 690,900 1045,492" fill="#0b0e15" opacity="0.84"/>
    <rect x="104" y="118" width="338" height="232" fill="#0a0d14" stroke="#2d4f58" stroke-width="8" transform="rotate(-2 273 234)"/>
    <g opacity="0.9">
      <rect x="137" y="150" width="28" height="9" fill="#ffe7a7" opacity="0.55"/>
      <rect x="190" y="184" width="14" height="14" fill="#ffe7a7" opacity="0.35"/>
      <rect x="266" y="162" width="20" height="20" fill="#ffe7a7" opacity="0.5"/>
      <rect x="349" y="220" width="12" height="12" fill="#ffe7a7" opacity="0.4"/>
      <rect x="406" y="284" width="18" height="8" fill="#ffe7a7" opacity="0.45"/>
    </g>

    <!-- desk -->
    <polygon points="190,584 1430,502 1600,900 0,900" fill="#22222b"/>
    <polygon points="243,610 1348,542 1495,826 118,846" fill="#2f2d35" opacity="0.94"/>
    <polygon points="294,644 1290,585 1364,721 210,776" fill="url(#halftone)" opacity="0.45"/>

    <!-- printer body -->
    <g filter="url(#rough)">
      <polygon points="514,378 912,350 1005,487 568,520" fill="#d7d0bd"/>
      <polygon points="568,520 1005,487 1044,625 594,664" fill="#9aa4a0"/>
      <polygon points="514,378 568,520 594,664 466,541" fill="#6d7f80"/>
      <polygon points="615,405 845,389 888,445 646,464" fill="#11151c" opacity="0.86"/>
      <circle cx="919" cy="421" r="14" fill="#e64239"/>
      <circle cx="956" cy="417" r="10" fill="#2f8b8f"/>
      <rect x="630" y="574" width="280" height="20" fill="#11151c" opacity="0.5" transform="rotate(-5 770 584)"/>
      <g fill="#11151c" opacity="0.38">
        <rect x="503" y="547" width="28" height="28" transform="rotate(-5 517 561)"/>
        <rect x="548" y="553" width="28" height="28" transform="rotate(-5 562 567)"/>
        <rect x="593" y="558" width="28" height="28" transform="rotate(-5 607 572)"/>
      </g>
    </g>

    <!-- invoice ribbon, blank and predatory -->
    <path d="M735 372 C780 300 932 284 1010 329 C1115 390 1014 480 1115 530 C1217 581 1443 480 1498 600 C1547 706 1311 805 1118 764 C926 723 1019 610 835 623 C676 634 577 737 396 712 C258 693 213 594 300 537 C387 480 544 508 619 461 C673 427 691 398 735 372 Z" fill="url(#paper)" stroke="#11151c" stroke-width="8" opacity="0.98"/>
    <path d="M767 380 C838 338 933 337 995 368" fill="none" stroke="#e64239" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M1079 537 C1193 610 1395 520 1454 622" fill="none" stroke="#e64239" stroke-width="7" stroke-linecap="round" opacity="0.65"/>
    <path d="M1004 756 C845 704 1011 609 827 626 C691 639 579 742 407 708" fill="none" stroke="#2f8b8f" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <g fill="#11151c" opacity="0.18">
      <circle cx="806" cy="377" r="4"/><circle cx="832" cy="365" r="4"/><circle cx="858" cy="357" r="4"/><circle cx="884" cy="352" r="4"/><circle cx="910" cy="352" r="4"/><circle cx="936" cy="358" r="4"/><circle cx="962" cy="369" r="4"/>
      <circle cx="1200" cy="562" r="4"/><circle cx="1230" cy="562" r="4"/><circle cx="1260" cy="558" r="4"/><circle cx="1290" cy="551" r="4"/><circle cx="1320" cy="546" r="4"/><circle cx="1350" cy="549" r="4"/><circle cx="1380" cy="563" r="4"/>
      <circle cx="572" cy="696" r="4"/><circle cx="604" cy="680" r="4"/><circle cx="636" cy="662" r="4"/><circle cx="668" cy="647" r="4"/><circle cx="700" cy="635" r="4"/>
    </g>

    <!-- calculator with abstract red blocks -->
    <g transform="rotate(7 1170 648)">
      <polygon points="1040,586 1288,582 1318,735 1065,747" fill="#161922" stroke="#54636a" stroke-width="7"/>
      <rect x="1080" y="608" width="176" height="38" fill="#2a0808"/>
      <g fill="#e64239">
        <rect x="1094" y="619" width="24" height="14"/><rect x="1130" y="619" width="38" height="14"/><rect x="1182" y="619" width="18" height="14"/><rect x="1216" y="619" width="24" height="14"/>
      </g>
      <g fill="#d7d0bd" opacity="0.62">
        <rect x="1092" y="668" width="28" height="21"/><rect x="1136" y="668" width="28" height="21"/><rect x="1180" y="668" width="28" height="21"/><rect x="1224" y="668" width="28" height="21"/>
        <rect x="1096" y="704" width="28" height="21"/><rect x="1140" y="704" width="28" height="21"/><rect x="1184" y="704" width="28" height="21"/><rect x="1228" y="704" width="28" height="21"/>
      </g>
    </g>

    <!-- tipped coffee cup -->
    <g transform="rotate(-19 376 676)">
      <ellipse cx="376" cy="676" rx="58" ry="20" fill="#fff1cf"/>
      <rect x="318" y="676" width="116" height="78" rx="10" fill="#d7d0bd"/>
      <ellipse cx="376" cy="754" rx="58" ry="20" fill="#b1aa98"/>
      <path d="M436 704 C490 695 496 749 444 744" fill="none" stroke="#d7d0bd" stroke-width="18"/>
      <ellipse cx="376" cy="678" rx="42" ry="10" fill="#28150d" opacity="0.85"/>
    </g>

    <!-- leaning plant -->
    <g transform="rotate(13 226 506)">
      <polygon points="172,605 274,605 254,712 196,712" fill="#e64239"/>
      <polygon points="198,605 257,605 246,686 209,686" fill="#7f1d1b" opacity="0.42"/>
      <path d="M224 604 C215 530 208 486 187 438" stroke="#2f8b8f" stroke-width="10" fill="none"/>
      <path d="M226 602 C254 525 286 482 335 444" stroke="#2f8b8f" stroke-width="10" fill="none"/>
      <path d="M217 555 C167 532 145 493 164 459 C205 470 229 500 217 555 Z" fill="#3ea0a0"/>
      <path d="M254 531 C294 485 340 478 373 504 C345 544 300 563 254 531 Z" fill="#3ea0a0"/>
      <path d="M194 480 C151 447 139 405 164 376 C203 393 218 434 194 480 Z" fill="#7ec3bd"/>
      <path d="M304 464 C331 412 375 394 412 415 C393 462 353 485 304 464 Z" fill="#7ec3bd"/>
    </g>

    <!-- red paper shards / teeth -->
    <g fill="#e64239" opacity="0.95">
      <polygon points="990,334 1015,350 987,365"/>
      <polygon points="1041,378 1074,397 1038,413"/>
      <polygon points="1127,532 1163,549 1127,570"/>
      <polygon points="1395,567 1436,589 1397,610"/>
      <polygon points="823,625 852,644 817,660"/>
      <polygon points="431,708 468,724 434,744"/>
    </g>

    <!-- off-register shadows -->
    <path d="M730 389 C792 318 928 305 1004 348" fill="none" stroke="#2f8b8f" stroke-width="18" opacity="0.18"/>
    <path d="M1118 552 C1248 616 1447 542 1490 631" fill="none" stroke="#2f8b8f" stroke-width="18" opacity="0.16"/>
  </g>
</svg>
