<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Pixel-art arcade cabinet in an archive room</title>
  <desc id="desc">A glowing arcade cabinet, ghostly server rack, fossil-like cartridges, amber tiles, cyan screen light, and orange poppies in the coin slot.</desc>
  <defs>
    <filter id="crisp"><feComponentTransfer><feFuncA type="discrete" tableValues="0 1"/></feComponentTransfer></filter>
    <linearGradient id="room" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111521"/>
      <stop offset="0.55" stop-color="#171020"/>
      <stop offset="1" stop-color="#2a160e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1">
      <stop offset="0" stop-color="#6ff7ff"/>
      <stop offset="0.55" stop-color="#2b80ff"/>
      <stop offset="1" stop-color="#a677ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#room)"/>

  <!-- blocky archive shelves -->
  <g shape-rendering="crispEdges" opacity="0.9">
    <rect x="60" y="70" width="260" height="420" fill="#21182a"/>
    <rect x="78" y="95" width="224" height="18" fill="#61402f"/>
    <rect x="78" y="185" width="224" height="18" fill="#61402f"/>
    <rect x="78" y="275" width="224" height="18" fill="#61402f"/>
    <rect x="78" y="365" width="224" height="18" fill="#61402f"/>
    <g fill="#c08a4b">
      <rect x="92" y="122" width="28" height="54"/><rect x="126" y="132" width="42" height="44"/><rect x="178" y="116" width="20" height="60"/><rect x="214" y="142" width="58" height="34"/>
      <rect x="95" y="211" width="52" height="55"/><rect x="159" y="225" width="22" height="41"/><rect x="196" y="205" width="70" height="61"/>
      <rect x="92" y="302" width="30" height="52"/><rect x="138" y="314" width="48" height="40"/><rect x="202" y="296" width="64" height="58"/>
      <rect x="102" y="394" width="44" height="50"/><rect x="162" y="386" width="22" height="58"/><rect x="204" y="404" width="72" height="40"/>
    </g>
    <g fill="#ead7a1" opacity="0.75">
      <rect x="100" y="129" width="12" height="7"/><rect x="222" y="151" width="32" height="8"/><rect x="206" y="213" width="38" height="8"/><rect x="106" y="411" width="24" height="7"/>
    </g>
  </g>

  <!-- server ghost -->
  <g shape-rendering="crispEdges" opacity="0.38">
    <rect x="770" y="95" width="210" height="432" fill="#8feeff"/>
    <rect x="790" y="120" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="164" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="208" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="252" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="296" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="340" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="384" width="170" height="26" fill="#101a28"/>
    <rect x="790" y="428" width="170" height="26" fill="#101a28"/>
    <g fill="#eaffff">
      <rect x="812" y="129" width="9" height="8"/><rect x="832" y="129" width="9" height="8"/><rect x="812" y="217" width="9" height="8"/><rect x="832" y="305" width="9" height="8"/><rect x="812" y="393" width="9" height="8"/>
    </g>
  </g>

  <!-- arcade cabinet -->
  <g shape-rendering="crispEdges">
    <rect x="452" y="76" width="256" height="46" fill="#4b2639"/>
    <rect x="420" y="122" width="320" height="72" fill="#7c3156"/>
    <rect x="444" y="194" width="272" height="230" fill="#2a1929"/>
    <rect x="468" y="218" width="224" height="142" fill="#061421"/>
    <rect x="484" y="234" width="192" height="110" fill="url(#screen)"/>

    <!-- tiny racing-game road -->
    <rect x="568" y="234" width="24" height="110" fill="#202135" opacity="0.8"/>
    <rect x="578" y="250" width="4" height="12" fill="#fff2b0"/><rect x="578" y="286" width="4" height="12" fill="#fff2b0"/><rect x="578" y="322" width="4" height="12" fill="#fff2b0"/>
    <rect x="512" y="252" width="28" height="18" fill="#f45d49"/><rect x="618" y="300" width="32" height="20" fill="#f6cd55"/>
    <rect x="496" y="328" width="12" height="8" fill="#09223c"/><rect x="656" y="248" width="10" height="8" fill="#09223c"/>

    <rect x="420" y="424" width="320" height="76" fill="#9b4b40"/>
    <rect x="452" y="500" width="256" height="92" fill="#54293b"/>
    <rect x="472" y="520" width="216" height="26" fill="#1b1121"/>
    <rect x="526" y="458" width="34" height="24" fill="#ffd166"/>
    <rect x="594" y="458" width="34" height="24" fill="#55d6ff"/>
    <rect x="664" y="452" width="28" height="40" fill="#111521"/>
    <rect x="674" y="462" width="8" height="18" fill="#f6cd55"/>
    <rect x="392" y="592" width="160" height="38" fill="#29192b"/><rect x="608" y="592" width="160" height="38" fill="#29192b"/>
  </g>

  <!-- poppies in coin slot -->
  <g shape-rendering="crispEdges">
    <rect x="672" y="447" width="4" height="34" fill="#7fc06a"/>
    <rect x="682" y="446" width="4" height="30" fill="#7fc06a"/>
    <rect x="662" y="454" width="4" height="25" fill="#7fc06a"/>
    <rect x="656" y="438" width="14" height="14" fill="#ff6b35"/><rect x="670" y="434" width="14" height="14" fill="#ff9f1c"/><rect x="684" y="438" width="14" height="14" fill="#ff6b35"/>
    <rect x="674" y="442" width="8" height="8" fill="#2b1b17"/>
  </g>

  <!-- amber tile floor -->
  <g shape-rendering="crispEdges" opacity="0.55">
    <path d="M0 575h1200v100H0z" fill="#3a2518"/>
    <g stroke="#9c6a3d" stroke-width="4">
      <path d="M0 630h1200"/><path d="M120 575l-60 100"/><path d="M260 575l-20 100"/><path d="M410 575l20 100"/><path d="M560 575l60 100"/><path d="M710 575l100 100"/><path d="M860 575l140 100"/><path d="M1010 575l180 100"/>
    </g>
  </g>

  <!-- screen glow pixels -->
  <g shape-rendering="crispEdges" opacity="0.28" fill="#79f7ff">
    <rect x="372" y="206" width="24" height="24"/><rect x="342" y="260" width="16" height="16"/><rect x="744" y="220" width="20" height="20"/><rect x="790" y="290" width="14" height="14"/>
    <rect x="318" y="405" width="18" height="18"/><rect x="816" y="436" width="20" height="20"/>
  </g>

  <!-- block caption bars as non-legible museum labels -->
  <g shape-rendering="crispEdges" fill="#ead7a1" opacity="0.82">
    <rect x="846" y="536" width="150" height="58"/><rect x="862" y="552" width="104" height="7" fill="#7c5c3e"/><rect x="862" y="568" width="74" height="7" fill="#7c5c3e"/>
    <rect x="206" y="518" width="118" height="46"/><rect x="220" y="532" width="68" height="7" fill="#7c5c3e"/><rect x="220" y="548" width="82" height="7" fill="#7c5c3e"/>
  </g>
</svg>
