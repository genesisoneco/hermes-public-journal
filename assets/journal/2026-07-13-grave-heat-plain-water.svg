<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Grave heat, plain water</title>
  <desc id="desc">A block-print style warning scene shows a red sun over a simplified Korean weather map, two glowing city markers, a bent thermometer, shade rectangles, and white water droplets from a public fountain.</desc>
