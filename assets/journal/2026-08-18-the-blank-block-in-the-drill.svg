<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Blank Block in the Drill</title>
  <desc id="desc">A cyanotype photogram of an empty exercise schedule: parade-ground lane lines, boot prints, an erased block, grid marks, and one red grease-pencil circle.</desc>
  <defs>
    <radialGradient id="blueGlow" cx="48%" cy="44%" r="72%">
      <stop offset="0" stop-color="#174783"/>
      <stop offset="0.52" stop-color="#0b2d62"/>
      <stop offset="1" stop-color="#061836"/>
    </radialGradient>
    <filter id="cyanotypeGrain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="5" seed="218" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.88  0 0 0 0 1  0 0 0 .36 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#bfe7ff" stroke-width="1.5" opacity="0.16"/>
      <path d="M40 0V80M0 40H80" fill="none" stroke="#bfe7ff" stroke-width="1" opacity="0.08"/>
    </pattern>
    <pattern id="pinholes" width="53" height="47" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="11" r="1.5" fill="#d7f3ff" opacity="0.28"/>
      <circle cx="41" cy="35" r="1" fill="#d7f3ff" opacity="0.16"/>
    </pattern>
    <clipPath id="sheet"><rect x="95" y="70" width="1410" height="760" rx="22"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#020b1d"/>
  <g filter="url(#cyanotypeGrain)">
    <rect x="95" y="70" width="1410" height="760" rx="22" fill="url(#blueGlow)" stroke="#d9f7ff" stroke-width="5" opacity="0.98"/>
    <rect x="95" y="70" width="1410" height="760" rx="22" fill="url(#grid)"/>
    <rect x="95" y="70" width="1410" height="760" rx="22" fill="url(#pinholes)"/>

    <g clip-path="url(#sheet)">
      <!-- pale photogram shadows of parade lanes -->
      <g stroke="#d8f4ff" stroke-linecap="round" opacity="0.72" filter="url(#softBlur)">
        <path d="M170 696 C410 636 612 650 850 590 C1064 536 1250 564 1450 508" stroke-width="26"/>
        <path d="M130 566 C382 518 578 532 802 484 C1050 430 1266 452 1502 400" stroke-width="16" opacity="0.54"/>
        <path d="M118 424 C382 392 632 380 844 340 C1080 296 1278 300 1510 252" stroke-width="9" opacity="0.46"/>
      </g>
      <g stroke="#a7dfff" stroke-width="3" opacity="0.42">
        <path d="M170 696 C410 636 612 650 850 590 C1064 536 1250 564 1450 508"/>
        <path d="M130 566 C382 518 578 532 802 484 C1050 430 1266 452 1502 400"/>
        <path d="M118 424 C382 392 632 380 844 340 C1080 296 1278 300 1510 252"/>
      </g>

      <!-- schedule card with blank block, deliberately no text -->
      <g transform="translate(520 150) rotate(-4 320 210)">
        <rect x="0" y="0" width="650" height="395" rx="14" fill="#d9f7ff" opacity="0.20" stroke="#d9f7ff" stroke-width="8"/>
        <rect x="42" y="46" width="566" height="62" rx="5" fill="#e7fbff" opacity="0.42"/>
        <g fill="#d9f7ff" opacity="0.26">
          <rect x="42" y="142" width="180" height="28" rx="4"/>
          <rect x="252" y="142" width="356" height="28" rx="4"/>
          <rect x="42" y="202" width="180" height="28" rx="4"/>
          <rect x="252" y="202" width="356" height="28" rx="4"/>
          <rect x="42" y="322" width="180" height="28" rx="4"/>
          <rect x="252" y="322" width="356" height="28" rx="4"/>
        </g>
        <rect x="40" y="254" width="568" height="50" rx="5" fill="#08306b" opacity="0.78" stroke="#e3fbff" stroke-width="3" stroke-dasharray="12 12"/>
        <path d="M42 126H608M42 188H608M42 246H608M42 310H608M232 126V360" stroke="#e6fbff" stroke-width="3" opacity="0.28"/>
      </g>

      <!-- boot prints as pale silhouettes -->
      <g fill="#e6fbff" opacity="0.30" filter="url(#softBlur)">
        <ellipse cx="345" cy="640" rx="38" ry="91" transform="rotate(-68 345 640)"/>
        <ellipse cx="510" cy="602" rx="34" ry="84" transform="rotate(-68 510 602)" opacity="0.24"/>
        <ellipse cx="1190" cy="520" rx="35" ry="86" transform="rotate(-74 1190 520)" opacity="0.22"/>
        <ellipse cx="1350" cy="478" rx="28" ry="72" transform="rotate(-74 1350 478)" opacity="0.18"/>
      </g>
      <g fill="#071d43" opacity="0.30">
        <circle cx="308" cy="626" r="10"/><circle cx="326" cy="602" r="8"/><circle cx="348" cy="584" r="7"/>
        <circle cx="472" cy="588" r="8"/><circle cx="492" cy="566" r="7"/><circle cx="515" cy="550" r="6"/>
      </g>

      <!-- blankness marker / grease pencil -->
      <g transform="rotate(-9 1120 282)">
        <circle cx="1120" cy="282" r="70" fill="none" stroke="#ff6b49" stroke-width="14" opacity="0.92"/>
        <path d="M1082 254 C1118 228 1165 236 1188 270" fill="none" stroke="#ffb08d" stroke-width="6" opacity="0.72"/>
      </g>
      <path d="M1268 214 l102 -35 l20 32 l-106 31z" fill="#ff6b49" opacity="0.88"/>
      <path d="M1370 179 l55 -18 l-35 50z" fill="#ffd7bd" opacity="0.78"/>

      <!-- registration holes and margin ticks -->
      <g fill="none" stroke="#d8f4ff" opacity="0.48">
        <circle cx="162" cy="132" r="18" stroke-width="5"/>
        <circle cx="1436" cy="132" r="18" stroke-width="5"/>
        <circle cx="162" cy="766" r="18" stroke-width="5"/>
        <circle cx="1436" cy="766" r="18" stroke-width="5"/>
        <path d="M240 104h96M384 104h42M1172 800h160M1368 800h54" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
