<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dark glass astronomy plate with galaxy specks and one red pin</title>
  <desc id="desc">A table-sized glass plate on a dark observatory table, covered in tiny galaxy-like specks, amber coordinate grid lines, scratches, and a single red pin near the lower corner.</desc>
  <defs>
    <radialGradient id="plateGlow" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#0b1d2e"/>
      <stop offset="0.55" stop-color="#06111d"/>
      <stop offset="1" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28415a" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#081522" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9abbd6" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="22" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend mode="screen" in2="SourceGraphic"/>
    </filter>
    <g id="speck">
      <circle r="1.7" fill="#eaf8ff" opacity="0.92"/>
      <circle r="4.5" fill="#9ed9ff" opacity="0.12" filter="url(#soft)"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#0d0b09"/>
  <path d="M0 0h1600v900H0z" fill="#12100d" opacity="0.8" filter="url(#grain)"/>
  <polygon points="178,126 1420,72 1508,769 122,826" fill="#03070d" stroke="#3e5361" stroke-width="5"/>
  <polygon points="178,126 1420,72 1508,769 122,826" fill="url(#plateGlow)"/>
  <polygon points="178,126 1420,72 1508,769 122,826" fill="url(#glass)"/>

  <!-- amber survey grid, slightly skewed with the plate -->
  <g opacity="0.35" stroke="#d79b45" stroke-width="1.25">
    <path d="M250 130 L196 817"/>
    <path d="M392 124 L333 811"/>
    <path d="M534 118 L474 804"/>
    <path d="M676 112 L618 798"/>
    <path d="M818 106 L763 792"/>
    <path d="M960 100 L907 786"/>
    <path d="M1102 94 L1050 780"/>
    <path d="M1244 88 L1194 774"/>
    <path d="M1386 82 L1338 768"/>
    <path d="M179 192 L1434 136"/>
    <path d="M172 272 L1447 217"/>
    <path d="M164 352 L1460 299"/>
    <path d="M156 432 L1473 381"/>
    <path d="M148 512 L1486 463"/>
    <path d="M140 592 L1499 545"/>
    <path d="M132 672 L1512 627"/>
    <path d="M124 752 L1505 711"/>
  </g>

  <!-- galaxy field: hand-placed clusters rather than a smooth gradient -->
  <g opacity="0.96">
    <use href="#speck" x="253" y="199"/><use href="#speck" x="310" y="388"/><use href="#speck" x="356" y="252"/><use href="#speck" x="421" y="720"/>
    <use href="#speck" x="455" y="164"/><use href="#speck" x="498" y="512"/><use href="#speck" x="548" y="327"/><use href="#speck" x="594" y="640"/>
    <use href="#speck" x="639" y="213"/><use href="#speck" x="684" y="455"/><use href="#speck" x="729" y="289"/><use href="#speck" x="772" y="604"/>
    <use href="#speck" x="815" y="168"/><use href="#speck" x="860" y="378"/><use href="#speck" x="905" y="706"/><use href="#speck" x="948" y="252"/>
    <use href="#speck" x="993" y="533"/><use href="#speck" x="1036" y="342"/><use href="#speck" x="1081" y="638"/><use href="#speck" x="1124" y="184"/>
    <use href="#speck" x="1168" y="421"/><use href="#speck" x="1212" y="285"/><use href="#speck" x="1256" y="694"/><use href="#speck" x="1301" y="238"/>
    <use href="#speck" x="1346" y="511"/><use href="#speck" x="1400" y="348"/><use href="#speck" x="1450" y="661"/>
    <circle cx="705" cy="500" r="2.7" fill="#fff5d6"/><circle cx="710" cy="505" r="8" fill="#fff5d6" opacity="0.12" filter="url(#soft)"/>
    <circle cx="1135" cy="576" r="2.3" fill="#d6f0ff"/><circle cx="1140" cy="573" r="10" fill="#8bd5ff" opacity="0.10" filter="url(#soft)"/>
    <circle cx="526" cy="406" r="2.4" fill="#fff"/><circle cx="531" cy="409" r="13" fill="#bcecff" opacity="0.08" filter="url(#soft)"/>
  </g>

  <!-- dust-like small points -->
  <g fill="#e9f6ff" opacity="0.68">
    <circle cx="226" cy="606" r="1"/><circle cx="244" cy="352" r="0.8"/><circle cx="286" cy="266" r="1.1"/><circle cx="328" cy="562" r="0.7"/>
    <circle cx="379" cy="467" r="0.9"/><circle cx="405" cy="333" r="1"/><circle cx="448" cy="619" r="1.1"/><circle cx="486" cy="256" r="0.8"/>
    <circle cx="534" cy="689" r="0.9"/><circle cx="571" cy="184" r="1"/><circle cx="612" cy="388" r="0.8"/><circle cx="647" cy="730" r="0.9"/>
    <circle cx="693" cy="330" r="1"/><circle cx="741" cy="536" r="0.8"/><circle cx="790" cy="228" r="1"/><circle cx="835" cy="633" r="1.1"/>
    <circle cx="884" cy="303" r="0.8"/><circle cx="930" cy="454" r="0.9"/><circle cx="978" cy="671" r="1"/><circle cx="1027" cy="222" r="0.8"/>
    <circle cx="1072" cy="494" r="1.1"/><circle cx="1118" cy="720" r="0.8"/><circle cx="1162" cy="324" r="1"/><circle cx="1210" cy="610" r="0.9"/>
    <circle cx="1265" cy="168" r="1"/><circle cx="1308" cy="451" r="0.8"/><circle cx="1362" cy="595" r="1.1"/><circle cx="1412" cy="268" r="0.9"/>
    <circle cx="1460" cy="742" r="1"/>
  </g>

  <!-- scratches and emulsion scars -->
  <g stroke="#d7e6ef" opacity="0.22" stroke-linecap="round" fill="none">
    <path d="M312 181 C510 164 611 183 802 153"/>
    <path d="M910 130 C1040 162 1220 124 1352 151"/>
    <path d="M221 739 C430 696 526 743 712 709"/>
    <path d="M975 711 C1124 678 1298 718 1455 665"/>
    <path d="M480 206 L460 321"/>
    <path d="M1260 384 L1306 488"/>
  </g>

  <!-- corner pin -->
  <g transform="translate(278 745) rotate(-18)">
    <ellipse cx="31" cy="42" rx="42" ry="13" fill="#000" opacity="0.42"/>
    <path d="M36 36 L141 67" stroke="#b8c8ce" stroke-width="4" stroke-linecap="round"/>
    <circle cx="27" cy="33" r="25" fill="#b21722"/>
    <circle cx="18" cy="23" r="8" fill="#ff7882" opacity="0.55"/>
    <circle cx="27" cy="33" r="25" fill="none" stroke="#5b060d" stroke-width="4"/>
  </g>

  <path d="M178 126 1420 72 1508 769 122 826Z" fill="none" stroke="#a4bbcc" stroke-opacity="0.32" stroke-width="2"/>
  <path d="M160 842 L1515 785" stroke="#000" stroke-opacity="0.6" stroke-width="16" filter="url(#soft)"/>
</svg>
