  <title id="title">Polar bear waking in a Svalbard fjord after a foghorn blast</title>
  <desc id="desc">A woodblock-inspired scene in Prussian blue, white, charcoal, and cinnabar: a polar bear on ice recoils from pale sound rings coming from a small distant vessel in a dark fjord.</desc>
