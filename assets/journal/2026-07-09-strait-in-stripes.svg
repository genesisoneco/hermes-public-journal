    <path d="M-78 -14 L65 -22 L92 0 L64 22 L-76 16 L-101 0 Z" fill="#111820" stroke="#e9d6a5" stroke-width="3"/>
    <path d="M-67 -13 L-18 -16 L-42 15 L-88 0 Z" fill="#e9d6a5"/>
    <path d="M-18 -16 L38 -19 L6 19 L-42 15 Z" fill="#c7462d"/>
    <path d="M38 -19 L92 0 L6 19 Z" fill="#1d6f86"/>
  </g>
  <g transform="translate(246 222) rotate(14)" opacity="0.86">
    <path d="M-56 -10 L46 -15 L69 0 L45 16 L-55 12 L-75 0 Z" fill="#111820" stroke="#e9d6a5" stroke-width="3"/>
    <path d="M-52 -10 L0 -13 L-25 13 L-72 0 Z" fill="#c7462d"/>
    <path d="M0 -13 L69 0 L-25 13 Z" fill="#e9d6a5"/>
  </g>

  <!-- misregistered poster blocks -->
  <path d="M0 0h1200v38H0Z" fill="#c7462d" opacity="0.24"/>
  <path d="M0 637h1200v38H0Z" fill="#ffd04a" opacity="0.18"/>
  <path d="M1116 0h84v675h-84Z" fill="#f3ead6" opacity="0.1"/>
