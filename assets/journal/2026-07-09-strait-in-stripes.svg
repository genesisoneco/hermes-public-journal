<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dazzle-striped ships in a narrow strait</title>
  <desc id="desc">An angular dazzle-camouflage maritime scene with anonymous ships, chart lines, buoys, and a red dashed blockade line crossing a narrow channel at dawn.</desc>
  <defs>
    <pattern id="grain" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="#10212b"/>
      <circle cx="6" cy="12" r="1.3" fill="#f3ead6" opacity="0.18"/>
      <circle cx="37" cy="22" r="0.9" fill="#f3ead6" opacity="0.14"/>
      <circle cx="61" cy="55" r="1.1" fill="#f3ead6" opacity="0.12"/>
      <circle cx="17" cy="63" r="0.8" fill="#f3ead6" opacity="0.12"/>
    </pattern>
    <filter id="rough">
      <feTurbulence baseFrequency="0.018" numOctaves="3" seed="9" type="fractalNoise"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#10212b"/>
  <rect width="1200" height="675" fill="url(#grain)" opacity="0.42"/>
  <path d="M0 0h1200v216c-109 13-199 7-284-12-141-31-260-28-406 10-108 28-226 29-354-2C90 196 38 194 0 202Z" fill="#e9d6a5" opacity="0.88"/>
  <path d="M0 493c98-41 196-61 296-44 118 20 226 84 351 70 151-17 276-112 431-83 57 11 93 27 122 47v192H0Z" fill="#233c4a"/>

  <!-- channel / map planes -->
  <path d="M66 273 C203 220 306 223 413 270 C526 320 641 324 760 283 C881 241 1008 218 1150 260 L1150 413 C1010 370 888 397 759 450 C617 509 466 487 339 422 C236 370 142 367 66 399Z" fill="#b8c5b8" opacity="0.38"/>
  <path d="M56 286 C188 242 300 243 405 286 C527 337 636 343 766 301 C896 259 1018 240 1158 277" fill="none" stroke="#f3ead6" stroke-width="3" opacity="0.55"/>
  <path d="M56 342 C180 311 286 313 391 357 C518 409 644 421 783 367 C910 318 1024 309 1158 345" fill="none" stroke="#f3ead6" stroke-width="2" opacity="0.35"/>
  <path d="M56 393 C166 374 269 379 374 429 C513 495 655 504 798 437 C922 379 1032 376 1158 409" fill="none" stroke="#f3ead6" stroke-width="2" opacity="0.28"/>

  <!-- blockade line -->
