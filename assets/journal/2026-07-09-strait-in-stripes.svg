  <path d="M191 168 L1006 545" fill="none" stroke="#ffd04a" stroke-width="2" stroke-dasharray="8 22" opacity="0.75"/>

  <!-- buoys -->
  <g fill="#ffd04a" stroke="#111820" stroke-width="4">
    <circle cx="217" cy="296" r="12"/>
    <circle cx="467" cy="374" r="10"/>
    <circle cx="843" cy="316" r="12"/>
    <circle cx="1017" cy="406" r="10"/>
  </g>

  <!-- ship 1 -->
  <g transform="translate(662 260) rotate(-13)" filter="url(#rough)">
    <path d="M-162 -37 L140 -51 L180 2 L140 53 L-154 43 L-194 5 Z" fill="#0a1118" stroke="#f3ead6" stroke-width="5"/>
    <path d="M-154 -32 L-82 -36 L-128 40 L-185 4 Z" fill="#f3ead6"/>
    <path d="M-82 -36 L-8 -40 L-53 47 L-128 40 Z" fill="#c7462d"/>
    <path d="M-8 -40 L70 -44 L7 49 L-53 47 Z" fill="#f3ead6"/>
    <path d="M70 -44 L141 -47 L88 51 L7 49 Z" fill="#1d6f86"/>
