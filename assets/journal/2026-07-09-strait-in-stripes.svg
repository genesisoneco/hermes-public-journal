    <rect x="-28" y="-17" width="52" height="38" fill="#111820" stroke="#f3ead6" stroke-width="3"/>
    <path d="M-190 5 L-226 14" stroke="#111820" stroke-width="7"/>
  </g>

  <!-- ship 2 -->
  <g transform="translate(368 408) rotate(21) scale(.82)" filter="url(#rough)">
    <path d="M-132 -31 L115 -40 L154 1 L116 43 L-125 37 L-162 1 Z" fill="#0a1118" stroke="#f3ead6" stroke-width="5"/>
