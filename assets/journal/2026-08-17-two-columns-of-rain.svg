<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two Columns of Rain</title>
  <desc id="desc">A split field-ledger illustration: rain fills a cracked reservoir and rice paddy on the left, while floodwater, a chair, a warning phone shape, and landslide slopes occupy the right.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply" opacity="0.22"/>
    </filter>
    <pattern id="rain" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <line x1="6" y1="-10" x2="6" y2="32" stroke="#d8e2e2" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
      <line x1="30" y1="4" x2="30" y2="50" stroke="#d8e2e2" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    </pattern>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#26364a" stroke-width="3" opacity="0.22"/>
    </pattern>
    <clipPath id="leftClip"><rect x="84" y="94" width="696" height="712" rx="8"/></clipPath>
    <clipPath id="rightClip"><rect x="820" y="94" width="696" height="712" rx="8"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#eee2c7"/>
  <g filter="url(#paper)">
    <rect x="50" y="50" width="1500" height="800" fill="#f2e8cc" stroke="#17243a" stroke-width="10"/>
    <rect x="84" y="94" width="696" height="712" fill="#315a63" stroke="#17243a" stroke-width="6"/>
    <rect x="820" y="94" width="696" height="712" fill="#27324b" stroke="#17243a" stroke-width="6"/>
    <rect x="790" y="50" width="20" height="800" fill="#17243a"/>

    <!-- ledger ticks, deliberately unreadable -->
    <g stroke="#17243a" stroke-width="4" opacity="0.65">
      <line x1="120" y1="148" x2="744" y2="148"/>
      <line x1="856" y1="148" x2="1480" y2="148"/>
      <line x1="120" y1="682" x2="744" y2="682"/>
      <line x1="856" y1="682" x2="1480" y2="682"/>
      <g opacity="0.5">
        <line x1="170" y1="120" x2="170" y2="790"/><line x1="260" y1="120" x2="260" y2="790"/><line x1="350" y1="120" x2="350" y2="790"/>
        <line x1="1250" y1="120" x2="1250" y2="790"/><line x1="1340" y1="120" x2="1340" y2="790"/><line x1="1430" y1="120" x2="1430" y2="790"/>
      </g>
    </g>

    <g clip-path="url(#leftClip)">
      <rect x="84" y="94" width="696" height="712" fill="url(#rain)" opacity="0.8"/>
      <path d="M85 566 C186 534 270 574 360 540 C452 505 532 556 620 512 C685 480 734 494 780 470 L780 806 L85 806 Z" fill="#79a765"/>
      <path d="M84 646 C220 600 292 662 440 620 C556 588 652 632 780 594 L780 806 L84 806 Z" fill="#456f5e" opacity="0.78"/>
      <path d="M84 520 C194 486 302 520 420 486 C550 448 640 474 780 430 L780 806 L84 806 Z" fill="#9d7d50" opacity="0.95"/>
      <path d="M120 620 C190 582 304 616 384 576 C470 532 560 566 650 514" fill="none" stroke="#11243a" stroke-width="7" opacity="0.55"/>
      <g stroke="#17243a" stroke-width="5" stroke-linecap="round" opacity="0.65">
        <path d="M205 640 l60 46 l-28 58"/><path d="M370 612 l-34 50 l54 44"/><path d="M525 588 l42 32 l-18 64"/>
      </g>
      <g stroke="#d5e4b3" stroke-width="7" stroke-linecap="round" opacity="0.9">
        <line x1="145" y1="560" x2="122" y2="676"/><line x1="190" y1="548" x2="174" y2="694"/><line x1="240" y1="560" x2="220" y2="704"/>
        <line x1="520" y1="530" x2="500" y2="695"/><line x1="580" y1="515" x2="548" y2="700"/><line x1="645" y1="498" x2="618" y2="705"/>
      </g>
      <path d="M420 300 c-34 22 -56 72 -42 120 c18 58 94 50 114 0 c18 -46 -2 -96 -72 -120z" fill="#17243a" opacity="0.86"/>
      <path d="M414 405 c-42 26 -74 96 -92 168 l190 -4 c-12 -70 -44 -136 -98 -164z" fill="#17243a" opacity="0.82"/>
      <path d="M300 320 C384 274 486 278 558 326" fill="none" stroke="#f0d66c" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
      <path d="M300 320 C384 274 486 278 558 326" fill="none" stroke="#17243a" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
      <circle cx="160" cy="220" r="58" fill="#f0d66c" opacity="0.75"/>
      <path d="M138 214 h44 M146 238 h28" stroke="#17243a" stroke-width="8" stroke-linecap="square" opacity="0.75"/>
    </g>

    <g clip-path="url(#rightClip)">
      <rect x="820" y="94" width="696" height="712" fill="url(#rain)" opacity="0.86"/>
      <path d="M820 482 L1030 250 L1175 482 L1285 304 L1516 548 L1516 806 L820 806 Z" fill="#151d31"/>
      <path d="M820 482 L1030 250 L1175 482 L1285 304 L1516 548" fill="none" stroke="#f06d42" stroke-width="9" stroke-dasharray="26 20" opacity="0.85"/>
      <rect x="820" y="612" width="696" height="194" fill="#406777" opacity="0.92"/>
      <path d="M820 648 C940 620 1040 676 1160 642 C1300 600 1400 656 1516 626 L1516 806 L820 806 Z" fill="#6a8b93" opacity="0.68"/>
      <g fill="none" stroke="#d8e2e2" stroke-width="4" opacity="0.55">
        <path d="M850 664 C980 636 1080 690 1200 654 C1340 614 1420 670 1510 644"/>
        <path d="M848 724 C1000 690 1100 742 1232 704 C1360 668 1436 724 1518 700"/>
      </g>
      <g stroke="#17243a" stroke-width="12" stroke-linecap="round" fill="none">
        <path d="M1055 476 L1055 672"/><path d="M1212 492 L1212 688"/>
        <path d="M1005 492 C1080 458 1178 460 1240 498"/>
        <path d="M1086 544 L1008 698"/><path d="M1182 548 L1270 704"/>
      </g>
      <path d="M1160 420 c-26 12 -44 40 -41 73 c5 58 86 60 96 6 c8 -40 -16 -70 -55 -79z" fill="#f0d66c" opacity="0.82"/>
      <rect x="906" y="210" width="120" height="194" rx="20" fill="#f2e8cc" stroke="#17243a" stroke-width="9" transform="rotate(-8 966 307)"/>
      <circle cx="984" cy="358" r="8" fill="#17243a"/>
      <g fill="#f06d42" stroke="#17243a" stroke-width="5" opacity="0.95">
        <path d="M1370 190 l70 122 h-140z"/><path d="M1300 346 l58 100 h-116z"/>
      </g>
      <rect x="820" y="94" width="696" height="712" fill="url(#hatch)" opacity="0.38"/>
    </g>

    <!-- misregistration plates and margin marks -->
    <g opacity="0.35" stroke="#f06d42" stroke-width="5" fill="none">
      <rect x="96" y="106" width="672" height="688"/>
      <rect x="832" y="106" width="672" height="688"/>
      <circle cx="798" cy="116" r="14"/><circle cx="798" cy="784" r="14"/>
    </g>
    <g fill="#17243a" opacity="0.72">
      <rect x="116" y="826" width="122" height="10"/><rect x="270" y="826" width="58" height="10"/><rect x="1270" y="826" width="210" height="10"/>
      <rect x="116" y="64" width="90" height="10"/><rect x="1388" y="64" width="92" height="10"/>
    </g>
  </g>
</svg>
