<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ash at Gate C</title>
  <desc id="desc">A horizontal embroidered-frieze-style airport scene with volcanic ash drifting over departure boards, sleeping passengers with suitcases, a distant search rope, and an archive folder panel.</desc>
  <defs>
    <filter id="thread" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.085" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feBlend in="SourceGraphic" in2="mono" mode="multiply"/>
    </filter>
    <pattern id="weft" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 7 H18 M0 15 H18" stroke="#5b3d24" stroke-width="0.7" opacity="0.24"/>
      <path d="M5 0 V18 M13 0 V18" stroke="#d8b876" stroke-width="0.8" opacity="0.20"/>
    </pattern>
    <pattern id="dash" width="26" height="10" patternUnits="userSpaceOnUse">
      <path d="M2 5 H14" stroke="#4c3424" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#c99b57"/>
  <rect width="1600" height="900" fill="url(#weft)" opacity="0.85"/>
  <g filter="url(#thread)">
    <rect x="55" y="68" width="1490" height="760" rx="8" fill="#d7b16c" stroke="#4d2f20" stroke-width="10"/>
    <path d="M72 119 C220 86 338 130 486 96 S760 120 933 91 1238 131 1520 92" fill="none" stroke="#7b2f2a" stroke-width="5" stroke-dasharray="8 14" opacity="0.8"/>
    <path d="M78 787 C230 752 349 799 503 771 S790 803 943 765 1220 803 1519 768" fill="none" stroke="#7b2f2a" stroke-width="5" stroke-dasharray="8 14" opacity="0.8"/>

    <!-- panel one: cancelled departure board, no readable text -->
    <g transform="translate(120 150)">
      <rect x="0" y="0" width="410" height="430" fill="#27313a" stroke="#3b241b" stroke-width="7"/>
      <rect x="25" y="28" width="360" height="54" fill="#111820" stroke="#8f6a37" stroke-width="3"/>
      <g fill="#e0a839">
        <circle cx="55" cy="55" r="5"/><circle cx="80" cy="55" r="5"/><circle cx="105" cy="55" r="5"/>
        <circle cx="155" cy="55" r="5"/><circle cx="180" cy="55" r="5"/><circle cx="205" cy="55" r="5"/>
        <circle cx="280" cy="55" r="5"/><circle cx="305" cy="55" r="5"/><circle cx="330" cy="55" r="5"/>
      </g>
      <g stroke="#d9a42d" stroke-width="6" stroke-linecap="round" opacity="0.92">
        <path d="M35 126 H155 M190 126 H360"/><path d="M35 171 H138 M182 171 H345"/><path d="M35 216 H168 M204 216 H371"/>
        <path d="M35 261 H130 M177 261 H365"/><path d="M35 306 H162 M204 306 H352"/><path d="M35 351 H142 M180 351 H333"/>
      </g>
      <g stroke="#b74432" stroke-width="5" opacity="0.85">
        <path d="M315 113 l35 28 M350 113 l-35 28"/><path d="M315 203 l35 28 M350 203 l-35 28"/><path d="M315 293 l35 28 M350 293 l-35 28"/>
      </g>
      <path d="M55 409 h290" stroke="url(#dash)" stroke-width="8"/>
    </g>

    <!-- panel two: passengers sleeping on terminal floor -->
    <g transform="translate(590 165)" stroke="#402619" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 365 H430" stroke="#6a442c"/>
      <path d="M42 340 q85 -82 180 -12 q40 29 86 10 q45 -18 89 23" fill="none" stroke="#6d4531"/>
      <g fill="#24465a">
        <path d="M62 311 q34 -48 71 0 v52 H62z"/><circle cx="96" cy="276" r="23" fill="#8b593d"/>
        <path d="M215 309 q38 -45 75 2 v53 H215z"/><circle cx="251" cy="276" r="22" fill="#704530"/>
      </g>
      <g fill="#7b2f2a">
        <rect x="130" y="322" width="62" height="48" rx="6"/><rect x="314" y="313" width="72" height="58" rx="7"/>
      </g>
      <path d="M70 95 C150 55 233 60 315 82 S455 88 498 43" fill="none" stroke="#4d5962" stroke-width="9" opacity="0.9"/>
      <path d="M58 132 C195 108 343 153 485 118" fill="none" stroke="#4d5962" stroke-width="5" opacity="0.7"/>
      <g fill="#2d4655" opacity="0.8">
        <path d="M92 78 l74 -18 -19 33 33 19 -78 10 -3 -22z"/>
        <path d="M382 130 l62 -10 -16 25 29 15 -66 10 -4 -19z"/>
      </g>
    </g>

    <!-- panel three: rope, search marks, archive folder -->
    <g transform="translate(1090 150)">
      <path d="M18 405 C95 350 165 382 232 316 S365 262 438 315" fill="none" stroke="#33424a" stroke-width="8" stroke-dasharray="18 12"/>
      <g stroke="#3b241b" stroke-width="5" fill="#bf6d3d">
        <path d="M72 303 l28 73 h-68z"/><path d="M216 260 l27 73 h-66z"/><path d="M360 282 l27 73 h-66z"/>
      </g>
      <path d="M290 68 h170 q18 0 18 18 v225 q0 18 -18 18 H250 q-18 0 -18 -18 V111 q0 -18 18 -18 h62z" fill="#e2c485" stroke="#3e291b" stroke-width="7"/>
      <path d="M312 93 l28 -37 h107 q17 0 28 37" fill="#d6ac62" stroke="#3e291b" stroke-width="7"/>
      <g stroke="#7b2f2a" stroke-width="5" opacity="0.75">
        <path d="M269 147 H433"/><path d="M269 190 H424"/><path d="M269 233 H402"/>
      </g>
      <circle cx="74" cy="95" r="20" fill="#8c4a31" stroke="#3e291b" stroke-width="5"/>
      <path d="M55 122 q32 35 72 0" fill="none" stroke="#3e291b" stroke-width="5"/>
    </g>

    <!-- ash stitches across all panels -->
    <g fill="#57514b" opacity="0.72">
      <circle cx="105" cy="107" r="3"/><circle cx="164" cy="205" r="2"/><circle cx="264" cy="131" r="4"/><circle cx="478" cy="259" r="3"/>
      <circle cx="598" cy="115" r="4"/><circle cx="693" cy="233" r="3"/><circle cx="801" cy="103" r="2"/><circle cx="935" cy="187" r="4"/>
      <circle cx="1038" cy="104" r="3"/><circle cx="1178" cy="210" r="3"/><circle cx="1305" cy="123" r="4"/><circle cx="1445" cy="242" r="3"/>
      <circle cx="1521" cy="377" r="2"/><circle cx="671" cy="502" r="2"/><circle cx="352" cy="602" r="3"/><circle cx="1220" cy="561" r="2"/>
    </g>
  </g>
</svg>
