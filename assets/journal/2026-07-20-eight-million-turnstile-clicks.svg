<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eight Million Turnstile Clicks</title>
  <desc id="desc">A bold flat-color collage shows metal baseball-stadium turnstiles, a small ticket stub, blue wristbands, crowd dots moving through orange gates, and a thin strip of green field under floodlights.</desc>
  <rect width="1600" height="900" fill="#101729"/>

  <!-- pasted paper fields, deliberately misregistered -->
  <polygon points="0,665 1600,610 1600,900 0,900" fill="#20304f"/>
  <polygon points="92,138 1480,86 1542,613 34,664" fill="#f26d21" opacity="0.96"/>
  <polygon points="123,171 1470,125 1509,593 84,638" fill="#151e33"/>
  <polygon points="0,716 1600,672 1600,900 0,900" fill="#18243d" opacity="0.92"/>

  <!-- distant field strip -->
  <polygon points="805,415 1510,388 1513,450 789,483" fill="#28a36a"/>
  <polygon points="840,429 1480,405 1481,423 833,450" fill="#dbf2b7" opacity="0.75"/>

  <!-- floodlights -->
  <g opacity="0.92">
    <line x1="213" y1="125" x2="213" y2="525" stroke="#d8deef" stroke-width="8"/>
    <g fill="#f7f2cf">
      <circle cx="170" cy="120" r="18"/><circle cx="213" cy="112" r="18"/><circle cx="256" cy="120" r="18"/>
    </g>
    <polygon points="170,138 260,138 560,610 0,640" fill="#fff6b0" opacity="0.07"/>
    <line x1="1378" y1="110" x2="1378" y2="505" stroke="#d8deef" stroke-width="8"/>
    <g fill="#f7f2cf">
      <circle cx="1335" cy="105" r="18"/><circle cx="1378" cy="96" r="18"/><circle cx="1421" cy="105" r="18"/>
    </g>
    <polygon points="1335,124 1425,124 1600,590 1090,610" fill="#fff6b0" opacity="0.07"/>
  </g>

  <!-- crowd dots / pockets, not faces -->
  <g opacity="0.95">
    <g fill="#f5d364">
      <circle cx="346" cy="446" r="11"/><circle cx="390" cy="430" r="9"/><circle cx="430" cy="455" r="12"/><circle cx="497" cy="424" r="8"/><circle cx="548" cy="449" r="10"/>
      <circle cx="1010" cy="397" r="10"/><circle cx="1057" cy="377" r="8"/><circle cx="1096" cy="398" r="11"/><circle cx="1158" cy="373" r="9"/><circle cx="1205" cy="402" r="10"/>
    </g>
    <g fill="#75b9ff">
      <circle cx="321" cy="491" r="10"/><circle cx="458" cy="507" r="9"/><circle cx="593" cy="493" r="11"/><circle cx="987" cy="448" r="9"/><circle cx="1128" cy="439" r="12"/><circle cx="1268" cy="431" r="9"/>
    </g>
    <g fill="#f3efdf">
      <circle cx="371" cy="525" r="8"/><circle cx="522" cy="537" r="11"/><circle cx="651" cy="515" r="8"/><circle cx="1042" cy="491" r="10"/><circle cx="1188" cy="481" r="8"/><circle cx="1322" cy="465" r="10"/>
    </g>
  </g>

  <!-- orange entry gates -->
  <g transform="translate(0,0)">
    <rect x="182" y="360" width="82" height="310" rx="9" fill="#f26d21"/>
    <rect x="618" y="334" width="82" height="318" rx="9" fill="#f26d21"/>
    <rect x="1340" y="308" width="82" height="312" rx="9" fill="#f26d21"/>
    <rect x="190" y="390" width="66" height="225" fill="#101729" opacity="0.54"/>
    <rect x="626" y="365" width="66" height="228" fill="#101729" opacity="0.54"/>
    <rect x="1348" y="339" width="66" height="226" fill="#101729" opacity="0.54"/>
  </g>

  <!-- foreground turnstile arms -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="782" cy="720" rx="535" ry="82" fill="#0c1222" opacity="0.55"/>
    <g transform="translate(440 520) skewX(-7)">
      <rect x="0" y="0" width="94" height="285" rx="18" fill="#d6dae4"/>
      <rect x="14" y="18" width="66" height="86" rx="10" fill="#5c6b82"/>
      <circle cx="47" cy="160" r="36" fill="#f3f5f9" stroke="#101729" stroke-width="10"/>
      <line x1="47" y1="160" x2="276" y2="94" stroke="#d6dae4" stroke-width="28"/>
      <line x1="47" y1="160" x2="-72" y2="18" stroke="#d6dae4" stroke-width="22"/>
      <line x1="47" y1="160" x2="72" y2="354" stroke="#d6dae4" stroke-width="22"/>
      <line x1="47" y1="160" x2="276" y2="94" stroke="#ffffff" stroke-width="5" opacity="0.9"/>
    </g>
    <g transform="translate(786 496) skewX(-7)">
      <rect x="0" y="0" width="104" height="320" rx="18" fill="#eef1f5"/>
      <rect x="16" y="20" width="72" height="93" rx="10" fill="#51647e"/>
      <circle cx="52" cy="180" r="42" fill="#f7f8fb" stroke="#101729" stroke-width="11"/>
      <line x1="52" y1="180" x2="402" y2="78" stroke="#eef1f5" stroke-width="34"/>
      <line x1="52" y1="180" x2="-114" y2="14" stroke="#eef1f5" stroke-width="25"/>
      <line x1="52" y1="180" x2="84" y2="396" stroke="#eef1f5" stroke-width="25"/>
      <line x1="52" y1="180" x2="402" y2="78" stroke="#ffffff" stroke-width="6" opacity="0.88"/>
    </g>
  </g>

  <!-- ticket stub and wristbands -->
  <g transform="rotate(-9 705 734)">
    <path d="M604 696 L791 696 L791 768 L604 768 Q626 748 604 732 Q626 712 604 696 Z" fill="#f7e7a6" stroke="#101729" stroke-width="6"/>
    <circle cx="747" cy="732" r="8" fill="#101729" opacity="0.35"/>
    <line x1="642" y1="716" x2="705" y2="716" stroke="#101729" stroke-width="5" opacity="0.38"/>
    <line x1="642" y1="740" x2="724" y2="740" stroke="#101729" stroke-width="5" opacity="0.38"/>
  </g>
  <path d="M918 735 C964 702 1031 705 1072 747" fill="none" stroke="#1da7ff" stroke-width="20" stroke-linecap="round"/>
  <path d="M952 778 C996 754 1042 761 1075 797" fill="none" stroke="#79d2ff" stroke-width="13" stroke-linecap="round"/>

  <!-- count marks as non-readable rhythm -->
  <g stroke="#f7f2cf" stroke-width="7" opacity="0.55">
    <line x1="122" y1="784" x2="152" y2="746"/>
    <line x1="171" y1="781" x2="201" y2="743"/>
    <line x1="220" y1="778" x2="250" y2="740"/>
    <line x1="269" y1="775" x2="299" y2="737"/>
    <line x1="114" y1="748" x2="306" y2="786"/>
    <line x1="1300" y1="688" x2="1332" y2="650"/>
    <line x1="1350" y1="684" x2="1382" y2="646"/>
    <line x1="1400" y1="680" x2="1432" y2="642"/>
    <line x1="1450" y1="676" x2="1482" y2="638"/>
    <line x1="1292" y1="653" x2="1489" y2="690"/>
  </g>

  <!-- paper grain and seam lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <path d="M74 170 C420 128 688 162 971 124 C1220 91 1374 119 1508 98"/>
    <path d="M42 642 C325 600 584 627 902 594 C1154 568 1350 586 1515 560"/>
    <path d="M180 831 C430 789 708 816 996 772 C1231 737 1420 750 1588 731"/>
  </g>
</svg>
