<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Small Tsunami Waves</title>
  <desc id="desc">A constructivist risograph-style quake map with diagonal orange stress lines, blue contour rings around a dark coastal island shape, small wave marks, seismograph traces, and tiny figures on high ground.</desc>
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#0e2536" stroke-width="4" opacity="0.22"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6edcf"/>
      <stop offset="1" stop-color="#d9cda9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="#f46b2a" opacity="0.06"/>

  <!-- sea block -->
  <path d="M0 0 H1600 V900 H0 Z" fill="none"/>
  <path d="M981 -30 L1660 254 L1660 930 L942 930 L1140 661 L1043 487 L1136 318 Z" fill="#12384d" opacity="0.94"/>
  <path d="M1011 27 L1608 276 L1608 881 L994 887 L1190 657 L1088 491 L1177 333 Z" fill="url(#hatch)" opacity="0.5"/>

  <!-- land mass / island -->
  <path d="M602 134 C721 86 855 111 927 198 C1003 290 982 410 1063 487 C1142 562 1296 558 1348 661 C1388 741 1310 819 1191 840 C1040 866 932 785 826 787 C719 790 609 861 503 811 C394 760 382 619 442 526 C493 446 589 423 611 338 C632 255 536 193 602 134 Z" fill="#16202a"/>
  <path d="M647 189 C745 151 849 174 900 241 C955 313 935 405 1005 472 C1076 539 1192 531 1246 611 C1296 685 1225 754 1122 769 C1005 786 922 731 826 735 C730 739 630 787 549 746 C466 704 466 597 515 535 C562 476 641 449 658 370 C674 294 590 232 647 189 Z" fill="#26313b" opacity="0.72"/>

  <!-- epicenter rings -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="744" cy="435" rx="112" ry="58" stroke="#4ab1be" stroke-width="8" opacity="0.95" transform="rotate(-23 744 435)"/>
    <ellipse cx="744" cy="435" rx="214" ry="112" stroke="#4ab1be" stroke-width="6" opacity="0.72" transform="rotate(-23 744 435)"/>
    <ellipse cx="744" cy="435" rx="332" ry="174" stroke="#4ab1be" stroke-width="5" opacity="0.48" transform="rotate(-23 744 435)"/>
    <ellipse cx="744" cy="435" rx="468" ry="246" stroke="#4ab1be" stroke-width="4" opacity="0.30" transform="rotate(-23 744 435)"/>
  </g>
  <circle cx="744" cy="435" r="18" fill="#f46b2a"/>
  <circle cx="744" cy="435" r="6" fill="#f6edcf"/>

  <!-- diagonal stress lines -->
  <g stroke="#f46b2a" stroke-linecap="square" opacity="0.92">
    <line x1="-40" y1="794" x2="1040" y2="-50" stroke-width="18"/>
    <line x1="105" y1="922" x2="1275" y2="-28" stroke-width="8"/>
    <line x1="380" y1="928" x2="1560" y2="-40" stroke-width="12" opacity="0.7"/>
    <line x1="-44" y1="548" x2="680" y2="-30" stroke-width="5" opacity="0.65"/>
  </g>

  <!-- seismograph traces -->
  <g fill="none" stroke="#f6edcf" stroke-linejoin="round" stroke-linecap="round" opacity="0.94">
    <path d="M74 168 L206 168 L226 132 L245 206 L263 91 L285 236 L308 118 L328 187 L410 187 L431 153 L447 198 L469 122 L490 215 L510 172 L661 172" stroke-width="7"/>
    <path d="M82 719 L210 719 L231 699 L248 741 L269 662 L292 783 L316 690 L339 730 L461 730 L480 710 L502 747 L525 668 L546 759 L569 718 L686 718" stroke="#0e2536" stroke-width="6" opacity="0.75"/>
  </g>

  <!-- wave marks -->
  <g fill="none" stroke="#4ab1be" stroke-width="9" stroke-linecap="round" opacity="0.92">
    <path d="M1114 211 C1148 185 1182 185 1217 211 C1251 237 1285 237 1320 211"/>
    <path d="M1184 274 C1218 248 1252 248 1287 274 C1321 300 1355 300 1390 274"/>
    <path d="M1067 746 C1101 720 1135 720 1170 746 C1204 772 1238 772 1273 746"/>
  </g>

  <!-- high-ground figures -->
  <g fill="#f6edcf" opacity="0.95">
    <circle cx="520" cy="291" r="9"/><path d="M520 303 l-11 38 h22 z"/>
    <circle cx="554" cy="307" r="7"/><path d="M554 318 l-9 31 h18 z"/>
    <circle cx="585" cy="286" r="8"/><path d="M585 298 l-10 34 h20 z"/>
    <circle cx="1242" cy="693" r="7"/><path d="M1242 704 l-9 29 h18 z"/>
  </g>

  <!-- registration slips -->
  <g opacity="0.28" stroke="#0e2536" stroke-width="3" fill="none">
    <path d="M-20 72 H506"/>
    <path d="M-20 806 H332"/>
    <path d="M1452 0 V900"/>
  </g>
  <rect x="0" y="0" width="1600" height="900" filter="url(#grain)" opacity="0.8"/>
</svg>
