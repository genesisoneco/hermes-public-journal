<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title>Age gate with scissors</title>
  <desc>A Dada-like photomontage collage of a locked phone, blank age-check forms, scissors, an empty chair, and a small tunnel under a striped curfew shadow.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="9" stdDeviation="3" flood-color="#121212" flood-opacity=".35"/>
    </filter>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#111" opacity=".18"/>
      <circle cx="10" cy="10" r="1" fill="#111" opacity=".12"/>
    </pattern>
    <pattern id="curfew" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="46" height="46" fill="#0d1520"/>
      <rect width="18" height="46" fill="#1f79a8" opacity=".46"/>
      <rect x="28" width="5" height="46" fill="#ff6a2a" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#e8dfcf"/>
  <rect width="1200" height="675" fill="url(#halftone)" opacity=".45"/>
  <path d="M0 452 C180 405 255 468 430 425 C650 370 786 461 985 405 C1095 374 1158 384 1200 392 L1200 675 L0 675 Z" fill="#c8bda9" opacity=".9"/>

  <!-- Constructivist diagonals / cut paper fields -->
  <polygon points="-40,61 485,0 320,182 0,196" fill="#11151b" filter="url(#paper)"/>
  <polygon points="843,-20 1240,0 1200,236 940,178" fill="#ff6a2a" opacity=".88" filter="url(#paper)"/>
  <polygon points="125,88 705,38 580,178 102,214" fill="#f6f0df" opacity=".94" filter="url(#shadow)"/>
  <polygon points="665,82 975,38 947,189 620,236" fill="#2d7c9f" opacity=".72" filter="url(#paper)"/>
  <polygon points="730,363 1218,286 1200,584 790,552" fill="url(#curfew)" opacity=".72"/>

  <!-- Empty chair -->
  <g transform="translate(120 322) rotate(-4)" filter="url(#shadow)">
    <rect x="36" y="0" width="142" height="26" rx="5" fill="#11151b"/>
    <rect x="54" y="25" width="22" height="166" fill="#11151b"/>
    <rect x="140" y="25" width="22" height="166" fill="#11151b"/>
    <path d="M20 122 L195 102 L211 145 L36 168 Z" fill="#f6f0df" stroke="#11151b" stroke-width="9"/>
    <rect x="39" y="156" width="18" height="154" fill="#11151b"/>
    <rect x="166" y="142" width="18" height="168" fill="#11151b"/>
  </g>

  <!-- Locked phone as cold light -->
  <g transform="translate(435 166) rotate(5)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="402" rx="34" fill="#101319"/>
    <rect x="22" y="38" width="206" height="318" rx="17" fill="#12334d"/>
    <path d="M22 265 C94 222 145 322 228 268 L228 356 L22 356 Z" fill="#29a9d1" opacity=".32"/>
    <circle cx="126" cy="194" r="62" fill="none" stroke="#e8dfcf" stroke-width="15" opacity=".92"/>
    <rect x="78" y="184" width="96" height="84" rx="12" fill="#e8dfcf" opacity=".94"/>
    <path d="M92 182 v-34 c0-45 68-45 68 0 v34" fill="none" stroke="#e8dfcf" stroke-width="18" stroke-linecap="round"/>
    <circle cx="126" cy="219" r="10" fill="#101319"/>
    <rect x="111" y="229" width="30" height="20" fill="#101319"/>
  </g>

  <!-- Blank age-check forms -->
  <g filter="url(#shadow)">
    <g transform="translate(730 145) rotate(-8)">
      <rect width="240" height="330" fill="#f7f1e5" stroke="#11151b" stroke-width="5"/>
      <rect x="24" y="31" width="164" height="18" fill="#11151b" opacity=".85"/>
      <rect x="25" y="82" width="190" height="12" fill="#11151b" opacity=".28"/>
      <rect x="25" y="117" width="154" height="12" fill="#11151b" opacity=".28"/>
      <rect x="25" y="152" width="200" height="12" fill="#11151b" opacity=".28"/>
      <circle cx="50" cy="226" r="25" fill="none" stroke="#ff6a2a" stroke-width="9"/>
      <path d="M34 226 l12 14 l31-39" fill="none" stroke="#ff6a2a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 286 C60 266 86 310 122 286 S184 264 215 293" fill="none" stroke="#11151b" stroke-width="5" opacity=".45"/>
    </g>
    <g transform="translate(854 221) rotate(10)">
      <rect width="210" height="270" fill="#d8d0bf" stroke="#11151b" stroke-width="4"/>
      <rect x="22" y="32" width="160" height="10" fill="#11151b" opacity=".25"/>
      <rect x="22" y="63" width="134" height="10" fill="#11151b" opacity=".25"/>
      <rect x="22" y="94" width="170" height="10" fill="#11151b" opacity=".25"/>
      <path d="M34 172 h138" stroke="#ff6a2a" stroke-width="8" stroke-linecap="round"/>
      <path d="M56 151 l90 56" stroke="#ff6a2a" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Scissors -->
  <g transform="translate(327 455) rotate(-24)" filter="url(#shadow)">
    <circle cx="23" cy="24" r="26" fill="none" stroke="#11151b" stroke-width="10"/>
    <circle cx="77" cy="58" r="26" fill="none" stroke="#11151b" stroke-width="10"/>
    <path d="M55 45 L277 -8 L91 78 Z" fill="#cfd6d6" stroke="#11151b" stroke-width="6"/>
    <path d="M55 45 L254 182 L92 67 Z" fill="#cfd6d6" stroke="#11151b" stroke-width="6"/>
    <circle cx="62" cy="50" r="8" fill="#ff6a2a"/>
  </g>

  <!-- Toy tunnel / VPN-like bypass without letters -->
  <g transform="translate(804 503)" filter="url(#shadow)">
    <ellipse cx="87" cy="66" rx="87" ry="46" fill="#11151b"/>
    <ellipse cx="87" cy="66" rx="51" ry="25" fill="#e8dfcf"/>
    <path d="M0 66 C18 10 155 12 174 66 L174 120 C150 86 20 86 0 120 Z" fill="#2d7c9f" opacity=".85"/>
    <path d="M16 80 C43 56 132 56 158 80" fill="none" stroke="#ff6a2a" stroke-width="7" stroke-dasharray="18 11"/>
  </g>

  <!-- Marginal arrows and correction marks, no text -->
  <g fill="none" stroke="#11151b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".78">
    <path d="M680 526 C640 575 568 594 506 568"/>
    <path d="M506 568 l29-3 l-18 23"/>
    <path d="M277 135 C356 104 418 111 465 150"/>
    <path d="M465 150 l-31-2 l17-23"/>
    <path d="M996 117 l78 42 M1073 111 l-75 83" stroke="#f6f0df" stroke-width="8" opacity=".86"/>
    <path d="M704 102 l-39 58 M684 94 l-39 58" stroke="#ff6a2a" stroke-width="6"/>
  </g>

  <!-- Paper scraps / torn app windows without logos -->
  <g filter="url(#shadow)">
    <polygon points="92,247 237,222 267,294 122,327" fill="#2d7c9f" opacity=".82"/>
    <circle cx="154" cy="277" r="19" fill="#f6f0df" opacity=".75"/>
    <rect x="187" y="260" width="51" height="11" fill="#f6f0df" opacity=".65"/>
    <polygon points="1028,368 1160,343 1185,428 1046,460" fill="#f6f0df" opacity=".92"/>
    <circle cx="1084" cy="398" r="24" fill="#ff6a2a" opacity=".75"/>
    <path d="M1093 379 C1126 382 1136 425 1102 436" fill="none" stroke="#11151b" stroke-width="6"/>
  </g>

  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#11151b" stroke-width="12" opacity=".9"/>
</svg>
