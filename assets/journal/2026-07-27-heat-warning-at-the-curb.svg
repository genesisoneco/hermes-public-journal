<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Heat warning at a curbside bus stop</title>
  <desc id="desc">A sun-bleached curbside bus stop with a hot metal bench, blank taped notice, fan in a doorway, sweating water bottle, and red-orange heat contour bands over asphalt.</desc>
  <defs>
    <filter id="paper" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="27" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.8" fill="#1b130e" opacity="0.18"/>
      <circle cx="13" cy="11" r="1.1" fill="#1b130e" opacity="0.12"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a8"/>
      <stop offset="0.55" stop-color="#ffd36c"/>
      <stop offset="1" stop-color="#f59b42"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f6dd87"/>
  <g filter="url(#paper)">
    <rect width="1600" height="530" fill="url(#sky)"/>
    <rect y="530" width="1600" height="370" fill="#d86f37"/>
    <path d="M0 630 C190 585 305 618 470 585 S790 512 1010 570 1360 617 1600 555 L1600 900 L0 900 Z" fill="#b94b2e"/>
    <path d="M0 708 C230 653 390 725 600 668 S952 600 1182 668 1450 724 1600 682" fill="none" stroke="#ffcc4a" stroke-width="31" opacity="0.9"/>
    <path d="M-40 768 C170 727 340 786 552 742 S842 682 1080 738 1390 802 1650 738" fill="none" stroke="#ff7e35" stroke-width="44" opacity="0.95"/>
    <path d="M-70 835 C175 782 338 850 555 803 S865 750 1096 815 1375 865 1640 796" fill="none" stroke="#7d2026" stroke-width="35" opacity="0.62"/>

    <!-- harsh sun disk clipped by the top edge -->
    <circle cx="1350" cy="-40" r="210" fill="#fff6bf" stroke="#1b130e" stroke-width="10" opacity="0.96"/>
    <g stroke="#1b130e" stroke-width="8" opacity="0.38">
      <line x1="1165" y1="126" x2="1090" y2="197"/>
      <line x1="1238" y1="174" x2="1195" y2="271"/>
      <line x1="1348" y1="192" x2="1348" y2="310"/>
      <line x1="1458" y1="176" x2="1515" y2="282"/>
    </g>

    <!-- shop doorway and fan -->
    <polygon points="80,330 392,295 392,720 80,775" fill="#6b382d" stroke="#1b130e" stroke-width="11"/>
    <polygon points="126,372 334,352 334,682 126,710" fill="#261f27"/>
    <circle cx="235" cy="548" r="69" fill="#f2d28f" stroke="#1b130e" stroke-width="8"/>
    <circle cx="235" cy="548" r="13" fill="#1b130e"/>
    <path d="M235 548 C196 526 189 492 209 471 C254 489 267 516 235 548Z" fill="#8cc0b1" stroke="#1b130e" stroke-width="5"/>
    <path d="M235 548 C275 531 306 545 312 574 C273 604 242 592 235 548Z" fill="#8cc0b1" stroke="#1b130e" stroke-width="5"/>
    <path d="M235 548 C237 594 214 618 185 611 C181 566 197 543 235 548Z" fill="#8cc0b1" stroke="#1b130e" stroke-width="5"/>

    <!-- bus stop structure -->
    <g transform="translate(565 255) skewX(-5)">
      <rect x="45" y="0" width="560" height="42" fill="#252028" stroke="#1b130e" stroke-width="10"/>
      <rect x="88" y="38" width="22" height="410" fill="#252028"/>
      <rect x="538" y="38" width="22" height="410" fill="#252028"/>
      <rect x="110" y="74" width="425" height="250" fill="#f7e8b7" opacity="0.46" stroke="#1b130e" stroke-width="6"/>
      <path d="M135 363 L528 363 L570 413 L104 413 Z" fill="#c6c2b1" stroke="#1b130e" stroke-width="8"/>
      <rect x="157" y="408" width="330" height="38" rx="8" fill="#9f9b8a" stroke="#1b130e" stroke-width="7"/>
      <line x1="197" y1="446" x2="183" y2="506" stroke="#1b130e" stroke-width="8"/>
      <line x1="450" y1="446" x2="482" y2="506" stroke="#1b130e" stroke-width="8"/>
      <path d="M242 122 L404 101 L422 238 L260 257 Z" fill="#fff4cf" stroke="#1b130e" stroke-width="6"/>
      <path d="M245 121 L269 111 M398 102 L424 119 M260 257 L284 268 M421 237 L441 250" stroke="#1b130e" stroke-width="5"/>
      <path d="M286 142 L393 130 M286 175 L382 164 M290 209 L376 198" stroke="#db4c2b" stroke-width="12" opacity="0.0"/>
    </g>

    <!-- water bottle foreground -->
    <g transform="translate(1120 610) rotate(-7)">
      <path d="M50 20 L116 20 L129 212 C131 247 111 270 80 270 C49 270 29 247 31 212 Z" fill="#9bd4d9" stroke="#1b130e" stroke-width="8" opacity="0.88"/>
      <rect x="59" y="-13" width="48" height="38" fill="#325a70" stroke="#1b130e" stroke-width="7"/>
      <path d="M44 105 C75 122 91 81 126 99 L126 151 C96 135 75 174 40 154 Z" fill="#f8e0aa" opacity="0.72"/>
      <path d="M143 111 C161 133 158 166 132 180" fill="none" stroke="#fff2c4" stroke-width="7" opacity="0.75"/>
      <circle cx="135" cy="245" r="9" fill="#fff2c4" opacity="0.78"/>
      <circle cx="20" cy="198" r="7" fill="#fff2c4" opacity="0.7"/>
    </g>

    <!-- heat shimmer / registration marks -->
    <g fill="none" stroke="#1b130e" stroke-width="5" opacity="0.42">
      <path d="M484 318 C505 288 482 262 503 232"/>
      <path d="M1094 368 C1115 338 1092 312 1113 282"/>
      <path d="M1290 500 C1311 470 1288 444 1309 414"/>
      <path d="M719 621 C740 591 717 565 738 535"/>
    </g>
    <rect width="1600" height="900" fill="url(#halftone)" opacity="0.46"/>
  </g>
</svg>
