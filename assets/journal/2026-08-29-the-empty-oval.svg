<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Shattered museum case with an absent necklace</title>
  <desc id="desc">A nocturnal angular collage of a shattered museum display case, an empty necklace bust, scattered diamond points, a torn ticket shape, and two blurred exit shadows.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="29"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.16"/></feComponentTransfer>
    </filter>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#152237"/>
      <stop offset="0.42" stop-color="#20364a"/>
      <stop offset="1" stop-color="#08101c"/>
    </linearGradient>
    <radialGradient id="caseGlow" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="#d9f2ff" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#6a9fb5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#03101a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#07101c"/>
  <path d="M0 560 L1600 410 L1600 900 L0 900 Z" fill="url(#floor)"/>
  <path d="M0 565 L1600 414" stroke="#6e8794" stroke-width="2" opacity="0.34"/>
  <path d="M0 710 L1600 545" stroke="#6e8794" stroke-width="1" opacity="0.20"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.75"/>

  <!-- constructivist diagonal pressure -->
  <path d="M-80 160 L1010 30 L940 128 L-40 300 Z" fill="#1e4f63" opacity="0.35"/>
  <path d="M585 -50 L1710 835 L1620 930 L520 120 Z" fill="#27445a" opacity="0.28"/>
  <path d="M1030 30 L1600 210 L1600 294 L970 118 Z" fill="#31465a" opacity="0.45"/>

  <!-- case glow -->
  <ellipse cx="785" cy="480" rx="580" ry="350" fill="url(#caseGlow)"/>

  <!-- broken glass display cube -->
  <polygon points="498,165 1004,94 1135,612 616,715" fill="#bfe9ff" opacity="0.08" stroke="#bee8ff" stroke-width="6"/>
  <polyline points="498,165 642,274 616,715" fill="none" stroke="#d9f5ff" stroke-width="3" opacity="0.45"/>
  <polyline points="1004,94 930,270 1135,612" fill="none" stroke="#d9f5ff" stroke-width="3" opacity="0.38"/>
  <polyline points="642,274 930,270" fill="none" stroke="#d9f5ff" stroke-width="2" opacity="0.34"/>
  <path d="M642 274 L722 405 L610 504 L710 606 L616 715" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.62"/>
  <path d="M930 270 L820 340 L856 454 L790 572 L925 655" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
  <path d="M498 165 L565 342 L510 420 L604 492" fill="none" stroke="#a8e7ff" stroke-width="2" opacity="0.55"/>
  <path d="M1004 94 L1058 240 L1010 318 L1095 410" fill="none" stroke="#a8e7ff" stroke-width="2" opacity="0.48"/>

  <!-- empty velvet bust -->
  <path d="M756 282 C690 318 652 400 658 508 C663 612 599 657 560 690 L982 642 C929 605 895 558 904 470 C916 356 852 296 756 282 Z" fill="#090c14" stroke="#3e5768" stroke-width="5"/>
  <path d="M703 389 C742 344 824 341 864 381" fill="none" stroke="#435160" stroke-width="12" opacity="0.75"/>
  <ellipse cx="768" cy="475" rx="122" ry="69" fill="none" stroke="#c9eafd" stroke-width="3" opacity="0.20" stroke-dasharray="10 22"/>
  <path d="M663 566 C747 618 842 612 912 544" fill="none" stroke="#1e2b39" stroke-width="16" opacity="0.9"/>

  <!-- absence: pearl-prong orbit without necklace -->
  <g fill="#f6fbff" opacity="0.92">
    <circle cx="646" cy="545" r="4"/><circle cx="669" cy="562" r="3"/><circle cx="693" cy="575" r="5"/>
    <circle cx="722" cy="585" r="3"/><circle cx="755" cy="590" r="4"/><circle cx="789" cy="589" r="3"/>
    <circle cx="823" cy="581" r="5"/><circle cx="852" cy="566" r="3"/><circle cx="878" cy="546" r="4"/>
  </g>

  <!-- scattered diamonds -->
  <g fill="#ffffff" stroke="#aee6ff" stroke-width="1" opacity="0.94">
    <polygon points="250,760 260,746 274,759 262,774"/><polygon points="318,706 329,690 344,706 330,719"/>
    <polygon points="415,803 426,786 441,801 429,817"/><polygon points="515,742 526,728 539,744 524,758"/>
    <polygon points="602,797 614,780 629,797 615,812"/><polygon points="695,730 708,713 725,731 709,747"/>
    <polygon points="805,785 817,768 832,784 818,800"/><polygon points="918,711 929,697 946,713 931,729"/>
    <polygon points="1056,760 1068,742 1085,759 1069,776"/><polygon points="1185,688 1198,671 1216,689 1199,704"/>
    <polygon points="1290,800 1302,784 1320,802 1303,816"/><polygon points="1390,726 1402,710 1417,727 1404,742"/>
  </g>
  <g fill="#caefff" opacity="0.58">
    <circle cx="370" cy="762" r="2"/><circle cx="456" cy="712" r="2"/><circle cx="548" cy="825" r="2"/><circle cx="653" cy="689" r="2"/>
    <circle cx="734" cy="807" r="2"/><circle cx="870" cy="738" r="2"/><circle cx="980" cy="820" r="2"/><circle cx="1122" cy="719" r="2"/>
    <circle cx="1244" cy="760" r="2"/><circle cx="1342" cy="670" r="2"/><circle cx="1460" cy="812" r="2"/>
  </g>

  <!-- torn ticket with no readable text -->
  <path d="M240 535 L410 505 L438 590 L268 622 C250 598 280 579 252 560 C246 553 241 545 240 535 Z" fill="#d6c6a2" opacity="0.80"/>
  <path d="M278 555 L389 533" stroke="#7d6c4c" stroke-width="5" opacity="0.55"/>
  <path d="M291 584 L410 562" stroke="#7d6c4c" stroke-width="3" opacity="0.38"/>

  <!-- security camera and fleeing shadows -->
  <g opacity="0.86">
    <path d="M1280 110 L1438 92 L1452 148 L1296 172 Z" fill="#121721" stroke="#5f7686" stroke-width="5"/>
    <circle cx="1409" cy="121" r="19" fill="#06101a" stroke="#94e4ff" stroke-width="4"/>
    <path d="M1398 124 L1180 515" stroke="#7fdcff" stroke-width="3" opacity="0.16"/>
  </g>
  <path d="M1320 516 C1368 486 1428 505 1452 560 C1410 575 1356 570 1308 544 Z" fill="#06101a" opacity="0.72"/>
  <path d="M1438 484 C1488 460 1544 480 1564 535 C1522 548 1475 542 1430 514 Z" fill="#06101a" opacity="0.64"/>

  <!-- glass shards -->
  <g fill="#dff6ff" opacity="0.35" stroke="#ffffff" stroke-width="1">
    <polygon points="470,260 522,320 443,344"/><polygon points="1088,344 1165,384 1108,430"/>
    <polygon points="558,652 606,716 520,704"/><polygon points="1014,642 1110,618 1062,688"/>
    <polygon points="748,238 786,304 704,292"/><polygon points="896,220 954,260 887,295"/>
  </g>
</svg>
