<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">A Gentle Probability</title>
  <desc id="desc">Abstract dawn-colored orbits and translucent circles gathering around a small luminous center.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="36%" stop-color="#23304f"/>
      <stop offset="72%" stop-color="#6e4968"/>
      <stop offset="100%" stop-color="#f0a66c"/>
    </linearGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.9"/>
      <stop offset="24%" stop-color="#f9c879" stop-opacity="0.46"/>
      <stop offset="62%" stop-color="#8dd7ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8dd7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aee8ff" stop-opacity="0.72"/>
      <stop offset="70%" stop-color="#4e8dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4e8dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bfeaff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#bfeaff" stop-opacity="0.58"/>
      <stop offset="72%" stop-color="#ffe7a6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffe7a6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="788" fill="url(#sky)"/>
  <circle cx="1080" cy="178" r="330" fill="url(#blueGlow)" filter="url(#soft)" opacity="0.7"/>
  <circle cx="420" cy="612" r="390" fill="#16213c" opacity="0.34" filter="url(#soft)"/>
  <circle cx="700" cy="394" r="265" fill="url(#haze)" opacity="0.78"/>

  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <ellipse cx="700" cy="394" rx="480" ry="118" stroke-width="2.4" transform="rotate(-14 700 394)" opacity="0.72"/>
    <ellipse cx="700" cy="394" rx="360" ry="88" stroke-width="1.8" transform="rotate(24 700 394)" opacity="0.54"/>
    <ellipse cx="700" cy="394" rx="250" ry="62" stroke-width="1.4" transform="rotate(-48 700 394)" opacity="0.42"/>
  </g>

  <g opacity="0.62">
    <circle cx="362" cy="270" r="70" fill="#c5ebff" opacity="0.08"/>
    <circle cx="1016" cy="478" r="96" fill="#ffe4a3" opacity="0.1"/>
    <circle cx="536" cy="520" r="44" fill="#ffffff" opacity="0.09"/>
    <circle cx="872" cy="242" r="54" fill="#ffb6a6" opacity="0.1"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="700" cy="394" r="36" fill="#fff8dc" opacity="0.95"/>
    <circle cx="700" cy="394" r="12" fill="#ffffff"/>
    <circle cx="472" cy="326" r="7" fill="#bfeaff"/>
    <circle cx="928" cy="452" r="8" fill="#ffe19a"/>
    <circle cx="610" cy="206" r="5" fill="#f9c879"/>
    <circle cx="784" cy="590" r="6" fill="#aee8ff"/>
  </g>

  <g fill="#ffffff" opacity="0.62">
    <circle cx="126" cy="146" r="1.4"/><circle cx="218" cy="508" r="1.1"/>
    <circle cx="332" cy="92" r="1.2"/><circle cx="514" cy="692" r="1.3"/>
    <circle cx="812" cy="112" r="1.5"/><circle cx="990" cy="670" r="1.2"/>
    <circle cx="1168" cy="300" r="1.4"/><circle cx="1282" cy="584" r="1.1"/>
  </g>
</svg>
