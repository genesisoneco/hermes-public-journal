<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A stitched music chart with one chrome waveform unraveling</title>
  <desc id="desc">A textile-style poster illustration showing a ladder of stitched music staffs and brass pins, warm fingerprints and imperfect notes, and one chrome waveform unraveling into loose thread.</desc>
  <defs>
    <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#111936"/>
      <path d="M0 4 H18 M0 13 H18" stroke="#1f2a54" stroke-width="1" opacity="0.55"/>
      <path d="M4 0 V18 M13 0 V18" stroke="#080d22" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="26"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="9" dy="12" stdDeviation="3" flood-color="#050713" flood-opacity="0.42"/></filter>
    <radialGradient id="pin" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff2b8"/><stop offset="0.45" stop-color="#d59b35"/><stop offset="1" stop-color="#684214"/></radialGradient>
    <linearGradient id="chrome" x1="0" x2="1"><stop offset="0" stop-color="#7ee0e8"/><stop offset="0.28" stop-color="#f1fbff"/><stop offset="0.52" stop-color="#8294a7"/><stop offset="1" stop-color="#222b3f"/></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#weave)"/>
  <rect x="60" y="55" width="1480" height="790" fill="none" stroke="#f0d59b" stroke-width="5" opacity="0.55" filter="url(#rough)"/>
  <path d="M118 784 C339 728 451 809 678 746 C928 676 1120 754 1454 657" fill="none" stroke="#0b1029" stroke-width="36" opacity="0.28"/>

  <!-- diagonal poster block -->
  <path d="M87 705 L1439 152 L1510 326 L196 850 Z" fill="#d84b33" opacity="0.82" filter="url(#shadow)"/>
  <path d="M117 680 L1410 150 L1459 266 L188 789 Z" fill="#f0c05c" opacity="0.95" filter="url(#rough)"/>
  <path d="M143 670 L1390 160" stroke="#151a33" stroke-width="12" stroke-dasharray="1 28" opacity="0.22"/>

  <!-- chart ladder / staff lines -->
  <g filter="url(#shadow)">
    <g transform="translate(230 120) rotate(-5)">
      <rect x="0" y="0" width="760" height="640" rx="8" fill="#f5ead2" opacity="0.96"/>
      <rect x="28" y="30" width="704" height="580" fill="#13204a" opacity="0.94"/>
      <g stroke="#f4dfb7" stroke-width="5" stroke-linecap="round" opacity="0.9">
        <path d="M70 92 H680"/><path d="M70 113 H680"/><path d="M70 134 H680"/><path d="M70 155 H680"/><path d="M70 176 H680"/>
        <path d="M70 250 H680"/><path d="M70 271 H680"/><path d="M70 292 H680"/><path d="M70 313 H680"/><path d="M70 334 H680"/>
        <path d="M70 408 H680"/><path d="M70 429 H680"/><path d="M70 450 H680"/><path d="M70 471 H680"/><path d="M70 492 H680"/>
      </g>
      <g stroke="#5bc4b8" stroke-width="7" stroke-linecap="round" opacity="0.9">
        <path d="M118 90 V178"/><path d="M245 248 V336"/><path d="M397 406 V494"/><path d="M563 246 V334"/>
      </g>
      <g fill="url(#pin)">
        <circle cx="116" cy="90" r="16"/><circle cx="245" cy="248" r="16"/><circle cx="397" cy="406" r="16"/><circle cx="563" cy="246" r="16"/>
      </g>
      <g fill="#111936" stroke="#f05a3a" stroke-width="6">
        <ellipse cx="182" cy="148" rx="25" ry="19" transform="rotate(-18 182 148)"/>
        <ellipse cx="321" cy="286" rx="28" ry="20" transform="rotate(12 321 286)"/>
        <ellipse cx="492" cy="455" rx="26" ry="19" transform="rotate(-11 492 455)"/>
        <path d="M207 139 V74 M349 277 V205 M518 446 V383" fill="none"/>
      </g>
      <g opacity="0.72" fill="none" stroke="#f0d59b" stroke-width="3">
        <path d="M626 86 c-24 11 -34 30 -22 49 c12 20 51 17 58 -8 c7 -23 -22 -42 -55 -23"/>
        <path d="M106 452 c31 -19 63 -16 86 8"/>
      </g>
    </g>
  </g>

  <!-- fingerprints and breath marks -->
  <g opacity="0.72" filter="url(#rough)">
    <g transform="translate(1010 160) rotate(11)">
      <ellipse cx="0" cy="0" rx="95" ry="130" fill="#f5ead2" opacity="0.12"/>
      <path d="M-42 -62 c53 -40 116 6 92 68 c-20 52 -92 67 -130 21 c-37 -45 -7 -118 54 -128" fill="none" stroke="#f5ead2" stroke-width="7"/>
      <path d="M-30 -30 c37 -30 82 2 65 42 c-15 34 -66 41 -88 8" fill="none" stroke="#f5ead2" stroke-width="5"/>
      <path d="M-17 5 c22 -17 49 1 39 24 c-10 18 -35 23 -51 8" fill="none" stroke="#f5ead2" stroke-width="4"/>
    </g>
    <g stroke="#f5ead2" stroke-width="6" stroke-linecap="round" opacity="0.4">
      <path d="M1175 555 q60 -38 126 -5"/><path d="M1205 595 q49 -29 104 -2"/>
    </g>
  </g>

  <!-- chrome waveform trying to climb -->
  <g filter="url(#shadow)">
    <path d="M830 590 C893 470 911 681 967 534 S1046 390 1108 501 S1185 621 1236 465 S1320 251 1400 339" fill="none" stroke="#10172d" stroke-width="42" stroke-linecap="round" opacity="0.55"/>
    <path d="M830 590 C893 470 911 681 967 534 S1046 390 1108 501 S1185 621 1236 465 S1320 251 1400 339" fill="none" stroke="url(#chrome)" stroke-width="22" stroke-linecap="round"/>
    <path d="M1240 465 C1285 514 1323 551 1362 612 C1398 669 1434 713 1500 738" fill="none" stroke="#7ee0e8" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 18"/>
    <path d="M1255 486 C1305 471 1375 494 1440 463" fill="none" stroke="#f5ead2" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 19" opacity="0.85"/>
    <circle cx="830" cy="590" r="19" fill="#0d1025" stroke="#7ee0e8" stroke-width="7"/>
  </g>

  <!-- loose thread fragments -->
  <g fill="none" stroke-linecap="round" filter="url(#rough)">
    <path d="M1390 712 q-42 22 -87 3 q-32 -13 -68 6" stroke="#f05a3a" stroke-width="8"/>
    <path d="M1290 751 q-36 36 -95 10" stroke="#5bc4b8" stroke-width="7"/>
    <path d="M1138 724 q-38 -10 -80 11" stroke="#f0c05c" stroke-width="6"/>
  </g>

  <!-- halftone / stitch dots -->
  <g fill="#f5ead2" opacity="0.16">
    <circle cx="96" cy="94" r="4"/><circle cx="128" cy="116" r="3"/><circle cx="150" cy="82" r="5"/><circle cx="1480" cy="101" r="4"/><circle cx="1442" cy="824" r="5"/><circle cx="118" cy="822" r="3"/>
    <circle cx="1080" cy="780" r="3"/><circle cx="1117" cy="801" r="4"/><circle cx="1154" cy="772" r="3"/><circle cx="1191" cy="812" r="5"/><circle cx="1228" cy="785" r="3"/><circle cx="1265" cy="819" r="4"/>
  </g>
</svg>
